# Permissive on purpose: editing a Dockerfile only to satisfy a rule rebuilds hours of layers.
failure-threshold: warning

ignored:
  # OS packages are pinned by the digest-pinned Ubuntu base, not per package.
  - DL3008
  # Build scripts own directory handling; RUN-level cds are subshell-scoped.
  - DL3003
  # Install scripts set their own strict mode; RUN lines mostly exec one script.
  - DL4006
  # The chain passes a digest-pinned BASE_IMAGE build arg hadolint cannot see.
  - DL3006
  # :latest / floating default in ARG-driven FROMs (same BASE_IMAGE pattern).
  - DL3007
  # Shell-form ENTRYPOINT/CMD is intentional: entrypoints need env and PATH expansion.
  - DL3025
  # Windows COPY destinations end in a backslash, which hadolint rejects.
  - DL3021
  # PowerShell RUN lines are not sh; shellcheck misparses backtick continuations.
  - SC1133
  # Linux RUN one-liners use bash features that shellcheck's POSIX-sh persona flags.
  - SC3040
  - SC3045
  - SC3046
  - SC3054
  # RUN heredocs deliberately use `#!/usr/bin/env bash` shebangs.
  - SC2239
  # ENV PATH=/new:${PATH} is the chain's pattern for stacking tool paths per stage.
  - DL3044
  # FROM --platform=${ARTIFACT_PLATFORM} is Dockerfile.package's artifact handoff.
  - DL3029
  # Build scripts pin pip installs; the one inline pip RUN bootstraps them.
  - DL3013
