name: 'Benchmark history'
description: >-
  Compares one benchmark result (criterion, google-benchmark, flutter-frame or orchestrant-bench)
  with the median of up to 20 earlier default-branch results read through the Actions API,
  writes the table into the step summary, fails when a gated metric doubles or the result is
  missing, and stores the result as artifact bench-history-<key> for 90 days. In a private
  repository the calling job needs `actions: read`. See docs/code-quality-tooling.md#benchmark-history.

inputs:
  key:
    description: 'History key, one per benchmark set, runner and arch, for example `criterion-x64`.'
    required: true
  format:
    description: 'criterion | google-benchmark | flutter-frame | orchestrant-bench.'
    required: true
  result:
    description: 'The run''s result file, or Criterion''s output directory.'
    required: true
  metrics:
    description: >-
      JSON object of metric globs: {"<glob>": {"direction": "lower"|"higher", "gate": true}}.
      An undeclared metric is shown and never judged.
    required: false
    default: '{}'
  keep:
    description: 'How many earlier default-branch results the median spans.'
    required: false
    default: '20'
  warn:
    description: 'Worse than the median by this fraction warns.'
    required: false
    default: '0.25'
  token:
    description: 'Token that reads the repository''s artifacts.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Read earlier results
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KEY: ${{ inputs.key }}
        KEEP: ${{ inputs.keep }}
        BRANCH: ${{ github.event.repository.default_branch }}
        TOOL: ${{ github.action_path }}/../../../linux/scripts/bench-history.py
      run: |
        rm -rf "${RUNNER_TEMP}/bench-history-${KEY}"
        python3 "${TOOL}" fetch --key "${KEY}" --keep "${KEEP}" --branch "${BRANCH}" \
          --dest "${RUNNER_TEMP}/bench-history-${KEY}/earlier"

    - name: Compare with earlier results
      id: report
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        FORMAT: ${{ inputs.format }}
        RESULT: ${{ inputs.result }}
        METRICS: ${{ inputs.metrics }}
        WARN: ${{ inputs.warn }}
        TOOL: ${{ github.action_path }}/../../../linux/scripts/bench-history.py
      run: |
        printf '### Benchmarks: %s\n\n' "${KEY}" >> "${GITHUB_STEP_SUMMARY}"
        python3 "${TOOL}" report --format "${FORMAT}" --result "${RESULT}" --key "${KEY}" \
          --history "${RUNNER_TEMP}/bench-history-${KEY}/earlier" --metrics "${METRICS}" --warn "${WARN}" \
          --write "${RUNNER_TEMP}/bench-history-${KEY}/out/bench-history-${KEY}.json" | tee -a "${GITHUB_STEP_SUMMARY}"

    # A failed comparison is stored too, marked failed, so the history never takes its slowdown as the yardstick.
    - name: Store this result
      if: always() && steps.report.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bench-history-${{ inputs.key }}
        path: ${{ runner.temp }}/bench-history-${{ inputs.key }}/out/
        retention-days: 90
        if-no-files-found: error
