name: 'Clone into a short path (Windows MAX_PATH)'
description: >-
  Clones the repository, submodules and all, into a SHORT directory such as
  D:\ws, because actions/checkout cannot on Windows when the submodule chain is
  deep.

  The runner's workspace is D:\a\<repo>\<repo> - the repository name twice,
  ~71 characters before any content. Add a transitive submodule chain and the
  .git/modules/.../config path passes 260 characters, which core.longpaths does
  NOT reliably bypass for those child clones. Cloning to a short root keeps the
  same chain comfortably inside the limit.

  It also rewrites SSH submodule URLs to token HTTPS. .gitmodules commonly pins
  git@github.com: URLs and a hosted runner has no SSH key, so `git submodule
  update` otherwise dies with "Permission denied (publickey)" on every one -
  the same rewrite actions/checkout installs for itself.

inputs:
  target:
    description: 'Destination path in git (MSYS) form, e.g. /d/ws.'
    required: false
    default: '/d/ws'
  repository:
    description: 'owner/name to clone. Defaults to the current repository.'
    required: false
    default: ''
  ref:
    description: >-
      Commit/ref to check out. Defaults to the triggering SHA. A SHA or ref the
      clone lacks (a pull_request's merge commit, refs/pull/<n>/merge) is fetched
      from origin first.
    required: false
    default: ''
  token:
    description: 'Token used for HTTPS clone and for the SSH->HTTPS rewrite.'
    required: true
  submodules:
    description: 'Set to false to skip `submodule update --init --recursive`.'
    required: false
    default: 'true'
  exclude-submodules:
    description: >-
      Submodule NAMES (as declared in .gitmodules, one per line) to skip during
      the recursive update, together with everything beneath them.

      A short clone root fixes MAX_PATH, but not git's OWN limit: past a certain
      depth `git submodule update --recursive` dies with

        fatal: '$GIT_DIR' too big
        fatal: remote helper 'https' aborted session

      because each nesting level inserts another `.git/modules/<name>/` segment
      and the GIT_DIR handed to the remote helper eventually will not fit. No
      clone root is short enough to save a chain that is deep enough - the only
      cure is not to descend it.

      Names are matched by git's normal config lookup, which nested `git
      submodule` invocations perform too, so an entry prunes that submodule at
      EVERY level it appears. Use it for subtrees a given lane does not build
      with (documentation/asset chains being the usual offenders).
    required: false
    default: ''

outputs:
  fetched:
    description: >-
      'true' when the ref was not in the plain clone and had to be fetched from
      origin (the pull_request merge-ref path), else 'false'.
    value: ${{ steps.clone.outputs.fetched }}

runs:
  using: 'composite'
  steps:
    - id: clone
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TARGET: ${{ inputs.target }}
        REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
        REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        WANT_SUBMODULES: ${{ inputs.submodules }}
        EXCLUDE_SUBMODULES: ${{ inputs.exclude-submodules }}
      run: |
        git config --global core.longpaths true
        # .gitmodules uses SSH URLs and the runner has no key; rewrite to token HTTPS as actions/checkout does.
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"

        # Global config: it is the only scope every nested --recursive process reads; .active and .update gate different stages, so set both.
        if [ -n "${EXCLUDE_SUBMODULES}" ]; then
          while IFS= read -r sm; do
            sm="${sm%$'\r'}"
            [ -n "${sm}" ] || continue
            echo "Excluding submodule from recursive update: ${sm}"
            git config --global "submodule.${sm}.active" false
            git config --global "submodule.${sm}.update" none
          done <<< "${EXCLUDE_SUBMODULES}"
        fi

        rm -rf "${TARGET}"
        git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${TARGET}"
        # A pull_request's github.sha is the merge commit under refs/pull/<n>/merge, which a clone never fetches.
        fetched=false
        checkout_ref="${REF}"
        if ! git -C "${TARGET}" cat-file -e "${REF}^{commit}" 2>/dev/null; then
          echo "${REF} is not in the clone; fetching it from origin"
          git -C "${TARGET}" fetch --no-tags origin "${REF}"
          fetched=true
          # A fetched ref NAME (refs/pull/<n>/merge) lands only in FETCH_HEAD, never as a local ref.
          if ! git -C "${TARGET}" cat-file -e "${REF}^{commit}" 2>/dev/null; then
            checkout_ref="$(git -C "${TARGET}" rev-parse FETCH_HEAD)"
          fi
        fi
        git -C "${TARGET}" checkout --force "${checkout_ref}"
        echo "Checked out ${REF} at $(git -C "${TARGET}" rev-parse HEAD) (fetched=${fetched})"
        echo "fetched=${fetched}" >> "${GITHUB_OUTPUT}"
        if [ "${WANT_SUBMODULES}" = "true" ]; then
          git -C "${TARGET}" submodule update --init --recursive
        fi
