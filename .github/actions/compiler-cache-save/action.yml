name: 'Save compiler cache'
description: >-
  Saves the directory compiler-cache-restore prepared, under a per-run key, so
  the next run restores it. Call it with `if: always()` so a red build still
  saves what it compiled. Before saving it deletes this key's older entries on
  this ref, so each key holds one entry and the repository stays under its
  cache quota (the caller needs `permissions: actions: write`).

inputs:
  key:
    description: 'The same lane id that was passed to compiler-cache-restore.'
    required: true
  enabled:
    description: >-
      `auto` saves on pushes to the default branch only. Pull requests,
      dispatches and pushes to other branches (a release push to `main`)
      restore the default branch's entry without spending cache quota: the
      deletion before a save works per branch, so a second branch would hold
      a second generation of every key. `true` always saves, `false` never.
    required: false
    default: 'auto'
  path:
    description: >-
      The directory to save. The default is where compiler-cache-restore
      restored; the Windows container lane saves its workspace's .ci-cache.
    required: false
    default: ''
  token:
    description: >-
      Deletes the older entries. Without `actions: write` the deletion is
      refused, and the step warns and saves anyway.
    required: false
    default: ${{ github.token }}

outputs:
  saved:
    description: '`true` when this step saved the cache, `false` when it skipped.'
    value: ${{ steps.decide.outputs.saved }}
  pruned:
    description: 'How many older entries of this key this step deleted.'
    value: ${{ steps.prune.outputs.pruned }}

runs:
  using: composite
  steps:
    - name: Decide
      id: decide
      shell: bash
      env:
        SAVE_ENABLED: ${{ inputs.enabled }}
        EVENT_NAME: ${{ github.event_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SAVE_PATH: ${{ inputs.path != '' && inputs.path || format('{0}/compiler-cache', runner.temp) }}
      run: |
        set -euo pipefail
        on_default=false
        if [[ "${EVENT_NAME}" == push && -n "${DEFAULT_BRANCH}" && "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
          on_default=true
        fi
        case "${SAVE_ENABLED}" in
          true) saved=true ;;
          false) saved=false ;;
          auto) saved="${on_default}" ;;
          *) echo "::error::enabled must be auto, true or false, not '${SAVE_ENABLED}'"; exit 1 ;;
        esac
        echo "saved=${saved}" >> "${GITHUB_OUTPUT}"
        echo "path=${SAVE_PATH}" >> "${GITHUB_OUTPUT}"

    # Deletes the entries this key's older runs left, before this one adds its own, so
    # the key keeps one entry and GitHub's quota eviction never reaches another key's
    # only one (compiler-cache-prune/prune.sh says why).
    - name: Delete this key's older entries
      id: prune
      if: steps.decide.outputs.saved == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CACHE_KEY: ${{ inputs.key }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        SAVE_PATH: ${{ steps.decide.outputs.path }}
      run: |
        set -euo pipefail
        # Nothing to save (a build that died before the cache existed) keeps the old entry.
        dir="${SAVE_PATH}"
        if command -v cygpath > /dev/null; then dir="$(cygpath -u "${dir}")"; fi
        if [[ ! -d "${dir}" ]] || [[ -z "$(ls -A "${dir}")" ]]; then
          echo "::warning::${SAVE_PATH} is missing or empty; keeping this key's older entries"
          echo "pruned=0" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        bash "${GITHUB_ACTION_PATH}/../compiler-cache-prune/prune.sh"

    - name: Save the cache
      if: steps.decide.outputs.saved == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.decide.outputs.path }}
        key: compiler-cache-${{ inputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
