name: Windows clean-host GPU package check
description: Run a trusted clean-host check on immutable Windows GPU packages and record their bytes.
inputs:
  artifact-id:
    description: Current-run artifact ID from the trusted producer resolver.
    required: true
  artifact-digest:
    description: SHA-256 digest from the trusted producer resolver.
    required: true
  artifact-files:
    description: Exact portable filenames from the trusted producer resolver, one per line.
    required: true
  gpu-vendor:
    description: nvidia or amd.
    required: true
  gpu-receipt:
    description: New absolute path for the resulting clean-host receipt.
    required: true
  producer-receipt:
    description: Current-attempt producer receipt already validated by the shared resolver.
    required: true
  check-script:
    description: Trusted PowerShell script which checks GPU_PACKAGE_DIR and exits successfully only after CPU inference.
    required: true
  max-uncompressed-bytes:
    description: Maximum total extracted archive size.
    required: true
  max-compression-ratio:
    description: Maximum compression ratio per archive entry.
    required: true
runs:
  using: composite
  steps:
    - name: Check current-run artifact metadata
      id: metadata
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
      with:
        script: |
          const id = Number(process.env.GPU_ARTIFACT_ID);
          if (!/^[1-9][0-9]*$/.test(process.env.GPU_ARTIFACT_ID) || !Number.isSafeInteger(id)) throw new Error('Invalid artifact ID');
          const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: id});
          const expected = process.env.GPU_ARTIFACT_DIGEST.replace(/^sha256:/, '');
          if (artifact.expired !== false || !/^[a-f0-9]{64}$/.test(expected) || artifact.workflow_run.id !== context.runId || artifact.workflow_run.head_sha !== context.sha || artifact.digest !== `sha256:${expected}` || !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0) throw new Error('Artifact identity or size mismatch');
          core.setOutput('size', String(artifact.size_in_bytes));
    - name: Allocate clean-host scratch
      id: scratch
      shell: pwsh
      env:
        GPU_ARCHIVE_SIZE: ${{ steps.metadata.outputs.size }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'A fresh GitHub-hosted Windows x64 runner is required' }
        $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:RUNNER_TEMP)))
        if (($drive.AvailableFreeSpace - [long]$env:GPU_ARCHIVE_SIZE) -lt 4GB) { throw 'Insufficient space for the GPU artifact' }
        $root = Join-Path $env:RUNNER_TEMP ('windows-gpu-clean-' + [guid]::NewGuid().ToString('N'))
        $null = New-Item -ItemType Directory -Path $root -ErrorAction Stop
        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$root"
    - name: Download immutable candidate archive
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ steps.scratch.outputs.root }}/archive
        skip-decompress: true
        digest-mismatch: error
    - name: Check packages and write the clean-host receipt
      shell: pwsh
      env:
        GPU_ROOT: ${{ steps.scratch.outputs.root }}
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        GPU_ARTIFACT_FILES: ${{ inputs.artifact-files }}
        GPU_VENDOR: ${{ inputs.gpu-vendor }}
        GPU_CHECK_SCRIPT: ${{ inputs.check-script }}
        GPU_MAX_BYTES: ${{ inputs.max-uncompressed-bytes }}
        GPU_MAX_RATIO: ${{ inputs.max-compression-ratio }}
        GPU_PRODUCER_RECEIPT: ${{ inputs.producer-receipt }}
      run: |
        $ErrorActionPreference = 'Stop'
        $archives = @(Get-ChildItem -LiteralPath "$env:GPU_ROOT/archive" -File -Force)
        if ($archives.Count -ne 1) { throw 'Expected one artifact archive' }
        $work = Join-Path $env:GPU_ROOT 'work'
        $null = New-Item -ItemType Directory -Path $work -ErrorAction Stop
        $files = @()
        foreach ($file in ($env:GPU_ARTIFACT_FILES -split "`n")) { if ($file.TrimEnd("`r")) { $files += @('--file', $file.TrimEnd("`r")) } }
        $driver = Join-Path $env:GITHUB_ACTION_PATH '../../../shared/python/windows_clean_gpu_receipt.py'
        python -I $driver --archive $archives[0].FullName --work $work --receipt "$env:GPU_ROOT/pending.json" --producer-receipt $env:GPU_PRODUCER_RECEIPT --script $env:GPU_CHECK_SCRIPT --pwsh (Get-Command pwsh).Source `
          --max-uncompressed-bytes $env:GPU_MAX_BYTES --max-compression-ratio $env:GPU_MAX_RATIO --floor 2147483648 --cushion 2147483648 --timeout 1800 `
          --repository $env:GITHUB_REPOSITORY --revision $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT `
          --artifact-id $env:GPU_ARTIFACT_ID --artifact-digest $env:GPU_ARTIFACT_DIGEST --platform windows --arch x64 --vendor $env:GPU_VENDOR @files
        if ($LASTEXITCODE -ne 0) { throw 'Windows clean-host package check failed' }
    - name: Remove scratch before publishing the clean-host receipt
      id: finalize
      shell: pwsh
      env:
        GPU_ROOT: ${{ steps.scratch.outputs.root }}
        GPU_RECEIPT: ${{ inputs.gpu-receipt }}
      run: |
        $ErrorActionPreference = 'Stop'
        $base = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
        $root = [IO.Path]::GetFullPath($env:GPU_ROOT)
        if (-not $root.StartsWith($base, [StringComparison]::OrdinalIgnoreCase) -or (Split-Path -Leaf $root) -cnotmatch '^windows-gpu-clean-[0-9a-f]{32}$') { throw 'Unsafe clean-host scratch path' }
        if (-not [IO.Path]::IsPathFullyQualified($env:GPU_RECEIPT)) { throw 'Receipt path must be absolute' }
        $receipt = [IO.Path]::GetFullPath($env:GPU_RECEIPT)
        if ($receipt.StartsWith($root + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Receipt must be outside scratch' }
        $data = [IO.File]::ReadAllBytes((Join-Path $root 'pending.json'))
        Remove-Item -LiteralPath $root -Recurse -Force
        $created = $false
        try {
          $stream = [IO.File]::Open($receipt, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          $created = $true
          try { $stream.Write($data, 0, $data.Length) } finally { $stream.Dispose() }
        } catch {
          if ($created) { Remove-Item -LiteralPath $receipt -Force }
          throw
        }
    - name: Remove failed clean-host scratch
      if: ${{ always() && steps.scratch.outcome == 'success' && steps.finalize.outcome != 'success' }}
      shell: pwsh
      env:
        GPU_ROOT: ${{ steps.scratch.outputs.root }}
      run: |
        $base = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
        $root = [IO.Path]::GetFullPath($env:GPU_ROOT)
        if (-not $root.StartsWith($base, [StringComparison]::OrdinalIgnoreCase) -or (Split-Path -Leaf $root) -cnotmatch '^windows-gpu-clean-[0-9a-f]{32}$') { throw 'Unsafe clean-host scratch path' }
        if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
