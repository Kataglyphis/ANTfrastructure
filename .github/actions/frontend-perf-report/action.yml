name: 'Frontend performance report'
description: >-
  Compares a Flutter app's frame timings (integration_test/performance_test.dart under
  flutter drive --profile) with the median of the default branch's last runs through the
  bench-history action, writes the table into the step summary and fails when a gated time
  doubles. In a private repository the calling job needs `actions: read`. See docs/code-quality-tooling.md#frontend-frame-timings.

inputs:
  key:
    description: >-
      History key, one per app and arch, for example `frontend-perf-x64`; the artifact is bench-history-<key>.
    required: true
  timings:
    description: 'The run''s timings, as the app''s test_driver wrote them.'
    required: false
    default: 'logs/perf/frontend.json'
  keep:
    description: 'How many default-branch runs the history holds.'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Move an older consumer's timings to logs
      if: inputs.timings == 'logs/perf/frontend.json'
      shell: bash
      run: |
        if [ ! -e logs/perf/frontend.json ] && [ -f out/perf/frontend.json ]; then
          mkdir -p logs/perf
          mv out/perf/frontend.json logs/perf/frontend.json
        fi

    # Only the build times gate: a single worst frame is too noisy, and raster times stay 0 under Xvfb.
    - name: Frontend performance report
      uses: Kataglyphis/ANTfrastructure/.github/actions/bench-history@develop
      with:
        key: ${{ inputs.key }}
        format: flutter-frame
        result: ${{ inputs.timings }}
        keep: ${{ inputs.keep }}
        metrics: >-
          {"*/average_frame_build_time_millis": {"direction": "lower", "gate": true},
          "*/90th_percentile_frame_build_time_millis": {"direction": "lower", "gate": true},
          "*_millis": {"direction": "lower"}}
