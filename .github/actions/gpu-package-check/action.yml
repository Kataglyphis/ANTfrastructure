name: GPU package check with receipt
description: Run a trusted GPU profile against an immutable Linux artifact and record its exact bytes.

inputs:
  artifact-id:
    description: Immutable artifact ID from the trusted upload step.
    required: true
  artifact-digest:
    description: SHA-256 digest from the same trusted upload step.
    required: true
  artifact-files:
    description: Exact flat DEB, tarball and AppImage names, one per line.
    required: true
  gpu-vendor:
    description: nvidia or amd.
    required: true
  gpu-arch:
    description: x64 or arm64.
    required: true
  gpu-receipt:
    description: New absolute path for the resulting GPU profile receipt.
    required: true
  max-uncompressed-bytes:
    description: Maximum total expanded package size in bytes.
    required: true
  max-compression-ratio:
    description: Maximum archive expansion ratio for each file.
    required: true
  command:
    description: Trusted profile command; GPU_PACKAGE_DIR contains the checked packages.
    required: true

runs:
  using: composite
  steps:
    - name: Validate GPU package check inputs
      shell: bash
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        GPU_ARTIFACT_FILES: ${{ inputs.artifact-files }}
        GPU_VENDOR: ${{ inputs.gpu-vendor }}
        GPU_ARCH: ${{ inputs.gpu-arch }}
        GPU_RECEIPT: ${{ inputs.gpu-receipt }}
        GPU_MAX_BYTES: ${{ inputs.max-uncompressed-bytes }}
        GPU_MAX_RATIO: ${{ inputs.max-compression-ratio }}
        GPU_CHECK_NAME: gpu-model-inference
        LD_PRELOAD: ''
        LD_AUDIT: ''
        PACKAGE_SUBDIR: ''
        DEB_GLOB: '*.deb'
        TARBALL_GLOB: '*.tar.gz'
        APPIMAGE_GLOB: '*.AppImage'
        DEB_COMMAND: ${{ inputs.command }}
        TARBALL_COMMAND: ${{ inputs.command }}
        APPIMAGE_COMMAND: ${{ inputs.command }}
      run: bash "${GITHUB_ACTION_PATH}/../clean-host-package-check/clean-host-gpu-receipt.sh" validate

    - name: Download immutable GPU archive
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/gpu-profile-archive-${{ inputs.artifact-id }}
        skip-decompress: true
        digest-mismatch: error

    - name: Prepare and snapshot GPU packages
      shell: bash
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        GPU_ARTIFACT_FILES: ${{ inputs.artifact-files }}
        GPU_VENDOR: ${{ inputs.gpu-vendor }}
        GPU_ARCH: ${{ inputs.gpu-arch }}
        GPU_RECEIPT: ${{ inputs.gpu-receipt }}
        GPU_MAX_BYTES: ${{ inputs.max-uncompressed-bytes }}
        GPU_MAX_RATIO: ${{ inputs.max-compression-ratio }}
        GPU_ARCHIVE_DIR: ${{ runner.temp }}/gpu-profile-archive-${{ inputs.artifact-id }}
        GPU_PACKAGES_DIR: ${{ runner.temp }}/gpu-profile-packages-${{ inputs.artifact-id }}
        GPU_BEFORE_RECEIPT: ${{ runner.temp }}/gpu-profile-before-${{ inputs.artifact-id }}.json
        GPU_CHECK_NAME: gpu-model-inference
        LD_PRELOAD: ''
        LD_AUDIT: ''
        PACKAGE_SUBDIR: ''
        DEB_GLOB: '*.deb'
        TARBALL_GLOB: '*.tar.gz'
        APPIMAGE_GLOB: '*.AppImage'
        DEB_COMMAND: ${{ inputs.command }}
        TARBALL_COMMAND: ${{ inputs.command }}
        APPIMAGE_COMMAND: ${{ inputs.command }}
      run: bash "${GITHUB_ACTION_PATH}/../clean-host-package-check/clean-host-gpu-receipt.sh" prepare

    - name: Profile the exact extracted GPU packages
      shell: bash
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_PROFILE_COMMAND: ${{ inputs.command }}
        LD_PRELOAD: ''
        LD_AUDIT: ''
      run: |
        set -euo pipefail
        export GPU_PACKAGE_DIR="${RUNNER_TEMP}/gpu-profile-packages-${GPU_ARTIFACT_ID}"
        bash -c "$GPU_PROFILE_COMMAND"

    - name: Verify unchanged packages and write GPU receipt
      shell: bash
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        GPU_ARTIFACT_FILES: ${{ inputs.artifact-files }}
        GPU_VENDOR: ${{ inputs.gpu-vendor }}
        GPU_ARCH: ${{ inputs.gpu-arch }}
        GPU_RECEIPT: ${{ inputs.gpu-receipt }}
        GPU_MAX_BYTES: ${{ inputs.max-uncompressed-bytes }}
        GPU_MAX_RATIO: ${{ inputs.max-compression-ratio }}
        GPU_PACKAGES_DIR: ${{ runner.temp }}/gpu-profile-packages-${{ inputs.artifact-id }}
        GPU_BEFORE_RECEIPT: ${{ runner.temp }}/gpu-profile-before-${{ inputs.artifact-id }}.json
        GPU_CHECK_NAME: gpu-model-inference
        LD_PRELOAD: ''
        LD_AUDIT: ''
        PACKAGE_SUBDIR: ''
        DEB_GLOB: '*.deb'
        TARBALL_GLOB: '*.tar.gz'
        APPIMAGE_GLOB: '*.AppImage'
        DEB_COMMAND: ${{ inputs.command }}
        TARBALL_COMMAND: ${{ inputs.command }}
        APPIMAGE_COMMAND: ${{ inputs.command }}
      run: bash "${GITHUB_ACTION_PATH}/../clean-host-package-check/clean-host-gpu-receipt.sh" finish
