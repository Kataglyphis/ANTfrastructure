name: 'Run in Windows container'
description: >-
  Runs a PowerShell command inside the CI Windows container image via
  `docker run`, bind-mounting the short-path workspace clone and executing
  the command with `pwsh -NoProfile -ExecutionPolicy Bypass -Command`.

inputs:
  image:
    description: 'Container image reference to run.'
    required: true
  command:
    description: >-
      PowerShell script text executed inside the container via
      `pwsh -NoProfile -ExecutionPolicy Bypass -Command`. Passed to docker as
      a single argument (it may span multiple lines). It is delivered through
      an environment variable - never string-interpolated into this action's
      own script - so quotes and dollar signs inside it are taken literally by
      the host and interpreted only by the container's pwsh.
      Mutually exclusive with `file`; exactly one of the two is required.
    required: false
    default: ''
  file:
    description: >-
      Path (inside the container) of a PowerShell script executed via
      `pwsh -NoProfile -ExecutionPolicy Bypass -File`, with `file-args`
      appended as its arguments. Mutually exclusive with `command`.
      Use this - not `command` - whenever the payload is "a script plus an
      argument vector": under `-File` every element of `file-args` reaches the
      script as a LITERAL argument, so no PowerShell parsing/quoting is applied
      to argument values. Rewriting such a call as `-Command` would put those
      values back through the PowerShell parser, which changes quoting
      semantics for anything containing quotes, `$`, backticks or spaces -
      exactly the reason secret-bearing `-File` steps could not be migrated to
      this action before.
    required: false
    default: ''
  file-args:
    description: >-
      Arguments for `file`, ONE PER LINE. Each line becomes exactly one argv
      element, verbatim - no splitting on spaces, no quote removal, no
      PowerShell parsing. A trailing CR is stripped (the runner may check the
      YAML out with autocrlf) and the single trailing empty line a YAML `|`
      block scalar always produces is dropped; every other line is kept, empty
      ones included, so an unset secret still occupies its own argv slot. The
      only value that cannot be expressed is one CONTAINING A NEWLINE.
      Delivered through an environment variable exactly like `command`, so
      secret values interpolated into this input by the caller never appear in
      this action's own script text.
      Ignored when `file` is empty.
    required: false
    default: ''
  extra-args:
    description: >-
      Optional extra `docker run` arguments, inserted immediately before the
      mount/workdir arguments - the same position the sibling
      `run-in-linux-container` action splices its `extra-args` into. ONE
      ARGUMENT PER LINE (the Linux action can substitute a shell fragment
      verbatim because its docker call is a shell command line; this one builds
      an argv array, so `-e` and `VAR=value` are two lines). Same delivery and
      same limitations as `file-args`: env-var delivered, trailing CR stripped,
      one trailing empty line dropped, no newlines inside a value.
    required: false
    default: ''
  cpus:
    description: >-
      --cpus value for the container. Empty (the default) gives the container
      every logical processor the runner has, clamped to a minimum of 2.
    required: false
    default: ''
  memory:
    description: '--memory value for the container.'
    required: false
    default: '16g'
  mount-source:
    description: 'Host path bind-mounted into the container.'
    required: false
    default: 'D:\ws'
  mount-target:
    description: >-
      Bind-mount target inside the container; also used as the container
      working directory (-w).
    required: false
    default: 'C:\ws'

runs:
  using: 'composite'
  steps:
    - name: docker run
      shell: pwsh
      env:
        RUN_IN_CONTAINER_IMAGE: ${{ inputs.image }}
        RUN_IN_CONTAINER_COMMAND: ${{ inputs.command }}
        RUN_IN_CONTAINER_FILE: ${{ inputs.file }}
        RUN_IN_CONTAINER_FILE_ARGS: ${{ inputs.file-args }}
        RUN_IN_CONTAINER_EXTRA_ARGS: ${{ inputs.extra-args }}
        RUN_IN_CONTAINER_CPUS: ${{ inputs.cpus }}
        RUN_IN_CONTAINER_MEMORY: ${{ inputs.memory }}
        RUN_IN_CONTAINER_MOUNT_SOURCE: ${{ inputs.mount-source }}
        RUN_IN_CONTAINER_MOUNT_TARGET: ${{ inputs.mount-target }}
      run: |
        $ErrorActionPreference = 'Stop'
        $image = $env:RUN_IN_CONTAINER_IMAGE
        # Give the container every logical processor the runner has. This was
        # pinned at 4, which throttled the 3-config clang-cl build on any
        # runner with more cores. NUMBER_OF_PROCESSORS is what Windows reports
        # to the host shell; the value is echoed so the log shows what we got.
        if ($env:RUN_IN_CONTAINER_CPUS) {
          $cores = [int]$env:RUN_IN_CONTAINER_CPUS
        } else {
          $cores = [int]$env:NUMBER_OF_PROCESSORS
          # Clamp to the documented minimum of 2 (also covers 0/unset).
          if ($cores -lt 2) { $cores = 2 }
        }
        Write-Host "Runner logical processors: $cores (container gets --cpus $cores)"

        # Multi-value inputs are newline-delimited argv lists. Split on LF only
        # and TrimEnd the CR afterwards rather than splitting on a CRLF regex:
        # that also copes with a lone trailing CR, and it never touches
        # significant leading/trailing SPACES inside an argument.
        function ConvertTo-ArgList([string]$Text) {
          if ([string]::IsNullOrEmpty($Text)) { return @() }
          $lines = @($Text -split "`n" | ForEach-Object { $_.TrimEnd("`r") })
          # A YAML `|` block scalar always ends in exactly ONE newline (clip
          # mode), which -split turns into one trailing empty element. Drop that
          # single artifact - and nothing else. Interior empty lines are KEPT on
          # purpose: an argument whose value is an empty or unset secret must
          # still occupy its own argv slot, otherwise the flag before it would
          # silently swallow the NEXT flag as its value.
          if ($lines[-1] -eq '') {
            if ($lines.Count -eq 1) { return @() }
            $lines = $lines[0..($lines.Count - 2)]
          }
          return @($lines)
        }
        $extraArgs = ConvertTo-ArgList $env:RUN_IN_CONTAINER_EXTRA_ARGS

        # Entrypoint: `-Command <script text>` or `-File <script> <args...>`.
        # `-File` exists so that callers whose payload is a script plus an argv
        # (typically because some elements are secrets) keep literal argument
        # semantics instead of being re-parsed by PowerShell.
        $file = $env:RUN_IN_CONTAINER_FILE
        $command = $env:RUN_IN_CONTAINER_COMMAND
        if ($file -and $command) {
          throw "run-in-windows-container: 'command' and 'file' are mutually exclusive; pass exactly one."
        }
        if (-not $file -and -not $command) {
          throw "run-in-windows-container: one of 'command' or 'file' is required."
        }
        if ($file) {
          $entryArgs = @('pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $file) +
                       (ConvertTo-ArgList $env:RUN_IN_CONTAINER_FILE_ARGS)
        } else {
          $entryArgs = @('pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', $command)
        }

        # Args as a splatted array, NOT backtick line-continuations: the runner
        # checks out this YAML with autocrlf, and a PowerShell backtick before
        # CRLF escapes the CR instead of the newline, breaking the continuation
        # ("Missing expression after unary operator '--'"). An @(...) array spans
        # newlines with no continuation char, so it is CRLF-safe.
        $runArgs = @(
          'run', '--rm', '--memory', $env:RUN_IN_CONTAINER_MEMORY, '--cpus', "$cores"
        ) + $extraArgs + @(
          '--mount', ('type=bind,source=' + $env:RUN_IN_CONTAINER_MOUNT_SOURCE + ',target=' + $env:RUN_IN_CONTAINER_MOUNT_TARGET),
          '-w', $env:RUN_IN_CONTAINER_MOUNT_TARGET,
          $image
        ) + $entryArgs
        docker @runArgs
