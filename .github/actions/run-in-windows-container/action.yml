name: 'Run in Windows container'
description: >-
  Runs a PowerShell command inside the CI Windows container image via
  `docker run`, bind-mounting the short-path workspace clone and executing
  the command with `pwsh -NoProfile -ExecutionPolicy Bypass -Command`.

inputs:
  image:
    description: >-
      Windows container image reference to run.

      SINGLE SOURCE OF TRUTH: omit this input and the lane gets the family
      tag below, which is the value every Windows lane should be on. The default
      is a copy of `${IMAGE_REGISTRY_PREFIX}:${CI_IMAGE_WINDOWS_TAG}` from
      linux/scripts/01-core/versions.env, and it is a CHECKED copy -
      linux/scripts/verify_ci_image_refs.py (preflight slug `workflow-lint`)
      fails if the two disagree.

      Passing a value is still allowed - a single-arch or an experimental image
      is a real need - but it does not hide: the same gate rejects any
      kataglyphis_beschleuniger tag under .github/ that is not the canonical one
      for the platform, so an override has to be an excused entry in that gate
      rather than a literal nobody reads.
    required: false
    default: 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'
  target-arch:
    description: >-
      What the lane builds FOR: amd64 runs `image`, arm64 runs `image-arm64`, the
      cross bundle whose entrypoint loads an arm64-targeting VS environment (bare
      clang-cl there still targets x64: pass --target, docs/windows-cross-builds.md).
      Use the same value as prepare-windows-container-host, which pulled the image.
    required: false
    default: 'amd64'
  image-arm64:
    description: >-
      The image for `target-arch: arm64`. Same contract as `image`: omit it, and
      the default is a checked copy of
      `${IMAGE_REGISTRY_PREFIX}:${CI_IMAGE_WINDOWS_ARM64_TAG}` from versions.env.
    required: false
    default: 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winarm64'
  command:
    description: >-
      PowerShell script text executed inside the container via
      `pwsh -NoProfile -ExecutionPolicy Bypass -Command`. Passed to docker as
      a single argument (it may span multiple lines). It is delivered through
      an environment variable - never string-interpolated into this action's
      own script - so quotes and dollar signs inside it are taken literally by
      the host and interpreted only by the container's pwsh.
      Mutually exclusive with `file`; exactly one of the two is required.
    required: false
    default: ''
  file:
    description: >-
      Path (inside the container) of a PowerShell script executed via
      `pwsh -NoProfile -ExecutionPolicy Bypass -File`, with `file-args`
      appended as its arguments. Mutually exclusive with `command`.
      Use this - not `command` - whenever the payload is "a script plus an
      argument vector": under `-File` every element of `file-args` reaches the
      script as a LITERAL argument, so no PowerShell parsing/quoting is applied
      to argument values. Rewriting such a call as `-Command` would put those
      values back through the PowerShell parser, which changes quoting
      semantics for anything containing quotes, `$`, backticks or spaces -
      exactly the reason secret-bearing `-File` steps could not be migrated to
      this action before.
    required: false
    default: ''
  file-args:
    description: >-
      Arguments for `file`, ONE PER LINE. Each line becomes exactly one argv
      element, verbatim - no splitting on spaces, no quote removal, no
      PowerShell parsing. A trailing CR is stripped (the runner may check the
      YAML out with autocrlf) and the single trailing empty line a YAML `|`
      block scalar always produces is dropped; every other line is kept, empty
      ones included, so an unset secret still occupies its own argv slot. The
      only value that cannot be expressed is one CONTAINING A NEWLINE.
      Delivered through an environment variable exactly like `command`, so
      secret values interpolated into this input by the caller never appear in
      this action's own script text.
      Ignored when `file` is empty.
    required: false
    default: ''
  extra-args:
    description: >-
      Optional extra `docker run` arguments, inserted immediately before the
      mount/workdir arguments - the same position the sibling
      `run-in-linux-container` action splices its `extra-args` into. ONE
      ARGUMENT PER LINE (the Linux action can substitute a shell fragment
      verbatim because its docker call is a shell command line; this one builds
      an argv array, so `-e` and `VAR=value` are two lines). Same delivery and
      same limitations as `file-args`: env-var delivered, trailing CR stripped,
      one trailing empty line dropped, no newlines inside a value.
    required: false
    default: ''
  cpus:
    description: >-
      --cpus value for the container. Empty (the default) gives the container
      every logical processor the runner has, clamped to a minimum of 2.
    required: false
    default: ''
  memory:
    description: '--memory value for the container.'
    required: false
    default: '16g'
  mount-source:
    description: 'Host path bind-mounted into the container.'
    required: false
    default: 'D:\ws'
  mount-target:
    description: >-
      Bind-mount target inside the container; also used as the container
      working directory (-w).
    required: false
    default: 'C:\ws'
  isolation:
    description: >-
      `--isolation` value for `docker run`. Defaults to `process`, which is
      what a Server SKU host can actually provide: a GitHub-hosted runner is a
      VM WITHOUT nested virtualization, so anything that asks HCS for a
      VM-backed (hyperv) container is refused with
      `hcs::CreateComputeSystem <id>: The request is not supported` - an error
      that names neither the isolation mode nor any flag, which is why this
      lane read as a resource-limit problem for months.
      Set to `hyperv` to force VM isolation, or to the empty string to let the
      daemon pick (the pre-2026-08 behaviour).
      NOTE: this is `docker run` only. `docker build --isolation process` is
      separately unusable on this image - see docs/windows-builds.md.
    required: false
    default: 'process'

runs:
  using: 'composite'
  steps:
    - name: docker run
      shell: pwsh
      env:
        RUN_IN_CONTAINER_TARGET_ARCH: ${{ inputs.target-arch }}
        RUN_IN_CONTAINER_IMAGE: ${{ inputs.image }}
        RUN_IN_CONTAINER_IMAGE_ARM64: ${{ inputs.image-arm64 }}
        RUN_IN_CONTAINER_COMMAND: ${{ inputs.command }}
        RUN_IN_CONTAINER_FILE: ${{ inputs.file }}
        RUN_IN_CONTAINER_FILE_ARGS: ${{ inputs.file-args }}
        RUN_IN_CONTAINER_EXTRA_ARGS: ${{ inputs.extra-args }}
        RUN_IN_CONTAINER_CPUS: ${{ inputs.cpus }}
        RUN_IN_CONTAINER_MEMORY: ${{ inputs.memory }}
        RUN_IN_CONTAINER_MOUNT_SOURCE: ${{ inputs.mount-source }}
        RUN_IN_CONTAINER_MOUNT_TARGET: ${{ inputs.mount-target }}
        RUN_IN_CONTAINER_ISOLATION: ${{ inputs.isolation }}
      run: |
        $ErrorActionPreference = 'Stop'
        $image = switch ($env:RUN_IN_CONTAINER_TARGET_ARCH) {
            'amd64' { $env:RUN_IN_CONTAINER_IMAGE }
            'arm64' { $env:RUN_IN_CONTAINER_IMAGE_ARM64 }
            default { throw "target-arch must be amd64 or arm64, not '$env:RUN_IN_CONTAINER_TARGET_ARCH'" }
        }
        Write-Host "target-arch $env:RUN_IN_CONTAINER_TARGET_ARCH -> $image"
        # Default to every logical processor; a fixed count throttles the multi-config build on bigger runners.
        if ($env:RUN_IN_CONTAINER_CPUS) {
          $cores = [int]$env:RUN_IN_CONTAINER_CPUS
        } else {
          $cores = [int]$env:NUMBER_OF_PROCESSORS
          # Clamp to the documented minimum of 2 (also covers 0/unset).
          if ($cores -lt 2) { $cores = 2 }
        }
        Write-Host "Runner logical processors: $cores (container gets --cpus $cores)"

        # Split on LF, then trim CR: copes with a lone CR and never touches spaces inside an argument.
        function ConvertTo-ArgList([string]$Text) {
          if ([string]::IsNullOrEmpty($Text)) { return @() }
          $lines = @($Text -split "`n" | ForEach-Object { $_.TrimEnd("`r") })
          # Drop only the clip-mode trailing empty line; an interior empty line is an empty secret that must keep its argv slot.
          if ($lines[-1] -eq '') {
            if ($lines.Count -eq 1) { return @() }
            $lines = $lines[0..($lines.Count - 2)]
          }
          return @($lines)
        }
        $extraArgs = ConvertTo-ArgList $env:RUN_IN_CONTAINER_EXTRA_ARGS

        # -File keeps literal argv semantics (e.g. secrets) instead of PowerShell re-parsing them.
        $file = $env:RUN_IN_CONTAINER_FILE
        $command = $env:RUN_IN_CONTAINER_COMMAND
        if ($file -and $command) {
          throw "run-in-windows-container: 'command' and 'file' are mutually exclusive; pass exactly one."
        }
        if (-not $file -and -not $command) {
          throw "run-in-windows-container: one of 'command' or 'file' is required."
        }
        if ($file) {
          $entryArgs = @('pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $file) +
                       (ConvertTo-ArgList $env:RUN_IN_CONTAINER_FILE_ARGS)
        } else {
          $entryArgs = @('pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', $command)
        }

        # An array, not backtick continuations: under autocrlf a backtick escapes the CR instead of the newline.
        $tailArgs = $extraArgs + @(
          '--mount', ('type=bind,source=' + $env:RUN_IN_CONTAINER_MOUNT_SOURCE + ',target=' + $env:RUN_IN_CONTAINER_MOUNT_TARGET),
          '-w', $env:RUN_IN_CONTAINER_MOUNT_TARGET,
          $image
        ) + $entryArgs

        # The -v form for the fallback ladder: the daemon builds a different mount spec for it, which HCS may accept.
        $tailArgsV = $extraArgs + @(
          '-v', ($env:RUN_IN_CONTAINER_MOUNT_SOURCE + ':' + $env:RUN_IN_CONTAINER_MOUNT_TARGET),
          '-w', $env:RUN_IN_CONTAINER_MOUNT_TARGET,
          $image
        ) + $entryArgs

        # Isolation before the limits: a container HCS refuses to create never gets as far as --memory/--cpus.
        $isolationArgs = @()
        if ($env:RUN_IN_CONTAINER_ISOLATION) {
          $isolationArgs = @('--isolation', $env:RUN_IN_CONTAINER_ISOLATION)
        }

        $runArgs = @('run', '--rm') + $isolationArgs + @(
          '--memory', $env:RUN_IN_CONTAINER_MEMORY, '--cpus', "$cores"
        ) + $tailArgs

        Write-Host "docker $($runArgs -join ' ')"
        $out = docker @runArgs 2>&1
        $out | ForEach-Object { Write-Host $_ }

        # HCS words unrelated refusals identically: print the deciding facts first, then walk the ladder loudly.
        if ($LASTEXITCODE -ne 0 -and ($out -join "`n") -match 'CreateComputeSystem.*not supported') {
          Write-Host '::warning::docker run rejected with hcs::CreateComputeSystem "The request is not supported".'
          Write-Host '=== container-start diagnostics ==='
          Write-Host "host OS build : $((Get-CimInstance Win32_OperatingSystem).Version) (UBR $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR))"
          Write-Host "requested isolation: '$($env:RUN_IN_CONTAINER_ISOLATION)'"
          Write-Host "daemon default isolation: $(docker info --format '{{.Isolation}}' 2>&1)"
          Write-Host "image os.version: $(docker image inspect $image --format '{{.OsVersion}}' 2>&1)"
          Write-Host '(process isolation needs the image and host BUILD numbers to match;'
          Write-Host ' differing UBR/revision is fine. hyperv isolation needs nested'
          Write-Host ' virtualization, which GitHub-hosted runners do not have.)'

          # Bare probe: tells a refused container from a refused mount, which HCS words identically.
          Write-Host '--- probe: can this image start AT ALL (no mount, no limits)? ---'
          docker run --rm $image cmd /c ver
          $bareProbeOk = ($LASTEXITCODE -eq 0)
          if ($bareProbeOk) {
            Write-Host '::warning::PROBE PASSED: the image starts fine bare, so the container is not the problem - the bind mount or the resource limits are.'
          } else {
            Write-Host "::warning::PROBE FAILED (exit $LASTEXITCODE): this image cannot start on this host at all, mount or no mount. Compare the build numbers above."
          }
          Write-Host '==================================='

          # Rung 1, the fix on windows-2025: HCS rejects the --mount type=bind spec but accepts -v.
          if ($bareProbeOk) {
            Write-Host '::warning::Retrying with -v instead of --mount type=bind.'
            $runArgs = @('run', '--rm') + $isolationArgs + @(
              '--memory', $env:RUN_IN_CONTAINER_MEMORY, '--cpus', "$cores"
            ) + $tailArgsV
            Write-Host "docker $($runArgs -join ' ')"
            $out = docker @runArgs 2>&1
            $out | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -eq 0) {
              Write-Host '::warning::Retry succeeded with -v: this host rejects --mount type=bind, nothing else.'
            }
          }

          # Rung 2: same isolation, no resource limits.
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::Retrying WITHOUT --memory/--cpus - this run is NOT resource-limited.'
            $runArgs = @('run', '--rm') + $isolationArgs + $tailArgsV
            Write-Host "docker $($runArgs -join ' ')"
            $out = docker @runArgs 2>&1
            $out | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -eq 0) {
              Write-Host '::warning::Retry succeeded: this host rejects the resource limits, not the container.'
            }
          }

          # Rung 3: the daemon's default isolation; parenthesised to span lines without a CRLF-unsafe backtick.
          $stillRefused = ($LASTEXITCODE -ne 0 -and $isolationArgs.Count -gt 0 -and
                           ($out -join "`n") -match 'CreateComputeSystem.*not supported')
          if ($stillRefused) {
            Write-Host "::warning::Retrying with the daemon's DEFAULT isolation instead of '$($env:RUN_IN_CONTAINER_ISOLATION)'."
            $runArgs = @('run', '--rm') + $tailArgs
            Write-Host "docker $($runArgs -join ' ')"
            docker @runArgs
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::warning::Retry succeeded: this host rejects --isolation $($env:RUN_IN_CONTAINER_ISOLATION) - change the caller's isolation input."
            }
          }
        }

        # The step otherwise reports its last PowerShell statement, so a run that failed every rung could pass.
        if ($LASTEXITCODE -ne 0) {
          throw "docker run failed with exit code $LASTEXITCODE"
        }
