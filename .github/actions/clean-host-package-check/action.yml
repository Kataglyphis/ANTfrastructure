name: 'Clean-host package check'
description: >-
  Installs a Linux package the family image built on the bare runner, with
  apt resolving its Depends as on a user's machine, and starts it. Inside the
  image every library it links is present, so only a host without them can
  show a missing one (2026-10-16: AccelerANTgine 0.0.1's packages needed
  GCC 16.2's libstdc++ and ONNX Runtime and carried neither). Run it on
  `ubuntu-26.04` / `ubuntu-26.04-arm`, the image's own base. Every ELF the
  package installs must resolve; each command runs with LD_BIND_NOW=1.

inputs:
  artifact:
    description: 'The artifact name; GPU receipt mode uses artifact-id instead.'
    required: true
  deb:
    description: 'Glob of the .deb to install with apt, inside the artifact; empty skips it.'
    required: false
    default: ''
  deb-command:
    description: 'Shell command that must exit 0 after the install, e.g. "AccelerANTgine --version".'
    required: false
    default: ''
  tarball:
    description: 'Glob of a .tar.gz to unpack anywhere and check; the system packages the .deb pulled in stay.'
    required: false
    default: ''
  tarball-command:
    description: "Shell command run in the tarball's top directory, e.g. ./usr/bin/AccelerANTgine --version."
    required: false
    default: ''
  appimage:
    description: 'Glob of an AppImage, exported as APPIMAGE for appimage-command.'
    required: false
    default: ''
  appimage-command:
    description: 'Shell command that starts "$APPIMAGE", e.g. "$APPIMAGE" --version; extract-and-run, no FUSE.'
    required: false
    default: ''
  subdir:
    description: 'The directory inside the artifact that holds the packages, e.g. "packages"; empty is its top.'
    required: false
    default: ''
  scan-elves:
    description: >-
      false skips the ldd scan of every installed ELF and leaves the proof to the commands: a Python app
      bundle loads its unpatched chain ORT through preload.list, which ldd cannot follow.
    required: false
    default: 'true'
  apt-packages:
    description: 'More apt packages a user would have, e.g. mesa-vulkan-drivers for a Vulkan app.'
    required: false
    default: ''
  artifact-id:
    description: 'Opt in to immutable GPU artifact checks using the trusted upload artifact ID.'
    required: false
    default: ''
  artifact-digest:
    description: 'The trusted upload SHA-256 digest for artifact-id.'
    required: false
    default: ''
  artifact-files:
    description: 'Exact flat package filenames, one per line, for the GPU receipt.'
    required: false
    default: ''
  gpu-vendor:
    description: 'GPU vendor for the receipt: nvidia or amd.'
    required: false
    default: ''
  gpu-arch:
    description: 'GPU package architecture for the receipt: x64 or arm64.'
    required: false
    default: ''
  gpu-receipt:
    description: 'New path outside the package directory for the clean-host receipt.'
    required: false
    default: ''
  max-uncompressed-bytes:
    description: 'Positive total expanded archive limit for GPU receipt mode.'
    required: false
    default: ''
  max-compression-ratio:
    description: 'Positive per-file archive expansion-ratio limit for GPU receipt mode.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate optional GPU receipt inputs
      shell: bash
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        GPU_ARTIFACT_FILES: ${{ inputs.artifact-files }}
        GPU_VENDOR: ${{ inputs.gpu-vendor }}
        GPU_ARCH: ${{ inputs.gpu-arch }}
        GPU_RECEIPT: ${{ inputs.gpu-receipt }}
        GPU_MAX_BYTES: ${{ inputs.max-uncompressed-bytes }}
        GPU_MAX_RATIO: ${{ inputs.max-compression-ratio }}
        GPU_CHECK_NAME: clean-host-inference
        LD_PRELOAD: ''
        LD_AUDIT: ''
        GPU_PACKAGES_DIR: ${{ runner.temp }}/clean-host-packages
        GPU_BEFORE_RECEIPT: ${{ runner.temp }}/clean-host-gpu-before.json
        PACKAGE_SUBDIR: ${{ inputs.subdir }}
        DEB_GLOB: ${{ inputs.deb }}
        DEB_COMMAND: ${{ inputs.deb-command }}
        TARBALL_GLOB: ${{ inputs.tarball }}
        TARBALL_COMMAND: ${{ inputs.tarball-command }}
        APPIMAGE_GLOB: ${{ inputs.appimage }}
        APPIMAGE_COMMAND: ${{ inputs.appimage-command }}
      run: bash "${GITHUB_ACTION_PATH}/clean-host-gpu-receipt.sh" validate

    - name: Download the packages
      if: ${{ inputs.artifact-id == '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/clean-host-packages

    - name: Download immutable GPU archive
      if: ${{ inputs.artifact-id != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/clean-host-gpu-archive
        skip-decompress: true
        digest-mismatch: error

    - name: Prepare and snapshot GPU packages
      if: ${{ inputs.artifact-id != '' }}
      shell: bash
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        GPU_ARTIFACT_FILES: ${{ inputs.artifact-files }}
        GPU_VENDOR: ${{ inputs.gpu-vendor }}
        GPU_ARCH: ${{ inputs.gpu-arch }}
        GPU_RECEIPT: ${{ inputs.gpu-receipt }}
        GPU_MAX_BYTES: ${{ inputs.max-uncompressed-bytes }}
        GPU_MAX_RATIO: ${{ inputs.max-compression-ratio }}
        GPU_CHECK_NAME: clean-host-inference
        LD_PRELOAD: ''
        LD_AUDIT: ''
        GPU_PACKAGES_DIR: ${{ runner.temp }}/clean-host-packages
        GPU_BEFORE_RECEIPT: ${{ runner.temp }}/clean-host-gpu-before.json
        GPU_ARCHIVE_DIR: ${{ runner.temp }}/clean-host-gpu-archive
        PACKAGE_SUBDIR: ${{ inputs.subdir }}
        DEB_GLOB: ${{ inputs.deb }}
        DEB_COMMAND: ${{ inputs.deb-command }}
        TARBALL_GLOB: ${{ inputs.tarball }}
        TARBALL_COMMAND: ${{ inputs.tarball-command }}
        APPIMAGE_GLOB: ${{ inputs.appimage }}
        APPIMAGE_COMMAND: ${{ inputs.appimage-command }}
      run: bash "${GITHUB_ACTION_PATH}/clean-host-gpu-receipt.sh" prepare

    - name: Install and start them
      shell: bash
      env:
        PACKAGES_DIR: ${{ runner.temp }}/clean-host-packages/${{ inputs.subdir }}
        SCAN_ELVES: ${{ inputs.scan-elves }}
        DEB_GLOB: ${{ inputs.deb }}
        DEB_COMMAND: ${{ inputs.deb-command }}
        TARBALL_GLOB: ${{ inputs.tarball }}
        TARBALL_COMMAND: ${{ inputs.tarball-command }}
        APPIMAGE_GLOB: ${{ inputs.appimage }}
        APPIMAGE_COMMAND: ${{ inputs.appimage-command }}
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: bash "${GITHUB_ACTION_PATH}/clean-host-package-check.sh"

    - name: Verify unchanged GPU packages and write clean-host receipt
      if: ${{ inputs.artifact-id != '' }}
      shell: bash
      env:
        GPU_ARTIFACT_ID: ${{ inputs.artifact-id }}
        GPU_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        GPU_ARTIFACT_FILES: ${{ inputs.artifact-files }}
        GPU_VENDOR: ${{ inputs.gpu-vendor }}
        GPU_ARCH: ${{ inputs.gpu-arch }}
        GPU_RECEIPT: ${{ inputs.gpu-receipt }}
        GPU_MAX_BYTES: ${{ inputs.max-uncompressed-bytes }}
        GPU_MAX_RATIO: ${{ inputs.max-compression-ratio }}
        GPU_CHECK_NAME: clean-host-inference
        LD_PRELOAD: ''
        LD_AUDIT: ''
        GPU_PACKAGES_DIR: ${{ runner.temp }}/clean-host-packages
        GPU_BEFORE_RECEIPT: ${{ runner.temp }}/clean-host-gpu-before.json
        PACKAGE_SUBDIR: ${{ inputs.subdir }}
        DEB_GLOB: ${{ inputs.deb }}
        DEB_COMMAND: ${{ inputs.deb-command }}
        TARBALL_GLOB: ${{ inputs.tarball }}
        TARBALL_COMMAND: ${{ inputs.tarball-command }}
        APPIMAGE_GLOB: ${{ inputs.appimage }}
        APPIMAGE_COMMAND: ${{ inputs.appimage-command }}
      run: bash "${GITHUB_ACTION_PATH}/clean-host-gpu-receipt.sh" finish
