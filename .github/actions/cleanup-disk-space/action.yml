name: 'Cleanup Disk Space'
description: >-
  Aggressively cleans up disk space on Windows runners: now, or detached while the
  job goes on (`mode`). Or it deletes nothing and only takes those directories off
  PATH (`mode: hide`).

inputs:
  mode:
    description: >-
      foreground (default) deletes now, as before the input existed. background
      starts the same deletions as a detached process and returns at once; it leaves
      out the TEMP purge and the Docker prune, which would race the steps running
      beside it. wait blocks until a background run has ended and prints its log;
      with none running it does nothing. run-in-windows-container waits by itself.
      hide deletes nothing. It removes every PATH entry under a directory the others
      delete, for the job's later steps (Hide-CleanupRoots.ps1). A host step then
      finds programs and DLLs as on a cleaned runner, at no cost in time.
    required: false
    default: 'foreground'
  priority:
    description: >-
      Priority class of a background run and every process it starts: normal (the
      default), below-normal or idle. A lower class yields the CPU to a container
      build running beside it.
    required: false
    default: 'normal'

runs:
  using: 'composite'
  steps:
    - name: Check the cleanup mode
      shell: pwsh
      env:
        CLEANUP_MODE: ${{ inputs.mode }}
        CLEANUP_PRIORITY: ${{ inputs.priority }}
      run: |
        if ($env:CLEANUP_MODE -notin 'foreground', 'background', 'wait', 'hide') {
          throw "cleanup-disk-space: mode must be foreground, background, wait or hide, not '$env:CLEANUP_MODE'"
        }
        if ($env:CLEANUP_PRIORITY -notin 'normal', 'below-normal', 'idle') {
          throw "cleanup-disk-space: priority must be normal, below-normal or idle, not '$env:CLEANUP_PRIORITY'"
        }

    - name: Disk space BEFORE cleanup (all drives)
      if: ${{ inputs.mode == 'foreground' }}
      shell: pwsh
      run: |
        Write-Host '=== Volumes BEFORE cleanup ==='
        Get-Volume | Where-Object DriveLetter | Sort-Object DriveLetter |
          Format-Table DriveLetter,
            @{n='FreeGB';e={[math]::Round($_.SizeRemaining/1GB,1)}},
            @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}},
            FileSystemLabel -AutoSize | Out-String | Write-Host

    - name: Aggressive cleanup
      if: ${{ inputs.mode != 'wait' }}
      shell: pwsh
      env:
        ANTF_CLEANUP_MODE: ${{ inputs.mode }}
        ANTF_CLEANUP_PRIORITY: ${{ inputs.priority }}
      run: |
        $ErrorActionPreference = 'Continue'
        $cleanupStart = Get-Date
        $cFreeBefore = [math]::Round((Get-PSDrive -Name C).Free / 1GB, 1)
        $state = $env:RUNNER_TEMP
        $self = if ($PSCommandPath) { $PSCommandPath } else { $MyInvocation.MyCommand.Path }

        # Deleted in this order, Visual Studio first; the build runs inside the container, so host toolchains can go.
        $removeFirst = @(
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files\Microsoft Visual Studio\2019",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "$env:ProgramData\Microsoft\VisualStudio",
            "C:\hostedtoolcache\CodeQL",
            "C:\hostedtoolcache\go",
            "C:\hostedtoolcache\PyPy",
            "C:\hostedtoolcache\Ruby",
            "C:\hostedtoolcache\node",
            "C:\hostedtoolcache\Python\*\x86",
            "C:\SeleniumWebDrivers",
            "C:\vcpkg",
            "C:\tools\boost",
            "C:\tools\msys64",
            "C:\Program Files\MySQL",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\MongoDB",
            "C:\tools\mysql",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5.1",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5.2",
            "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6",
            "C:\Windows\System32\inetsrv",
            "C:\inetpub"
        )
        # After the cache purges below, which still run dotnet and pip from some of these.
        $removeLast = @(
          "C:\hostedtoolcache",
          "C:\Program Files\dotnet",
          "C:\Program Files (x86)\Android",
          "C:\Program Files (x86)\Android\android-sdk",
          "C:\Program Files (x86)\Android\android-ndk",
          "C:\Program Files\Android",
          "C:\Program Files (x86)\Windows Kits",
          "C:\Program Files (x86)\Microsoft SDKs",
          "C:\Program Files\Microsoft SDKs",
          "C:\tools\ghc",
          "C:\tools\julia",
          "C:\Strawberry",
          "C:\Miniconda",
          "C:\Miniconda3",
          "C:\Program Files\LLVM",
          "C:\Program Files\PostgreSQL",
          "C:\Program Files\MongoDB",
          "C:\Program Files\Microsoft SQL Server",
          "C:\Program Files (x86)\Microsoft SQL Server",
          "C:\Program Files\Unity",
          "C:\Program Files\R",
          "C:\Program Files (x86)\Microsoft\Edge\Application",
          "C:\Program Files\Google\Chrome",
          "C:\Program Files (x86)\Google",
          "C:\npm\prefix",
          "C:\Program Files\CMake"
        )

        # Hide deletes nothing: host steps then resolve programs and DLLs as on a cleaned runner.
        if ($env:ANTF_CLEANUP_MODE -eq 'hide') {
          & (Join-Path $env:GITHUB_ACTION_PATH 'Hide-CleanupRoots.ps1') -Roots ($removeFirst + $removeLast)
          exit $LASTEXITCODE
        }

        # Background reruns this very script detached; it is copied first because the runner deletes the original after the step.
        if ($env:ANTF_CLEANUP_MODE -eq 'background' -and -not $self) {
          Write-Host '::warning::cleanup-disk-space cannot find its own script to detach; cleaning up in the foreground instead.'
        } elseif ($env:ANTF_CLEANUP_MODE -eq 'background') {
          foreach ($n in 'done', 'waited', 'pid', 'log') { Remove-Item -LiteralPath (Join-Path $state "disk-cleanup.$n") -ErrorAction SilentlyContinue }
          $copy = Join-Path $state 'disk-cleanup.ps1'
          $log = Join-Path $state 'disk-cleanup.log'
          # The copy starts outside this step's environment, so it carries its own mode and state directory.
          Set-Content -LiteralPath $copy -Value (@("`$env:ANTF_CLEANUP_MODE = 'detached'; `$env:RUNNER_TEMP = '$state'") + @(Get-Content -LiteralPath $self))
          $line = "`"$((Get-Process -Id $PID).Path)`" -NoProfile -NonInteractive -Command `"& '$copy' *> '$log'`""
          # Win32 priority classes; the children it starts (cmd's rmdir) inherit idle and below-normal.
          $class = @{ 'normal' = 32; 'below-normal' = 16384; 'idle' = 64 }[$env:ANTF_CLEANUP_PRIORITY]
          $startup = New-CimInstance -ClassName Win32_ProcessStartup -ClientOnly -Property @{ PriorityClass = [uint32]$class }
          # WMI, not Start-Process: a child with redirected output died seconds after its step ended (probe run 38455303000).
          $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $line; CurrentDirectory = $state; ProcessStartupInformation = $startup }
          $proc = if ($created.ReturnValue -eq 0) { Get-Process -Id $created.ProcessId -ErrorAction SilentlyContinue }
          if ($proc) {
            Set-Content -LiteralPath (Join-Path $state 'disk-cleanup.pid') -Value "$($proc.Id) $($proc.StartTime.ToUniversalTime().Ticks)"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value 'ANTF_DISK_CLEANUP=running'
            Write-Host "Disk cleanup continues in the background (pid $($proc.Id), priority $($proc.PriorityClass)); run-in-windows-container waits for it after its container run."
            exit 0
          }
          Write-Host "::warning::cleanup-disk-space could not detach (Win32_Process.Create returned $($created.ReturnValue)); cleaning up in the foreground instead."
        }

        # cmd's rmdir is minutes faster than the PowerShell cmdlet on trees of many small files.
        function Fast-Remove($pathPattern) {
          foreach ($p in @(Get-Item -Path $pathPattern -Force -ErrorAction SilentlyContinue)) {
            $path = $p.FullName
            Write-Host "Removing $path ..."
            if ($p.PSIsContainer) {
              & cmd.exe /c "rmdir /s /q `"$path`"" 2>$null
            }
            # Sweep up anything rmdir left (files, or a locked leaf).
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }
        }

        Write-Host "Removing Visual Studio, toolchains, databases, old .NET reference assemblies and IIS..."
        foreach ($path in $removeFirst) {
            Fast-Remove $path
        }

        # Remove Azure tools if not needed
        Remove-Item -Path "C:\Program Files (x86)\Microsoft SDKs\Azure" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\Microsoft SDKs\Azure" -Recurse -Force -ErrorAction SilentlyContinue

        # Remove PowerShell modules cache
        Remove-Item -Path "$env:ProgramFiles\WindowsPowerShell\Modules\Az.*" -Recurse -Force -ErrorAction SilentlyContinue

        # dotnet/NuGet
        dotnet --info 2>$null
        dotnet nuget locals all --clear 2>$null
        if (Test-Path "$env:USERPROFILE\.nuget\packages") {
          Remove-Item -Path "$env:USERPROFILE\.nuget\packages" -Recurse -Force -ErrorAction SilentlyContinue
        }

        # NuGet CLI
        if (Get-Command nuget -ErrorAction SilentlyContinue) {
          nuget locals all -clear 2>$null
        }

        # pip
        if (Get-Command pip -ErrorAction SilentlyContinue) {
          pip cache purge --disable-pip-version-check 2>$null
        }

        # npm / yarn
        if (Get-Command npm -ErrorAction SilentlyContinue) {
          npm cache clean --force 2>$null
        }
        if (Get-Command yarn -ErrorAction SilentlyContinue) {
          yarn cache clean 2>$null
        }

        # cargo / rustup
        if (Test-Path "$env:USERPROFILE\.cargo") {
          Remove-Item "$env:USERPROFILE\.cargo\registry" -Recurse -Force -ErrorAction SilentlyContinue
        }
        if (Test-Path "$env:USERPROFILE\.rustup") {
          Remove-Item "$env:USERPROFILE\.rustup\toolchains" -Recurse -Force -ErrorAction SilentlyContinue
        }

        # pipenv / poetry
        if (Test-Path "$env:LOCALAPPDATA\pypoetry\Cache") {
          Remove-Item "$env:LOCALAPPDATA\pypoetry\Cache" -Recurse -Force -ErrorAction SilentlyContinue
        }

        # go modules cache
        if ($env:GOMODCACHE) {
          Remove-Item $env:GOMODCACHE -Recurse -Force -ErrorAction SilentlyContinue
        }
        if (Test-Path "$env:USERPROFILE\go\pkg\mod") {
          Remove-Item "$env:USERPROFILE\go\pkg\mod" -Recurse -Force -ErrorAction SilentlyContinue
        }

        # Chocolatey
        if (Test-Path "C:\ProgramData\chocolatey") {
          Write-Host "Cleaning Chocolatey cache"
          Remove-Item -Path "C:\ProgramData\chocolatey\lib\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\ProgramData\chocolatey\cache\*" -Recurse -Force -ErrorAction SilentlyContinue
        }

        Write-Host "Removing Android, Windows SDKs, and other big known folders (if present)..."
        foreach ($path in $removeLast) {
          Fast-Remove $path
        }

        # Windows Update cache
        Write-Host "Clearing Windows Update download cache (requires admin; ignore if not allowed)..."
        try {
          Stop-Service wuauserv -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue
          Start-Service wuauserv -ErrorAction SilentlyContinue
        } catch {
          Write-Host "Could not clear SoftwareDistribution: $_"
        }

        $cleanupSeconds = [int]((Get-Date) - $cleanupStart).TotalSeconds
        $cFreeAfter = [math]::Round((Get-PSDrive -Name C).Free / 1GB, 1)
        Write-Host "disk cleanup: $cleanupSeconds s, C: free $cFreeBefore -> $cFreeAfter GB"
        # Renamed into place, so a waiter never reads half a marker.
        if ($state -and (Test-Path -LiteralPath $state)) {
          $marker = Join-Path $state 'disk-cleanup.done'
          Set-Content -LiteralPath "$marker.tmp" -Value "seconds=$cleanupSeconds c_before_gb=$cFreeBefore c_after_gb=$cFreeAfter"
          Move-Item -LiteralPath "$marker.tmp" -Destination $marker -Force
        }
        exit 0

    # Foreground only: a detached run must not empty a TEMP or prune a Docker that the steps beside it are using.
    - name: Aggressive cleanup (TEMP, caches, Docker)
      if: ${{ inputs.mode == 'foreground' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        # Temp folders
        Write-Host "Clearing TEMP folders..."
        Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "$env:USERPROFILE\AppData\Local\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue

        # Visual Studio caches
        Write-Host "Removing Visual Studio caches..."
        Remove-Item -Path "$env:USERPROFILE\AppData\Local\Microsoft\VisualStudio" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "$env:USERPROFILE\AppData\Local\Microsoft\VSCommon" -Recurse -Force -ErrorAction SilentlyContinue

        if (Test-Path "C:\Users\runneradmin\.nuget\packages") {
          Remove-Item -Path "C:\Users\runneradmin\.nuget\packages" -Recurse -Force -ErrorAction SilentlyContinue
        }

        # Docker prune (if docker present)
        if (Get-Command docker -ErrorAction SilentlyContinue) {
          Write-Host "Pruning Docker system (images/containers/volumes) — this deletes everything Docker-related."
          docker system prune --all --volumes --force 2>$null
        }

        Write-Host "Removing old dotnet sdks (keep specified versions only)..."
        $sdks = Get-ChildItem "C:\Program Files\dotnet\sdk" -Directory -ErrorAction SilentlyContinue
        foreach ($s in $sdks) {
          Write-Host "Removing SDK $($s.FullName)"
          Remove-Item -Path $s.FullName -Recurse -Force -ErrorAction SilentlyContinue
        }

        # Best effort: a native command's leaked $LASTEXITCODE must not fail the job.
        exit 0

    - name: Disk space AFTER cleanup (all drives)
      if: ${{ inputs.mode == 'foreground' }}
      shell: pwsh
      run: |
        Write-Host '=== Volumes AFTER cleanup ==='
        Get-Volume | Where-Object DriveLetter | Sort-Object DriveLetter |
          Format-Table DriveLetter,
            @{n='FreeGB';e={[math]::Round($_.SizeRemaining/1GB,1)}},
            @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}},
            FileSystemLabel -AutoSize | Out-String | Write-Host
        # The drive holding Docker's data-root must fit the image import, or the pull fails with ImportLayer 0x70.
        $dataRoot = docker info --format '{{.DockerRootDir}}' 2>$null
        Write-Host ("Docker data-root: " + $dataRoot)
        # Diagnostic only: after the prune `docker info` may fail, and the pwsh wrapper would exit with its code.
        $global:LASTEXITCODE = 0

    - name: Wait for the background cleanup
      if: ${{ inputs.mode == 'wait' }}
      shell: pwsh
      run: '& (Join-Path $env:GITHUB_ACTION_PATH "Wait-DiskCleanup.ps1")'
