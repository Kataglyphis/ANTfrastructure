name: 'Run Pester suite'
description: >-
  Installs a pinned Pester version and runs a suite, failing the step on any
  failed test and printing enough to act on: the Describe/Name, the assertion's
  FailureMessage and its StackTrace.

  It also fails when no test passes, including an empty, entirely skipped or
  entirely pending suite.

  The version is pinned because Pester 3.x and 5.x are not compatible dialects:
  a suite written in 3.4's dash-less assertion syntax (`Should Be 0`) does not
  parse under the Pester 5 that ships with the runner.

inputs:
  path:
    description: 'Path to the suite (file or directory).'
    required: true
  version:
    description: 'Exact Pester version to install and import.'
    required: false
    default: '3.4.0'

runs:
  using: 'composite'
  steps:
    - shell: pwsh
      run: |
        $installer = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_ACTION_PATH '../../../windows/scripts/modules/WindowsCi.ModuleBootstrap.psm1')).Path
        Import-Module $installer -ErrorAction Stop
        $null = Install-PinnedPowerShellModule -Name Pester -Version '${{ inputs.version }}' -SkipPublisherCheck
        Import-Module Pester -RequiredVersion '${{ inputs.version }}' -ErrorAction Stop
        $r = Invoke-Pester -Path '${{ inputs.path }}' -PassThru -Quiet
        Write-Host "TOTAL=$($r.TotalCount) PASSED=$($r.PassedCount) FAILED=$($r.FailedCount)"
        # A path matching no suite gives TotalCount=0 and FailedCount=0, which must not pass.
        if ($null -eq $r -or $r.TotalCount -eq 0) {
          Write-Host "::error::run-pester-suite: '${{ inputs.path }}' matched no Pester test (TotalCount=0). A suite that runs nothing must not report success: check that the path exists in the checkout, that the file is named *.Tests.ps1, and that the checkout step actually fetched it."
          exit 1
        }
        if ($r.FailedCount -gt 0) {
          # The test name alone does not say what was compared; print message and stack too.
          $r.TestResult | Where-Object { -not $_.Passed } | ForEach-Object {
            Write-Host "FAIL: $($_.Describe) / $($_.Name)"
            if ($_.FailureMessage) { Write-Host "      $($_.FailureMessage)" }
            if ($_.StackTrace)     { Write-Host "      $($_.StackTrace)" }
          }
          exit 1
        }
        if ($r.PassedCount -lt 1) {
          Write-Host "::error::run-pester-suite: '${{ inputs.path }}' had no passing test; skipped or pending tests are not execution evidence."
          exit 1
        }
