name: 'Run Pester suite'
description: >-
  Installs a pinned Pester version and runs a suite, failing the step on any
  failed test and printing enough to act on: the test's path, the assertion's
  message and its stack.

  It also fails when no test passes, including an empty, entirely skipped or
  entirely pending suite, and from Pester 5 on when a file fails discovery or
  its top-level setup.

  The version is pinned because Pester 3.x and 5.x are not compatible dialects:
  a suite written in 3.4's dash-less assertion syntax (`Should Be 0`) does not
  parse under Pester 5 or 6, and a 5.x suite's `BeforeAll` setup is not 3.4's.

inputs:
  path:
    description: 'Path to the suite (file or directory).'
    required: true
  version:
    description: 'Exact Pester version to install and import; 5.0.0 and later run through a Pester configuration.'
    required: false
    default: '3.4.0'

runs:
  using: 'composite'
  steps:
    - shell: pwsh
      env:
        PESTER_SUITE_PATH: ${{ inputs.path }}
        PESTER_SUITE_VERSION: ${{ inputs.version }}
      run: |
        & (Join-Path $env:GITHUB_ACTION_PATH 'Invoke-PesterSuite.ps1') -Path $env:PESTER_SUITE_PATH -Version $env:PESTER_SUITE_VERSION
        exit $LASTEXITCODE
