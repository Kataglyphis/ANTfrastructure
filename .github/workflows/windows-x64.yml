# No images here, the chain builds locally (docs/windows-builds.md); named per docs/adopting-in-a-new-project.md#workflow-file-names-and-display-names
name: Windows x64 · script tests
on:
  push:
    branches: [main, develop]
    paths:
      - 'windows/**'
      - 'shared/windows/**'
      - 'linux/scripts/01-core/versions.env'
      - '.github/workflows/windows-x64.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'windows/**'
      - 'shared/windows/**'
      - 'linux/scripts/01-core/versions.env'
      - '.github/workflows/windows-x64.yml'

permissions:
  contents: read

# One run per ref: a newer push supersedes the in-flight run.
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      # Without -FailOnAnalyzer the analyzer prints findings and still exits 0.
      - name: Lint (parse gate + PSScriptAnalyzer)
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/Invoke-Lint.ps1 -FailOnAnalyzer

      # Our own floor: runner-image updates have swapped preinstalled module versions before.
      - name: Ensure Pester >= 5.7
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.7 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run test suites
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/tests/Invoke-Tests.ps1

  # Patches against their pinned upstreams on every versions.env change; a bump still needs one local full chain.
  patch-drift:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Patches apply cleanly at the pinned versions
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/tests/Test-PatchesApplyClean.ps1
