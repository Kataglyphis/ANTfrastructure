# No images here, the chain builds locally (docs/windows-builds.md); named per docs/adopting-in-a-new-project.md#workflow-file-names-and-display-names
name: Windows x64 · script tests
on:
  push:
    branches: [main, develop]
    paths:
      - 'windows/**'
      - 'shared/windows/**'
      - '.github/actions/**'
      - 'linux/scripts/01-core/versions.env'
      - '.github/workflows/windows-x64.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'windows/**'
      - 'shared/windows/**'
      - '.github/actions/**'
      - 'linux/scripts/01-core/versions.env'
      - '.github/workflows/windows-x64.yml'

permissions:
  contents: read

# One run per ref: a newer push supersedes the in-flight run.
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $pins = @(Get-Content -LiteralPath 'linux/scripts/01-core/versions.env' | Where-Object { $_ -match '^\s*PSSCRIPTANALYZER_VERSION\s*=' })
          if ($pins.Count -ne 1) { throw 'PSSCRIPTANALYZER_VERSION must occur exactly once in versions.env' }
          $pin = ($pins[0] -split '=', 2)[1].Trim().Trim('"', "'")
          Install-Module PSScriptAnalyzer -RequiredVersion $pin -Force -Scope CurrentUser

      # Without -FailOnAnalyzer the analyzer prints findings and still exits 0.
      - name: Lint (parse gate + PSScriptAnalyzer)
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/Invoke-Lint.ps1 -FailOnAnalyzer

      - name: Report PowerShell complexity
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/Invoke-CodeComplexity.ps1

      - name: Enforce refactored PowerShell complexity
        shell: pwsh
        run: |
          & ./windows/scripts/Invoke-CodeComplexity.ps1 -Path @(
            'windows/scripts/Invoke-CodeComplexity.ps1',
            'windows/scripts/modules/WindowsAst.Common.psm1',
            'windows/scripts/modules/WindowsSlang.Common.psm1',
            'windows/scripts/modules/WindowsCodeQL.Common.psm1',
            'windows/scripts/modules/WindowsImageEnv.Common.psm1',
            'windows/scripts/diagnostics/Invoke-LlvmAarch64Layout.ps1',
            'windows/scripts/modules/WindowsAgenticLoop.Common.psm1',
            'windows/scripts/tests/AgenticLoop.Execution.Tests.ps1'
          ) -Strict

      # Our own floor: runner-image updates have swapped preinstalled module versions before.
      - name: Ensure Pester >= 6.2
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 6.2 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run test suites
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/tests/Invoke-Tests.ps1

  # Patches against their pinned upstreams on every versions.env change; a bump still needs one local full chain.
  patch-drift:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Patches apply cleanly at the pinned versions
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/tests/Test-PatchesApplyClean.ps1
