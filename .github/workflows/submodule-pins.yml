# The hub runs its own pin gate too; a Windows runner because run-pester-suite's Pester 3.4.0 is a Windows PowerShell-era module.
name: Submodule pins (reusable)

on:
  workflow_call:
    inputs:
      suite-path:
        description: Path of the pin suite inside the caller's checkout.
        type: string
        default: 'third_party/ANTfrastructure/shared/windows/tests/Submodule.Pins.Tests.ps1'
      pester-version:
        description: >-
          Exact Pester version run-pester-suite installs. 3.4.0 is the only
          version the action's invocation survives today (5.x loses the
          per-failure diagnostics, 6.x rejects -Quiet), measured 2026-09-07.
        type: string
        default: '3.4.0'
      runner:
        description: Runner label; a Windows one, because Pester 3.4.0 is a Windows PowerShell-era module.
        type: string
        default: 'windows-2025'
  push:
    branches: [main, develop]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - 'shared/windows/tests/Submodule.Pins.Tests.ps1'
      - 'windows/scripts/modules/WindowsRepoHygiene.Common.psm1'
      - '.github/workflows/submodule-pins.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - 'shared/windows/tests/Submodule.Pins.Tests.ps1'
      - 'windows/scripts/modules/WindowsRepoHygiene.Common.psm1'
      - '.github/workflows/submodule-pins.yml'

permissions:
  contents: read

# No workflow-level concurrency: here it failed every caller before a job started; callers own their groups.

jobs:
  pins:
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 15
    env:
      # The action can pass only a path, so the repo root comes through the environment.
      ANTFRASTRUCTURE_PIN_CHECK_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Top level at default depth, so the reachability check exercises its shallow-clone escalation.
          submodules: true

      - name: Submodule pins sit at their recorded, restorable commits
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: ${{ inputs.suite-path || 'shared/windows/tests/Submodule.Pins.Tests.ps1' }}
          version: ${{ inputs.pester-version || '3.4.0' }}
