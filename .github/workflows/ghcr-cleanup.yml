# GHCR_TOKEN must be a PAT with read:packages and delete:packages: /user/packages answers only for a user, which GITHUB_TOKEN is not.
name: GHCR · cleanup

on:
  schedule:
    # Weekly cleanup (Sunday 03:00 UTC)
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Needs only curl and python3, so it runs on the hosted runner, not in the image.
      - name: Prune stale package versions
        env:
          # The only place that confirms the delete; a local run of the script stays a dry run.
          GHCR_PRUNE_CONFIRM: "1"
          KEEP_DAYS: "14"
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: bash linux/host-config/ghcr-prune-package.sh
