# Who actually calls this hub. See docs/consumer-inventory.md#the-consumer-inventory
name: Consumers · inventory

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the stale-docs check at 06:00
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - '.github/consumers.json'
      - 'linux/scripts/verify_consumer_inventory.py'
      - 'linux/scripts/verify_consumer_quality_wiring.py'
      - 'linux/scripts/tests/test-consumer-quality-wiring.sh'
      - 'linux/scripts/tests/consumer_quality_wiring_tests.py'
      - '.github/workflows/consumer-inventory.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/consumers.json'
      - 'linux/scripts/verify_consumer_inventory.py'
      - 'linux/scripts/verify_consumer_quality_wiring.py'
      - 'linux/scripts/tests/test-consumer-quality-wiring.sh'
      - 'linux/scripts/tests/consumer_quality_wiring_tests.py'
      - '.github/workflows/consumer-inventory.yml'

permissions:
  contents: read

concurrency:
  group: consumer-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Grade every hub entry point against its consumers
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Issues, because an unattended weekly failure must land somewhere a human reads.
    permissions:
      contents: read
      issues: write
    env:
      # Empty means anonymous clones; set a repo-scoped PAT once a private consumer joins.
      CONSUMER_INVENTORY_TOKEN: ${{ secrets.CONSUMER_INVENTORY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The X.Y versions.env pins, so a Python upgrade needs no edit here.
      - name: Read the pinned Python
        id: python
        run: echo "version=$(sed -n 's/^PYTHON_VERSION=\([0-9]*\.[0-9]*\)\..*/\1/p' linux/scripts/01-core/versions.env)" >> "$GITHUB_OUTPUT"

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      # An unclonable consumer is a finding: this must never answer from a partial view of the family.
      - name: Clone every declared consumer and grade entry points and CI quality calls
        run: |
          python3 linux/scripts/verify_consumer_inventory.py \
            --report logs/reports/consumer-inventory.md

      # The report is written before the verdict, so a red run still hands it over.
      - name: Publish the report to the run summary
        if: always()
        run: |
          if [ -f logs/reports/consumer-inventory.md ]; then
            cat logs/reports/consumer-inventory.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::no report was produced - the run failed before any consumer was graded"
          fi

      - name: Upload the report
        if: always() && hashFiles('logs/reports/consumer-inventory.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-inventory
          path: logs/reports/consumer-inventory.md
          if-no-files-found: error
          retention-days: 90

      # One reused issue: a fresh one every Monday trains everyone to close them unread.
      - name: File or update the consumer-integrity issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const title = 'consumer-inventory: integrity failure';
            const legacyTitle = 'consumer-inventory: dangling hub references';
            const path = 'logs/reports/consumer-inventory.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '_No report was produced - the run failed before any consumer was graded._';
            const body = [
              'The weekly consumer inventory failed. Either a declared consumer could',
              'not be cloned, a consumer names a missing hub entry point, or a',
              'detected CI quality call has disabled its ratchets or failure verdict.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '---',
              '',
              report,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'documentation',
            });
            const existing = issues.find(i => i.title === title || i.title === legacyTitle);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body,
              });
              console.log(`Updated #${existing.number}.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['documentation'],
            });
