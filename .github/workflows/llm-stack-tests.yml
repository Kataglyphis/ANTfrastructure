# llm-stack API contract tests (backlog 2026-08-10 C4 residual).
#
# LIVE contract tests against an OpenAI-compatible endpoint: an ollama service
# plus the smallest practical model, then `pytest -m "not inference"`. The
# inference-marked tests stay local-only - they need a loaded model producing
# meaningful output.
#
# SCOPE, corrected 2026-09-08: this header used to call
# linux/llm-stack/tests/test_v1_api.py "the suite" while the command ran the
# whole linux/llm-stack/tests/ directory. The COMMAND was right - that scope is
# green today, and narrowing it the prose's way would have dropped coverage - so
# the prose moved to match it.
#
# The run itself now lives in linux/llm-stack/ci-contract-tests.sh, so the owner
# reproduces this job with one command instead of by re-reading this file.
#
# ADVISORY RAMP — NOW A GATE (backlog Batch 6 C4 residual, flipped 2026-08-13):
# the ramp condition ("first green run on a real runner proves the service/model
# bootstrap") is met. Run 31435175821 on main (push, ubuntu-26.04, real ollama
# service) had the "Run non-inference contract tests" STEP conclude success —
# step-level, so it was not masked by continue-on-error. continue-on-error is
# now false; a red test step fails the job. If the service/model bootstrap
# proves flaky on the shared runner, re-add `continue-on-error: true` to the job
# and re-open this residual rather than deleting the suite.
name: llm-stack tests

on:
  push:
    paths:
      - "linux/llm-stack/**"
      - ".github/workflows/llm-stack-tests.yml"
  pull_request:
    paths:
      - "linux/llm-stack/**"
      - ".github/workflows/llm-stack-tests.yml"

permissions:
  contents: read

jobs:
  v1-api-contract:
    runs-on: ubuntu-26.04
    continue-on-error: false  # gate — flipped 2026-08-13 after run 31435175821 (see header)
    timeout-minutes: 20
    services:
      ollama:
        # CI2 (2026-08-17): digest-pinned — a mutable :latest service made the
        # test non-hermetic (could drift/flake with upstream releases). Bump by
        # re-resolving the digest deliberately, not implicitly on every run.
        # latest @ pin time = resolved via registry HEAD.
        image: ollama/ollama@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provisioning stays in the workflow - the same split every other job in
      # this repo uses (setup-uv, Install-Module PSScriptAnalyzer,
      # setup-python). The RUN is the script's.
      - name: Install pytest
        run: pip install --quiet pytest requests

      # OLLAMA_BASE_URL and TEST_TIMEOUT are read by tests/test_v1_api.py itself,
      # so they stay job env. The endpoint is ALSO passed as an argument because
      # the script's readiness probe has to be pointed at the same server the
      # suite talks to - deriving it twice is exactly how those drift apart.
      - name: Wait for ollama, pull the micro model, run the contract tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          TEST_TIMEOUT: "60"
        run: bash linux/llm-stack/ci-contract-tests.sh "${OLLAMA_BASE_URL}"
