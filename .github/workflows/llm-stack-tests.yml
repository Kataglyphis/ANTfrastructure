# llm-stack API contract tests (backlog 2026-08-10 C4 residual).
#
# The suite (linux/llm-stack/tests/test_v1_api.py) is a LIVE contract test
# against an OpenAI-compatible endpoint — 19 of 22 tests need no real
# inference, only a serving API with >=1 model present. CI shape: a real
# ollama service + the smallest practical model, then `pytest -m "not
# inference"`. The 3 inference-marked tests stay local-only (need a loaded
# model with meaningful output).
#
# ADVISORY RAMP — NOW A GATE (backlog Batch 6 C4 residual, flipped 2026-08-13):
# the ramp condition ("first green run on a real runner proves the service/model
# bootstrap") is met. Run 31435175821 on main (push, ubuntu-26.04, real ollama
# service) had the "Run non-inference contract tests" STEP conclude success —
# step-level, so it was not masked by continue-on-error. continue-on-error is
# now false; a red test step fails the job. If the service/model bootstrap
# proves flaky on the shared runner, re-add `continue-on-error: true` to the job
# and re-open this residual rather than deleting the suite.
name: llm-stack tests

on:
  push:
    paths:
      - "linux/llm-stack/**"
      - ".github/workflows/llm-stack-tests.yml"
  pull_request:
    paths:
      - "linux/llm-stack/**"
      - ".github/workflows/llm-stack-tests.yml"

permissions:
  contents: read

jobs:
  v1-api-contract:
    runs-on: ubuntu-26.04
    continue-on-error: false  # gate — flipped 2026-08-13 after run 31435175821 (see header)
    timeout-minutes: 20
    services:
      ollama:
        # CI2 (2026-08-17): digest-pinned — a mutable :latest service made the
        # test non-hermetic (could drift/flake with upstream releases). Bump by
        # re-resolving the digest deliberately, not implicitly on every run.
        # latest @ pin time = resolved via registry HEAD.
        image: ollama/ollama@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for ollama + pull micro model
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null
          # Smallest practical tag; only needs to EXIST in /v1/models — the
          # non-inference tests never require meaningful generations.
          curl -fsS http://localhost:11434/api/pull \
            -d '{"name":"qwen2.5:0.5b"}' | tail -c 200
      - name: Install pytest
        run: pip install --quiet pytest requests
      - name: Run non-inference contract tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          TEST_TIMEOUT: "60"
        run: pytest linux/llm-stack/tests/ -v -m "not inference"
