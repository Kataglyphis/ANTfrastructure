# Lane logic belongs in the caller's build script, which a local container run executes too, not in this skeleton.

name: Container CI · Windows (reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      target-arch:
        description: >-
          amd64 builds in the family Windows image; arm64 builds in the arm64
          bundle (the cross lane) and enables the arch gate and the run job.
          Both images come from prepare-windows-container-host's defaults, which
          verify_ci_image_refs.py holds to versions.env: no image is named here.
        required: false
        type: string
        default: amd64
      build-script:
        description: >-
          The lane's entry point, RELATIVE TO THE REPOSITORY ROOT
          (e.g. scripts/windows/Build-Windows.ps1). It runs inside the container
          under C:\ws.
        required: true
        type: string
      build-args:
        description: Arguments for the build script, one per line.
        required: false
        type: string
        default: ''
      container-env:
        description: >-
          Environment for the container, one KEY=value per line (passed as
          `--env KEY=value`).
        required: false
        type: string
        default: ''
      cpus:
        description: docker --cpus; empty = every logical processor of the runner.
        required: false
        type: string
        default: ''
      memory:
        description: docker --memory.
        required: false
        type: string
        default: 16g
      fetch-depth:
        description: Checkout depth. 0 = full history (a build that derives its version from git).
        required: false
        type: number
        default: 1
      exclude-submodules:
        description: Submodule paths to leave out of the short-path clone, one per line.
        required: false
        type: string
        default: ''
      artifact-name:
        description: Name of the uploaded artifact.
        required: true
        type: string
      artifact-dir:
        description: >-
          The directory the build script leaves its product in, RELATIVE TO THE
          REPOSITORY ROOT. It is uploaded whole, graded by the arch gate, and is
          the working directory of the run job.
        required: true
        type: string
      arch-gate-min-inspected:
        description: >-
          arm64 only: the arch gate's -MinInspected floor. A tree with fewer PE
          files than this fails, so a build that silently produced nothing cannot
          pass as "no x64 objects found".
        required: false
        type: number
        default: 1
      run-command:
        description: >-
          arm64 only: PowerShell that runs on windows-11-arm inside the downloaded
          artifact-dir, e.g. `./app.exe --version`. A non-zero exit of any native
          command in it fails the lane. Empty = no run job, unless test-command is set.
        required: false
        type: string
        default: ''
      test-artifact-dir:
        description: >-
          arm64 only: the directory the build script stages its test binaries in,
          RELATIVE TO THE REPOSITORY ROOT. It is graded by the same arch gate as
          artifact-dir (Windows on Arm runs x64 code transparently, so an amd64 test
          would pass by emulation), uploaded as `<artifact-name>-tests`, and is the
          working directory of test-command. Empty = none.
        required: false
        type: string
        default: ''
      test-command:
        description: >-
          arm64 only: PowerShell that runs the tests on windows-11-arm inside the
          downloaded test-artifact-dir, after run-command. A non-zero exit of any native
          command in it fails the lane, and it must print one line
          `TESTS: passed=<n> failed=<n> skipped=<n>`: the lane fails without it, with no
          passing test, or with any failure, and the counts go to the job summary.
        required: false
        type: string
        default: ''
      test-arch-gate-min-inspected:
        description: >-
          arm64 only: the arch gate's -MinInspected floor for test-artifact-dir. 0 is for a
          test tree with no binaries of its own (a Python suite run by the product's
          interpreter): any PE file in it must still be arm64, but none is required and no
          import walk runs, since its DLLs come from the product tree.
        required: false
        type: number
        default: 1
      timeout-minutes:
        description: Time limit of the build job.
        required: false
        type: number
        default: 180
      version-file:
        description: >-
          A version file, RELATIVE TO THE REPOSITORY ROOT (e.g. VERSION.txt). When set,
          the hub's version_util.sh resolves VERSION and MSIX_VERSION on the host, from
          that file, the ref name and the run number, and the container gets both as
          environment. Empty = none.
        required: false
        type: string
        default: ''
      host-command:
        description: >-
          PowerShell that runs on the runner HOST, in the workspace, after the container
          build: tests Server Core cannot run (it has no OpenGL), or a run of the x64
          product. A non-zero exit of any native command in it fails the lane.
          Empty = none.
        required: false
        type: string
        default: ''
      compiler-cache-key:
        description: >-
          Keep the build's compiler cache across runs: a lane id for the actions/cache key,
          empty (the default) for none. The cache is restored into the workspace as
          .ci-cache, the container gets CI_COMPILER_CACHE=C:\ws\.ci-cache, and pushes
          to the default branch save it after the build. The build script must move it
          to container-local
          directories and back: sccache cannot write to a mounted directory
          (docs/build-cache-tiers.md). Not for clang-cl C++20 module builds until
          mozilla/sccache#2876 ships. This job cannot delete the entries older runs
          saved (it grants contents: read only), so the caller runs compiler-cache-prune
          from a later job with actions: write.
        required: false
        type: string
        default: ''
    secrets:
      GHCR_PAT:
        description: Token to pull the image from ghcr. Only needed while the image is private.
        required: false
      CONTAINER_SECRET_ENV:
        description: >-
          Secret environment for the container, one KEY=value per line, which a caller
          composes from its own secrets (WebDAV credentials, a signing password). Every
          value is masked, and the pairs reach docker as an --env-file in RUNNER_TEMP, so
          no value enters a command line, a step output or the job environment.
        required: false

jobs:
  build:
    name: build (${{ inputs.target-arch }})
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Prepare the Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          target-arch: ${{ inputs.target-arch }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: ${{ inputs.fetch-depth }}
          exclude-submodules: ${{ inputs.exclude-submodules }}

      # Before the build, so the packages and the product carry the CI version.
      - name: Resolve the version
        id: version
        if: ${{ inputs.version-file != '' }}
        shell: bash
        working-directory: ${{ steps.prep.outputs.workspace }}
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash third_party/ANTfrastructure/linux/scripts/02-toolchain/rust/version_util.sh --github-env "$VERSION_FILE"

      # Inside the workspace: the container's only bind mount, and the only one the run ladder rewrites.
      - name: Restore the compiler cache
        if: ${{ inputs.compiler-cache-key != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prep.outputs.workspace }}\.ci-cache
          key: compiler-cache-${{ inputs.compiler-cache-key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-cache-${{ inputs.compiler-cache-key }}-

      # run-in-windows-container takes docker arguments one per line.
      - name: Compose the container environment
        id: env
        shell: pwsh
        env:
          CONTAINER_ENV: ${{ inputs.container-env }}
          CONTAINER_SECRET_ENV: ${{ secrets.CONTAINER_SECRET_ENV }}
          RESOLVED_VERSION: ${{ steps.version.outputs.VERSION }}
          RESOLVED_MSIX_VERSION: ${{ steps.version.outputs.MSIX_VERSION }}
          COMPILER_CACHE_KEY: ${{ inputs.compiler-cache-key }}
          WORKSPACE: ${{ steps.prep.outputs.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pairs = @($env:CONTAINER_ENV -split "\r?\n" | ForEach-Object Trim | Where-Object { $_ })
          if ($env:RESOLVED_VERSION) { $pairs += "VERSION=$env:RESOLVED_VERSION", "MSIX_VERSION=$env:RESOLVED_MSIX_VERSION" }
          if ($env:COMPILER_CACHE_KEY) {
            # Present on a miss too, so the build script can fill it for the save.
            New-Item -ItemType Directory -Force -Path (Join-Path $env:WORKSPACE '.ci-cache') | Out-Null
            $pairs += 'CI_COMPILER_CACHE=C:\ws\.ci-cache'
          }
          $lines = @(foreach ($pair in $pairs) {
              if ($pair -notmatch '^[A-Za-z_][A-Za-z0-9_]*=') { throw "container-env line is not KEY=value: '$pair'" }
              '--env'; $pair
          })
          # Secrets are masked and reach docker as a file, never an argument; a bad line is refused unechoed.
          $secret = @($env:CONTAINER_SECRET_ENV -split "\r?\n" | Where-Object { $_ })
          foreach ($pair in $secret) {
              if ($pair -notmatch '^[A-Za-z_][A-Za-z0-9_]*=') { throw 'a CONTAINER_SECRET_ENV line is not KEY=value (the line is withheld: it may hold a secret)' }
              $value = $pair.Substring($pair.IndexOf('=') + 1)
              if ($value) { Write-Output "::add-mask::$value" }
          }
          if ($secret.Count -gt 0) {
              $envFile = Join-Path $env:RUNNER_TEMP 'container-secret.env'
              [System.IO.File]::WriteAllText($envFile, (($secret -join "`n") + "`n"))
              $lines += '--env-file', $envFile
          }
          $delim = "EOF_$([guid]::NewGuid().ToString('N'))"
          "args<<$delim", @($lines), $delim | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT

      - name: Build in the container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          target-arch: ${{ inputs.target-arch }}
          cpus: ${{ inputs.cpus }}
          memory: ${{ inputs.memory }}
          file: C:\ws\${{ inputs.build-script }}
          file-args: ${{ inputs.build-args }}
          extra-args: ${{ steps.env.outputs.args }}

      # Default-branch pushes only, like compiler-cache-save's `auto`; other runs restore without spending quota.
      - name: Save the compiler cache
        if: >-
          ${{ always() && inputs.compiler-cache-key != '' && github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prep.outputs.workspace }}\.ci-cache
          key: compiler-cache-${{ inputs.compiler-cache-key }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The workspace is the container's bind mount, so the host sees the build's files at the same paths.
      - name: Run the host command
        if: ${{ inputs.host-command != '' }}
        shell: pwsh
        working-directory: ${{ steps.prep.outputs.workspace }}
        env:
          HOST_COMMAND: ${{ inputs.host-command }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Every native command in host-command counts, not just the last one.
          $PSNativeCommandUseErrorActionPreference = $true
          $script = Join-Path $env:RUNNER_TEMP 'host-command.ps1'
          Set-Content -LiteralPath $script -Value $env:HOST_COMMAND -Encoding utf8
          & $script
          if ($LASTEXITCODE) { throw "host-command exited $LASTEXITCODE" }

      # The caller's own hub submodule, so the gate is the version the caller pins.
      - name: Arch gate (arm64 tree, imports resolvable on a clean device)
        if: ${{ inputs.target-arch == 'arm64' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          target-arch: ${{ inputs.target-arch }}
          file: C:\ws\third_party\ANTfrastructure\windows\scripts\build\Test-TargetArch.ps1
          file-args: |
            -Path
            C:\ws\${{ inputs.artifact-dir }}
            -Arch
            arm64
            -MinInspected
            ${{ inputs.arch-gate-min-inspected }}
            -ImportWalk

      - name: Arch gate (arm64 test tree)
        if: ${{ inputs.target-arch == 'arm64' && inputs.test-artifact-dir != '' && inputs.test-arch-gate-min-inspected > 0 }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          target-arch: ${{ inputs.target-arch }}
          file: C:\ws\third_party\ANTfrastructure\windows\scripts\build\Test-TargetArch.ps1
          file-args: |
            -Path
            C:\ws\${{ inputs.test-artifact-dir }}
            -Arch
            arm64
            -MinInspected
            ${{ inputs.test-arch-gate-min-inspected }}
            -ImportWalk

      - name: Arch gate (arm64 test tree without binaries)
        if: ${{ inputs.target-arch == 'arm64' && inputs.test-artifact-dir != '' && inputs.test-arch-gate-min-inspected == 0 }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          target-arch: ${{ inputs.target-arch }}
          file: C:\ws\third_party\ANTfrastructure\windows\scripts\build\Test-TargetArch.ps1
          file-args: |
            -Path
            C:\ws\${{ inputs.test-artifact-dir }}
            -Arch
            arm64
            -MinInspected
            0
            -AllowEmptyTree

      - name: Upload the product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.prep.outputs.workspace }}/${{ inputs.artifact-dir }}
          if-no-files-found: error

      - name: Upload the tests
        if: ${{ inputs.target-arch == 'arm64' && inputs.test-artifact-dir != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-tests
          path: ${{ steps.prep.outputs.workspace }}/${{ inputs.test-artifact-dir }}
          if-no-files-found: error

  run-arm64:
    name: run on windows-11-arm
    if: ${{ inputs.target-arch == 'arm64' && (inputs.run-command != '' || inputs.test-command != '') }}
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download the product
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: product

      - name: Run it natively
        if: ${{ inputs.run-command != '' }}
        shell: pwsh
        working-directory: product
        env:
          RUN_COMMAND: ${{ inputs.run-command }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Every native command in run-command counts, not just the last one.
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "the run job must be on arm64, not $env:PROCESSOR_ARCHITECTURE" }
          $script = Join-Path $env:RUNNER_TEMP 'run-arm64.ps1'
          Set-Content -LiteralPath $script -Value $env:RUN_COMMAND -Encoding utf8
          & $script
          if ($LASTEXITCODE) { throw "run-command exited $LASTEXITCODE" }

      - name: Download the tests
        if: ${{ inputs.test-command != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}-tests
          path: tests

      # The counts line is the verdict: a test-command that ran nothing must not read as green.
      - name: Test it natively
        if: ${{ inputs.test-command != '' }}
        shell: pwsh
        working-directory: tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "the test job must be on arm64, not $env:PROCESSOR_ARCHITECTURE" }
          $script = Join-Path $env:RUNNER_TEMP 'test-arm64.ps1'
          Set-Content -LiteralPath $script -Value $env:TEST_COMMAND -Encoding utf8
          $log = Join-Path $env:RUNNER_TEMP 'test-arm64.log'
          $global:LASTEXITCODE = 0
          & $script *>&1 | Tee-Object -FilePath $log
          # The counts reach the summary before any verdict, so a red run still says what failed.
          $exit = $LASTEXITCODE
          $counts = @(Select-String -LiteralPath $log -Pattern '^TESTS: passed=(\d+) failed=(\d+) skipped=(\d+)\s*$')
          if ($counts.Count -ne 1) { throw "test-command printed $($counts.Count) 'TESTS: passed=<n> failed=<n> skipped=<n>' lines (exit $exit); exactly one is the verdict" }
          $passed, $failed, $skipped = $counts[0].Matches[0].Groups[1..3].Value | ForEach-Object { [int]$_ }
          "### arm64 tests on windows-11-arm`n`npassed $passed, failed $failed, skipped $skipped" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
          if ($exit) { throw "test-command exited $exit" }
          if ($failed -gt 0) { throw "$failed arm64 test(s) failed" }
          if ($passed -lt 1) { throw 'no arm64 test passed; a run with nothing tested is not a test verdict' }
