# Empty version inputs fall through to the driver's default. See docs/python-ci.md § Positional arguments: empty means default
name: Python CI · Linux (reusable)

# Least privilege: this lane never writes to the repository.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      package-name:
        description: >-
          Importable package/module directory, e.g. orchestrant. NOT the
          distribution name from pyproject.toml - the two are allowed to differ
          in case and separators (OrchestrANT ships its distribution as
          "OrchestrANT" and its module as "orchestrant"), and passing the former
          makes coverage silently target a path that does not exist.
        required: true
        type: string
      container-image:
        description: >-
          Override the per-architecture image chosen by the matrix below. Leave
          empty (the default) to use the :latest family, which is what the
          Linux lanes should be on. Setting this uses ONE image for every
          architecture, so only do it for a single-arch run.
        required: false
        type: string
        default: ''
      test-python-versions:
        description: >-
          Space-separated interpreter list for ci_tests.sh, e.g. "3.14 3.14t".
          Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      test-paths:
        description: >-
          Comma-separated pytest paths. Empty (the default) runs the project's own
          configured testpaths, so no part of the suite is left on no lane.
        required: false
        type: string
        default: ''
      free-threaded-extras:
        description: >-
          Comma-separated extras a free-threaded leg (e.g. 3.14t) syncs instead of
          all of them. Set, that leg gates like any other; empty keeps it
          experimental, and a failed sync is reported as a warning annotation.
        required: false
        type: string
        default: ''
      test-extras:
        description: >-
          Comma-separated extras EVERY leg syncs instead of all of them - the
          riscv64 row cannot build the full set under QEMU. Empty syncs all
          extras, as before.
        required: false
        type: string
        default: ''
      package-emulated:
        description: >-
          Run the packaging step on the emulated riscv64 row as well. Set true
          for an app whose wheel is arch-specific (a Cython build): the wheels
          build under QEMU. The app packages of a packaging/app.json app stay
          amd64-arm64 - the image's AppImage tooling has no riscv64 build, so
          ci_packaging.sh ships wheels only there.
        required: false
        type: boolean
        default: false
      static-analysis-python-version:
        description: Interpreter for ci_static_analysis.sh. Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      docs-python-version:
        description: Interpreter for ci_build_docs.sh. Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      packaging-python-version:
        description: Interpreter for ci_packaging.sh. Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      free-threaded-wheel:
        description: >-
          PYTHON_FREE_THREADED_WHEEL for ci_packaging.sh - auto builds the proved
          cp314t wheel when pyproject.toml declares the Free Threading classifier,
          on forces it, off skips it. Anything else fails the packaging step.
        required: false
        type: string
        default: auto
      deploy-docs:
        description: >-
          Whether to FTP-sync the built docs on a push. Set false to build docs without
          publishing (and then the FTP secrets are not required). A pull request never publishes.
        required: false
        type: boolean
        default: true
      docs-artifact-path:
        description: Directory the docs build produces, relative to the workspace.
        required: false
        type: string
        default: ./docs/build/html/
      arches:
        description: >-
          The arch rows to run, space-separated, from "x64", "arm64" and
          "riscv64". The default runs the two native rows, which is what every
          caller ran before this input existed. A caller split per arch
          (linux-x64.yml, linux-arm64.yml, linux-riscv64.yml) passes one;
          riscv64 runs the riscv64 image under QEMU on an amd64 runner and
          tests only; pass package-emulated to also build the wheels. An
          unknown, repeated or empty entry fails the plan job
          rather than running fewer rows than were asked for.
        required: false
        type: string
        default: x64 arm64
    secrets:
      GHCR_PAT:
        description: Token used to pull the build image from ghcr.
        required: true
      FTP_SERVER:
        description: Docs deploy target host.
        required: false
      FTP_USERNAME:
        description: Docs deploy user.
        required: false
      FTP_PASSWORD:
        description: >-
          Docs deploy password. Callers map their own secret name onto this -
          OrchestrANT stores it as PW, WebDavClient as PASSWORD. Renaming
          either repo's secret is not required.
        required: false

jobs:
  # Rows written here, not a static matrix: GitHub re-adds an excluded `include:` row (docs/python-ci.md#one-arch-per-caller-the-arches-input).
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.rows.outputs.matrix }}
    steps:
      - name: Select the arch rows
        id: rows
        env:
          ARCHES: ${{ inputs.arches }}
        run: |
          set -euo pipefail
          rows=""
          seen=" "
          # -d '': a block-scalar input spans lines; one plain read would drop all but the first.
          read -r -d '' -a want <<< "${ARCHES}" || true
          for arch in "${want[@]}"; do
            case "${arch}" in
              x64) row='{"runs_on":"ubuntu-26.04","arch":"x64","platform":"linux/amd64"}' ;;
              arm64) row='{"runs_on":"ubuntu-26.04-arm","arch":"arm64","platform":"linux/arm64"}' ;;
              riscv64) row='{"runs_on":"ubuntu-26.04","arch":"riscv64","platform":"linux/riscv64","timeout":360}' ;;
              *) echo "::error::arches: unknown arch '${arch}' (known: x64 arm64 riscv64)"; exit 1 ;;
            esac
            case "${seen}" in
              *" ${arch} "*) echo "::error::arches: '${arch}' is listed twice"; exit 1 ;;
            esac
            seen="${seen}${arch} "
            rows="${rows:+${rows},}${row}"
          done
          if [ -z "${rows}" ]; then
            echo "::error::arches is empty: name at least one of x64 arm64 riscv64"
            exit 1
          fi
          printf 'matrix={"include":[%s]}\n' "${rows}" >> "${GITHUB_OUTPUT}"
          printf 'rows: %s\n' "${rows}"

  build:
    name: ${{ matrix.arch }}
    needs: plan
    env:
      # Spelled out because an input passed as '' skips the action default; verify_ci_image_refs.py holds it to versions.env.
      CONTAINER_IMAGE: ${{ inputs.container-image || 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest' }}
    strategy:
      # One arch failing should not hide the other's result.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runs_on }}
    # riscv64 runs under QEMU and carries its own, longer budget.
    timeout-minutes: ${{ matrix.timeout || 60 }}

    steps:
      # The shared prologue keeps the pull retry count and timeout in one place for every repo.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          registry-username: Kataglyphis
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      # The riscv64 test row runs the riscv64 image under QEMU; the packaging step crosses on the native row, so it needs the sysroot.
      - name: Register QEMU binfmt (riscv64)
        if: matrix.arch == 'riscv64'
        id: riscv64-cross
        uses: Kataglyphis/ANTfrastructure/.github/actions/setup-riscv64-cross@develop
        with:
          sysroot: ${{ inputs.package-emulated }}

      - name: Python static analysis
        if: matrix.arch != 'riscv64'
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: --platform ${{ matrix.platform }}
          script: >-
            bash -lc "bash scripts/linux/ci_static_analysis.sh
            '${{ matrix.arch }}' '${{ inputs.static-analysis-python-version }}'"

      - name: Run Python tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: >-
            --platform ${{ matrix.platform }}
            -e PYTEST_PATHS=${{ inputs.test-paths }}
            -e FREE_THREADED_SYNC_EXTRAS=${{ inputs.free-threaded-extras }}
            -e SYNC_EXTRAS=${{ inputs.test-extras }}
            ${{ matrix.arch == 'riscv64' && inputs.package-emulated && '-e UV_CACHE_DIR=/workspace/.uv-cache' || '' }}
          script: >-
            bash -lc "bash scripts/linux/ci_tests.sh
            '${{ inputs.package-name }}' '${{ inputs.test-python-versions }}'"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.arch }}
          path: docs/test_results/

      - name: Build Docs
        if: ${{ matrix.arch == 'x64' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: --platform ${{ matrix.platform }}
          script: >-
            bash -lc "bash scripts/linux/ci_build_docs.sh
            '${{ inputs.docs-python-version }}'"

      # @develop, not ./: a workflow_call workflow runs in the caller's checkout. Push only: a PR must not publish.
      - name: 📂 Sync files to domain
        if: ${{ matrix.arch == 'x64' && inputs.deploy-docs && github.event_name == 'push' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ inputs.docs-artifact-path }}

      # Packaging on the riscv64 row is opt-in: the wheels are CROSS-built on this amd64 row (the emulated compile hung), and the app packages stay amd64-arm64.
      - name: Packaging application
        if: matrix.arch != 'riscv64' || inputs.package-emulated
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: >-
            --platform ${{ matrix.arch == 'riscv64' && 'linux/amd64' || matrix.platform }}
            ${{ matrix.arch == 'riscv64' && inputs.package-emulated && steps.riscv64-cross.outputs.docker-args || '' }}
            ${{ matrix.arch == 'riscv64' && inputs.package-emulated && '-e UV_CACHE_DIR=/workspace/.uv-cache' || '' }}
            ${{ matrix.arch == 'riscv64' && inputs.package-emulated && '-e PACKAGING_CROSS_TARGET=riscv64' || '' }}
            -e SYNC_EXTRAS=${{ matrix.arch == 'riscv64' && inputs.test-extras || '' }}
            -e PYTHON_FREE_THREADED_WHEEL=${{ inputs.free-threaded-wheel }}
          script: >-
            bash -lc "bash scripts/linux/ci_packaging.sh
            '${{ inputs.packaging-python-version }}'"

      - name: Fix permissions for dist directory
        if: matrix.arch != 'riscv64' || inputs.package-emulated
        run: |
          sudo chown -R "$USER:$USER" "${{ github.workspace }}/dist"
          sudo chmod -R 755 "${{ github.workspace }}/dist"
          ls -la "${{ github.workspace }}/dist/"

      - name: Verify dist directory
        if: matrix.arch != 'riscv64' || inputs.package-emulated
        run: |
          echo "Checking for wheel files:"
          ls -la "${{ github.workspace }}/dist/"
          find "${{ github.workspace }}/dist/" -name "*.whl"

      - name: Upload packages (source/binary only)
        if: ${{ always() && (matrix.arch != 'riscv64' || inputs.package-emulated) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-${{ matrix.arch }}-source-and-binary
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error
