# .github/workflows/python-ci-linux.yml
#
# Reusable Linux CI lane for the Python consumers (OrchestrANT,
# WebDavClient). Static analysis -> tests -> docs -> FTP deploy ->
# packaging, on the x86-64 and arm64 native runners; `arches` picks which, so a
# caller split into linux-x64.yml / linux-arm64.yml passes one each.
#
# Before this existed the two callers each carried a 112-line copy that differed
# on 14 lines, and every one of those differences was a parameter. Two of them
# were not even real: OrchestrANT passed '3.14' to ci_static_analysis.sh and
# ci_packaging.sh, which is exactly what those drivers default to, so the two
# repos were running identical commands through different-looking YAML.
#
# The drivers all read positionals as "${N:-default}", and that expansion treats
# an EMPTY argument the same as an absent one. So every version input here can
# default to '' and be passed through unconditionally - the driver's own default
# then applies, and callers only name a version when they actually want to
# override it. That is why there is no conditional command construction below.
name: Python CI · Linux (reusable)

# Least privilege: this lane reads the repo, pulls an image and pushes artifacts.
# It never writes to the repository.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      package-name:
        description: >-
          Importable package/module directory, e.g. orchestrant. NOT the
          distribution name from pyproject.toml - the two are allowed to differ
          in case and separators (OrchestrANT ships its distribution as
          "OrchestrANT" and its module as "orchestrant"), and passing the former
          makes coverage silently target a path that does not exist.
        required: true
        type: string
      container-image:
        description: >-
          Override the per-architecture image chosen by the matrix below. Leave
          empty (the default) to use the :latest family, which is what the
          Linux lanes should be on. Setting this uses ONE image for every
          architecture, so only do it for a single-arch run.
        required: false
        type: string
        default: ''
      test-python-versions:
        description: >-
          Space-separated interpreter list for ci_tests.sh, e.g. "3.14 3.14t".
          Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      static-analysis-python-version:
        description: Interpreter for ci_static_analysis.sh. Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      docs-python-version:
        description: Interpreter for ci_build_docs.sh. Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      packaging-python-version:
        description: Interpreter for ci_packaging.sh. Empty keeps the driver's default.
        required: false
        type: string
        default: ''
      deploy-docs:
        description: >-
          Whether to FTP-sync the built docs. Set false to build docs without
          publishing (and then the FTP secrets are not required).
        required: false
        type: boolean
        default: true
      docs-artifact-path:
        description: Directory the docs build produces, relative to the workspace.
        required: false
        type: string
        default: ./docs/build/html/
      arches:
        description: >-
          The arch rows to run, space-separated, from "x64" and "arm64". The
          default runs both, which is what every caller ran before this input
          existed. A caller split per arch (linux-x64.yml, linux-arm64.yml)
          passes one. An unknown, repeated or empty entry fails the plan job
          rather than running fewer rows than were asked for.
        required: false
        type: string
        default: x64 arm64
    secrets:
      GHCR_PAT:
        description: Token used to pull the build image from ghcr.
        required: true
      FTP_SERVER:
        description: Docs deploy target host.
        required: false
      FTP_USERNAME:
        description: Docs deploy user.
        required: false
      FTP_PASSWORD:
        description: >-
          Docs deploy password. Callers map their own secret name onto this -
          OrchestrANT stores it as PW, WebDavClient as PASSWORD. Renaming
          either repo's secret is not required.
        required: false

jobs:
  # `arches` -> the build matrix. The rows are written here, not as a static
  # matrix, because GitHub re-adds an excluded `include:` row
  # (docs/python-ci.md#one-arch-per-caller-the-arches-input).
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.rows.outputs.matrix }}
    steps:
      - name: Select the arch rows
        id: rows
        env:
          ARCHES: ${{ inputs.arches }}
        run: |
          set -euo pipefail
          rows=""
          seen=" "
          # -d '': a block-scalar input spans lines; one plain read would drop all but the first.
          read -r -d '' -a want <<< "${ARCHES}" || true
          for arch in "${want[@]}"; do
            case "${arch}" in
              x64) row='{"runs_on":"ubuntu-26.04","arch":"x64","platform":"linux/amd64"}' ;;
              arm64) row='{"runs_on":"ubuntu-26.04-arm","arch":"arm64","platform":"linux/arm64"}' ;;
              *) echo "::error::arches: unknown arch '${arch}' (known: x64 arm64)"; exit 1 ;;
            esac
            case "${seen}" in
              *" ${arch} "*) echo "::error::arches: '${arch}' is listed twice"; exit 1 ;;
            esac
            seen="${seen}${arch} "
            rows="${rows:+${rows},}${row}"
          done
          if [ -z "${rows}" ]; then
            echo "::error::arches is empty: name at least one of x64 arm64"
            exit 1
          fi
          printf 'matrix={"include":[%s]}\n' "${rows}" >> "${GITHUB_OUTPUT}"
          printf 'rows: %s\n' "${rows}"

  build:
    name: ${{ matrix.arch }}
    needs: plan
    env:
      # The caller's override wins; otherwise the family Linux image.
      #
      # ONE literal per file, and a CHECKED one: this string must equal
      # ${IMAGE_REGISTRY_PREFIX}:${CI_IMAGE_LINUX_TAG} from
      # linux/scripts/01-core/versions.env, which
      # linux/scripts/verify_ci_image_refs.py asserts on every run (preflight
      # slug `workflow-lint`). It is spelled out rather than left to the
      # composite actions' own default because `container-image` is an OPTIONAL
      # input: an omitted input takes an action default, but an input passed as
      # the empty string does NOT - it arrives as an empty image reference.
      #
      # Both legs pull the SAME tag, so this used to be a per-arch matrix key
      # and was simply the same string twice. `:latest` is a multi-arch
      # index (linux/amd64, linux/arm64, linux/riscv64, all children present as
      # of 2026-08-12), so docker resolves the right platform per runner.
      #
      # It was briefly per-arch for real: while the index listed amd64 only, the
      # arm64 leg had to name `:latest-cross-arm64`. That is no longer true, and
      # the arch-suffixed tags are now an implementation detail of the image
      # build rather than something a consumer should reference.
      #
      # Do NOT fall back to plain `:latest`. Its per-platform children were
      # deleted by the ghcr-cleanup bug (fixed in b70d3f4) and are still gone -
      # the index resolves, every child 404s, and `docker pull` reports only
      # "manifest unknown".
      CONTAINER_IMAGE: ${{ inputs.container-image || 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest' }}
    strategy:
      # One arch failing should not hide the other's result.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60

    steps:
      # ANTfrastructure's shared prologue: reclaim runner disk, check out, log in
      # to ghcr and pull with retries. Replaces four hand-rolled steps including
      # a copy of the retry loop, so the retry count and timeout live in one
      # place for every repo instead of drifting per workflow.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          registry-username: Kataglyphis
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      - name: Python static analysis
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: --platform ${{ matrix.platform }}
          script: >-
            bash -lc "bash scripts/linux/ci_static_analysis.sh
            '${{ matrix.arch }}' '${{ inputs.static-analysis-python-version }}'"

      - name: Run Python tests
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: --platform ${{ matrix.platform }}
          script: >-
            bash -lc "bash scripts/linux/ci_tests.sh
            '${{ inputs.package-name }}' '${{ inputs.test-python-versions }}'"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: test-reports-${{ matrix.runs_on }}
          path: docs/test_results/

      - name: Build Docs
        if: ${{ matrix.arch == 'x64' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: --platform ${{ matrix.platform }}
          script: >-
            bash -lc "bash scripts/linux/ci_build_docs.sh
            '${{ inputs.docs-python-version }}'"

      # The docs are built as root inside the container; deploy-over-ftp owns
      # the readability fixup, the pin, the trailing-slash normalisation and the
      # empty-tree refusal (docs/ftp-deploys.md). Named at @main: a workflow_call
      # workflow runs in the CALLER's checkout, where ./ does not resolve here.
      - name: 📂 Sync files to domain
        if: ${{ matrix.arch == 'x64' && inputs.deploy-docs }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@main
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ inputs.docs-artifact-path }}

      - name: Packaging application
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: --platform ${{ matrix.platform }}
          script: >-
            bash -lc "bash scripts/linux/ci_packaging.sh
            '${{ inputs.packaging-python-version }}'"

      - name: Fix permissions for dist directory
        run: |
          sudo chown -R "$USER:$USER" "${{ github.workspace }}/dist"
          sudo chmod -R 755 "${{ github.workspace }}/dist"
          ls -la "${{ github.workspace }}/dist/"

      - name: Verify dist directory
        run: |
          echo "Checking for wheel files:"
          ls -la "${{ github.workspace }}/dist/"
          find "${{ github.workspace }}/dist/" -name "*.whl"

      - name: Upload packages (source/binary only)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: packages-linux-${{ matrix.runs_on }}-source-and-binary
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error
