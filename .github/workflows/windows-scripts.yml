# .github/workflows/windows-scripts.yml
# Source-level gate for the Windows build tooling: PowerShell parse/analyzer
# lint plus the windows/scripts/tests suites. Deliberately builds NO container
# images (the image chain is built locally; see docs/windows-builds.md).
#
# Runner is windows-latest because several suites exercise Windows-shaped
# fixtures (C:\ paths, vswhere output, cmd.exe guards); running everything on
# one Windows runner avoids a per-suite OS matrix. pwsh 7 and Pester v5 are
# preinstalled on the hosted image.
name: Windows Scripts
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'linux/scripts/01-core/versions.env'
      - '.github/workflows/windows-scripts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - 'linux/scripts/01-core/versions.env'
      - '.github/workflows/windows-scripts.yml'

permissions:
  contents: read

# One run per ref: a force-push supersedes the in-flight run instead of
# burning Windows runner minutes next to it.
concurrency:
  group: windows-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      # Parse gate is enforced; analyzer findings are advisory until the
      # backlog of findings across the 24 modules is triaged — then add
      # -FailOnAnalyzer to also fail on analyzer errors.
      - name: Lint (parse gate + PSScriptAnalyzer)
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/Invoke-Lint.ps1

      # Hermetic Pester floor: the suites need Pester v5; the hosted image
      # currently ships 5.9.0 (so this is a fast no-op-ish install), but
      # runner-image updates have swapped preinstalled module versions before.
      # Installing our own pinned floor keeps the test run independent of
      # whatever the image happens to carry.
      - name: Ensure Pester >= 5.7
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.7 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run test suites
        shell: pwsh
        run: pwsh -NoProfile -File windows/scripts/tests/Invoke-Tests.ps1
