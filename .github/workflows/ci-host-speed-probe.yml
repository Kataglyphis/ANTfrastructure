# Times the image prologue's variants side by side on real runners; docs/windows-container-build-performance.md § The prologue on hosted runners.
name: CI host · prologue speed probe

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Run the windows-2025 variants (each pulls the ~17 GB winamd64).
        type: boolean
        default: true
      linux:
        description: Run the ubuntu-26.04 and ubuntu-26.04-arm variants.
        type: boolean
        default: true
      detach:
        description: Run the windows-2025 detach checks (no image pull, minutes).
        type: boolean
        default: true

permissions:
  contents: read

# Per input set, so a quick detach-only dispatch does not cancel a full run.
concurrency:
  group: ci-host-speed-probe-${{ github.ref }}-${{ inputs.windows }}-${{ inputs.linux }}-${{ inputs.detach }}
  cancel-in-progress: true

jobs:
  # Does a process a step starts outlive that step? Heartbeats say, per launch method.
  windows-detach:
    name: windows detach (${{ matrix.method }})
    if: ${{ inputs.detach }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        method: [start-process, start-process-redirect, cim]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Start a 60 s heartbeat (${{ matrix.method }})
        env:
          METHOD: ${{ matrix.method }}
        run: |
          $beat = Join-Path $env:RUNNER_TEMP 'beat.txt'
          $script = Join-Path $env:RUNNER_TEMP 'beat.ps1'
          Set-Content -LiteralPath $script -Value "foreach (`$i in 1..60) { Add-Content -LiteralPath '$beat' -Value ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds()); Start-Sleep -Seconds 1 }"
          $pwsh = (Get-Process -Id $PID).Path
          if ($env:METHOD -eq 'start-process') {
            $p = Start-Process -FilePath $pwsh -ArgumentList @('-NoProfile', '-File', "`"$script`"") -PassThru
            Write-Host "started pid $($p.Id)"
          } elseif ($env:METHOD -eq 'start-process-redirect') {
            $out = Join-Path $env:RUNNER_TEMP 'beat.log'
            $p = Start-Process -FilePath $pwsh -ArgumentList @('-NoProfile', '-File', "`"$script`"") -PassThru -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            Write-Host "started pid $($p.Id) with redirected output"
          } else {
            $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = "`"$pwsh`" -NoProfile -File `"$script`"" }
            Write-Host "Win32_Process.Create returned $($r.ReturnValue), pid $($r.ProcessId)"
          }
          Start-Sleep -Seconds 3
          "STEP_END=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

      - name: Let it run
        run: Start-Sleep -Seconds 20

      - name: DETACH
        env:
          METHOD: ${{ matrix.method }}
        run: |
          $beats = @(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'beat.txt') -ErrorAction SilentlyContinue | ForEach-Object { [long]$_ })
          $after = @($beats | Where-Object { $_ -gt [long]$env:STEP_END + 2 }).Count
          Write-Host "DETACH method=$env:METHOD beats=$($beats.Count) beats_after_step=$after survived=$(if ($after -gt 0) { 'yes' } else { 'no' })"

  # The real background cleanup and its wait, without an image pull in front of it.
  windows-cleanup-background:
    name: windows cleanup background + wait
    if: ${{ inputs.detach }}
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      - name: 'C: before'
        run: '"C_BEFORE=$([math]::Round((Get-PSDrive C).Free / 1GB, 1))" >> $env:GITHUB_ENV'

      - name: cleanup-disk-space (background)
        uses: ./.github/actions/cleanup-disk-space
        with:
          mode: background

      - name: Work beside it
        run: Start-Sleep -Seconds 120

      - name: cleanup-disk-space (wait)
        uses: ./.github/actions/cleanup-disk-space
        with:
          mode: wait

      - name: DETACH
        run: |
          $done = Join-Path $env:RUNNER_TEMP 'disk-cleanup.done'
          $marker = if (Test-Path -LiteralPath $done) { (Get-Content -LiteralPath $done -Raw).Trim() } else { 'none' }
          $waited = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'disk-cleanup.waited') -Raw -ErrorAction SilentlyContinue)
          $after = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "DETACH method=action-background c_before_gb=$env:C_BEFORE c_after_gb=$after waited_s=$("$waited".Trim()) marker=[$marker] state=$env:ANTF_DISK_CLEANUP"
          if (-not (Test-Path -LiteralPath $done)) { throw 'the background cleanup left no done marker' }

  windows:
    name: windows ${{ matrix.variant }}
    if: ${{ inputs.windows }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: win-today
            cleanup: ''
          - variant: win-off
            cleanup: 'off'
          - variant: win-afterpull
            cleanup: 'after-pull'
    defaults:
      run:
        shell: pwsh
    steps:
      # The local actions below are what this probe measures, so the tree comes first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      # Every 5 s: free space on C: and D:, and the entries in the daemon's temp under the data-root.
      - name: Start the disk sampler
        run: |
          $sampler = Join-Path $env:RUNNER_TEMP 'probe-sampler.ps1'
          $csv = Join-Path $env:RUNNER_TEMP 'probe-disk.csv'
          Set-Content -LiteralPath $csv -Value 'epoch,c_free_gb,d_free_gb,docker_tmp'
          Set-Content -LiteralPath $sampler -Value @'
          param([string]$Csv)
          while ($true) {
            $c = [math]::Round((Get-PSDrive C).Free / 1GB, 2)
            $d = [math]::Round((Get-PSDrive D).Free / 1GB, 2)
            $dt = @(Get-ChildItem -LiteralPath 'D:\docker\tmp' -Force -ErrorAction SilentlyContinue).Count
            Add-Content -LiteralPath $Csv -Value ("{0},{1},{2},{3}" -f [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(), $c, $d, $dt)
            Start-Sleep -Seconds 5
          }
          '@
          $p = Start-Process -FilePath (Get-Process -Id $PID).Path -PassThru -ArgumentList @('-NoProfile', '-File', "`"$sampler`"", '-Csv', "`"$csv`"")
          Write-Host "sampler pid $($p.Id)"
          "PROBE_T0=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

      - name: prepare-windows-container-host (${{ matrix.variant }})
        id: prep
        uses: ./.github/actions/prepare-windows-container-host
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          cleanup: ${{ matrix.cleanup }}

      - name: The prologue is done
        run: |
          "PROBE_T1=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          docker info 2>&1 | Where-Object { $_ -match 'Root Dir|Storage Driver|Server Version|Isolation' } | ForEach-Object { Write-Host $_.Trim() }
          docker system df

      # A file, not command: a multi-line command reached the container's pwsh as its first line only (job 115392832215).
      - name: Write the container workload
        run: |
          Set-Content -LiteralPath 'D:\ws\probe-workload.ps1' -Value @'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $buf = [byte[]]::new(64MB)
          [Random]::new(7).NextBytes($buf)
          foreach ($dir in 'C:\ws\probe-out', 'C:\probe-scratch') {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            foreach ($i in 1..48) { [IO.File]::WriteAllBytes((Join-Path $dir "f$i.bin"), $buf) }
          }
          foreach ($round in 1..2) { $null = Get-ChildItem 'C:\ws\probe-out', 'C:\probe-scratch' -File | Get-FileHash -Algorithm SHA256 }
          $s = [int]$sw.Elapsed.TotalSeconds
          Set-Content -LiteralPath 'C:\ws\probe-workload.txt' -Value $s
          Write-Host "WORKLOAD seconds=$s"
          '@

      # Fixed work, so its duration shows what a cleanup running beside it costs a build.
      - name: Container workload (writes to the bind mount and the scratch layer, then hashes)
        uses: ./.github/actions/run-in-windows-container
        with:
          file: C:\ws\probe-workload.ps1
          memory: 8g

      - name: Host-side copy onto C
        id: hostcopy
        run: |
          "PROBE_T2=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          $sw = [Diagnostics.Stopwatch]::StartNew()
          New-Item -ItemType Directory -Force -Path 'C:\probe-host' | Out-Null
          Copy-Item -Path 'D:\ws\probe-out\*' -Destination 'C:\probe-host' -Force
          $s = [int]$sw.Elapsed.TotalSeconds
          Write-Host "host copy of $([math]::Round((Get-ChildItem C:\probe-host -File | Measure-Object Length -Sum).Sum / 1GB, 1)) GB to C: took $s s"
          "seconds=$s" >> $env:GITHUB_OUTPUT

      - name: TIMING
        if: ${{ always() }}
        env:
          VARIANT: ${{ matrix.variant }}
          CLEANUP_MODE: ${{ steps.prep.outputs.cleanup }}
          PULL_SECONDS: ${{ steps.prep.outputs.pull-seconds }}
          HOST_COPY_SECONDS: ${{ steps.hostcopy.outputs.seconds }}
        run: |
          $rows = @(Import-Csv -LiteralPath (Join-Path $env:RUNNER_TEMP 'probe-disk.csv'))
          function Read-Marker([string]$name) {
            $f = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $f) { (Get-Content -LiteralPath $f -Raw).Trim() } else { '' }
          }
          $done = Read-Marker 'disk-cleanup.done'
          $cleanupS = if ($done -match 'seconds=(\d+)') { $Matches[1] } else { '0' }
          $waited = Read-Marker 'disk-cleanup.waited'
          $workload = if (Test-Path 'D:\ws\probe-workload.txt') { (Get-Content 'D:\ws\probe-workload.txt' -Raw).Trim() } else { '' }
          $prologue = [int]$env:PROBE_T1 - [int]$env:PROBE_T0
          $runStep = if ($env:PROBE_T2) { [int]$env:PROBE_T2 - [int]$env:PROBE_T1 } else { '' }
          $line = ('TIMING variant={0} cleanup={1} prologue_s={2} cleanup_s={3} pull_s={4} run_step_s={5} workload_s={6} cleanup_waited_s={7} host_copy_s={8} min_c_free_gb={9} min_d_free_gb={10} docker_tmp_max={11} samples={12}' -f
            $env:VARIANT, $env:CLEANUP_MODE, $prologue, $cleanupS,
            $env:PULL_SECONDS, $runStep, $workload, $waited, $env:HOST_COPY_SECONDS,
            ($rows | ForEach-Object { [double]$_.c_free_gb } | Measure-Object -Minimum).Minimum,
            ($rows | ForEach-Object { [double]$_.d_free_gb } | Measure-Object -Minimum).Minimum,
            ($rows | ForEach-Object { [int]$_.docker_tmp } | Measure-Object -Maximum).Maximum,
            $rows.Count)
          Write-Host $line
          $line >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the disk samples
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-disk-${{ matrix.variant }}
          path: ${{ runner.temp }}/probe-disk.csv
          if-no-files-found: error

  linux:
    name: linux ${{ matrix.variant }}
    if: ${{ inputs.linux }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linux-today
            runner: ubuntu-26.04
            pull-first: 'false'
            free-disk-space: 'true'
          - variant: linux-pullfirst
            runner: ubuntu-26.04
            pull-first: 'true'
            free-disk-space: 'true'
          - variant: linux-pullfirst-fast
            runner: ubuntu-26.04
            pull-first: 'true'
            free-disk-space: 'fast'
          - variant: linux-today-arm64
            runner: ubuntu-26.04-arm
            pull-first: 'false'
            free-disk-space: 'true'
          - variant: linux-pullfirst-arm64
            runner: ubuntu-26.04-arm
            pull-first: 'true'
            free-disk-space: 'true'
          - variant: linux-pullfirst-fast-arm64
            runner: ubuntu-26.04-arm
            pull-first: 'true'
            free-disk-space: 'fast'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      # Every 5 s: bytes used and available on the root filesystem, which holds the image store.
      - name: Start the disk sampler
        shell: bash
        run: |
          csv="${RUNNER_TEMP}/probe-disk.csv"
          echo 'epoch,used_b,avail_b' > "${csv}"
          sample() {
            while true; do
              echo "$(date +%s),$(df -B1 --output=used,avail / | tail -1 | awk '{print $1","$2}')" >> "${csv}"
              sleep 5
            done
          }
          sample > /dev/null 2>&1 < /dev/null &
          echo "PROBE_T0=$(date +%s)" >> "${GITHUB_ENV}"
          df -h /

      - name: prepare-linux-ci-host (${{ matrix.variant }})
        id: prep
        uses: ./.github/actions/prepare-linux-ci-host
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: 'false'
          pull-first: ${{ matrix.pull-first }}
          free-disk-space: ${{ matrix.free-disk-space }}

      - name: The prologue is done
        shell: bash
        run: |
          echo "PROBE_T1=$(date +%s)" >> "${GITHUB_ENV}"
          docker info 2>/dev/null | grep -E 'Server Version|Storage Driver|driver-type|Docker Root Dir|containerd' || true
          docker system df
          df -h /

      - name: TIMING
        if: ${{ always() }}
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          PULL_SECONDS: ${{ steps.prep.outputs.pull-seconds }}
          CLEANUP_SECONDS: ${{ steps.prep.outputs.cleanup-seconds }}
        run: |
          csv="${RUNNER_TEMP}/probe-disk.csv"
          stats="$(awk -F, 'NR > 1 { if ($2 > mu) mu = $2; if (ma == "" || $3 < ma) ma = $3; n++ } END { printf "%.1f %.1f %d", mu / 1e9, ma / 1e9, n }' "${csv}")"
          read -r max_used min_avail samples <<< "${stats}"
          avail_end="$(df -B1 --output=avail / | tail -1 | awk '{printf "%.1f", $1 / 1e9}')"
          line="TIMING variant=${VARIANT} prologue_s=$(( ${PROBE_T1:-0} - PROBE_T0 )) cleanup_s=${CLEANUP_SECONDS} pull_s=${PULL_SECONDS} max_used_gb=${max_used} min_avail_gb=${min_avail} avail_end_gb=${avail_end} samples=${samples}"
          echo "${line}"
          echo "${line}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the disk samples
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-disk-${{ matrix.variant }}
          path: ${{ runner.temp }}/probe-disk.csv
          if-no-files-found: error
