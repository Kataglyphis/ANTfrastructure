# Named by the fleet convention: docs/adopting-in-a-new-project.md#workflow-file-names-and-display-names
name: Linux x64 · preflight + mutation gate

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# One run per ref; build-docs keeps its own non-cancelling deploy group.
concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # No-build gate for failure classes that otherwise surface hours into a build; the local pre-commit twin is opt-in.
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uvx runs lint-python.sh's pinned ruff (RUFF_PIN); this runner has neither ruff nor uv.
      - name: Install uv (provides uvx for the python-lint gate)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The runner image ships no pytest, and without it every mutation baseline fails unmutated.
      - name: Install pytest (mutation-gate baselines)
        run: pip install --quiet pytest
      # Unpinned runner convenience, owned by no image: docs/dependency-updates.md#what-this-costs
      - name: Install PyYAML (renovate_audit.py's real YAML parser)
        run: pip install --quiet pyyaml
      # Every slug but the mutation gate, which the mutations job runs in shards.
      - name: Run preflight checks
        run: PREFLIGHT_SKIP=mutations bash linux/scripts/preflight.sh

  # The mutations slug (docs/scripts/verify_mutations.py) in four shards. See docs/code-quality-tooling.md#the-mutation-gate-in-ci-sharded
  mutations:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same setup as preflight: without pytest and PyYAML the baselines fail unmutated.
      - name: Install uv (provides uvx for the python-lint gate)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pytest (mutation-gate baselines)
        run: pip install --quiet pytest
      - name: Install PyYAML (renovate_audit.py's real YAML parser)
        run: pip install --quiet pyyaml
      - name: Mutation gate, shard ${{ matrix.shard }} of 4
        run: PREFLIGHT_ONLY=mutations PREFLIGHT_MUTATION_SHARD="${{ matrix.shard }}/4" bash linux/scripts/preflight.sh

  build-docs:
    uses: ./.github/workflows/build-docs.yml
    with:
      runner: ubuntu-26.04
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}

