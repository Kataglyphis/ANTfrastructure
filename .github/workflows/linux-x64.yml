# Named by the fleet convention: docs/adopting-in-a-new-project.md#workflow-file-names-and-display-names
name: Linux x64 · preflight + mutation gate

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One run per ref; the docs site is docs.yml's, which has no cancelling group.
concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # No-build gate for failure classes that otherwise surface hours into a build; the local pre-commit twin is opt-in.
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Python lint and type gates resolve their pinned Ruff and ty through uvx.
      - name: Install uv (provides uvx for the python-lint gate)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.0
      # The runner image ships no pytest, and without it every mutation baseline fails unmutated.
      - name: Install pytest (mutation-gate baselines)
        run: pip install --quiet pytest
      # Unpinned runner convenience, owned by no image: docs/dependency-updates.md#what-this-costs
      - name: Install PyYAML (renovate_audit.py's real YAML parser)
        run: pip install --quiet pyyaml
      # Every slug but the mutation gate, which the mutations job runs in shards.
      - name: Run preflight checks
        run: PREFLIGHT_SKIP=mutations bash linux/scripts/preflight.sh
      - name: Upload Python type and annotation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-type-reports
          path: |
            logs/code-quality/ty-*.txt
            logs/code-quality/ruff-annotations.txt
            logs/code-quality/ruff-annotations-gate.txt
            logs/code-quality/ruff-private-returns-gate.txt
            logs/code-quality/ruff-parameters-returns-gate.txt
          if-no-files-found: error

  # The mutations slug (docs/scripts/verify_mutations.py) in eight shards. See docs/code-quality-tooling.md#the-mutation-gate-in-ci-sharded
  mutations:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same setup as preflight: without pytest and PyYAML the baselines fail unmutated.
      - name: Install uv (provides uvx for the python-lint gate)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.0
      - name: Install pytest (mutation-gate baselines)
        run: pip install --quiet pytest
      - name: Install PyYAML (renovate_audit.py's real YAML parser)
        run: pip install --quiet pyyaml
      - name: Mutation gate, shard ${{ matrix.shard }} of 8
        run: PREFLIGHT_ONLY=mutations PREFLIGHT_MUTATION_SHARD="${{ matrix.shard }}/8" bash linux/scripts/preflight.sh
