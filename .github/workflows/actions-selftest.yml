# What a green run does and does not prove: see .github/actions/README.md § Testing these actions

name: Composite actions · self-test

# Least privilege. The one job that needs more says so itself.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deep:
        description: >-
          Also run the Windows CONTAINER lane (prepare-windows-container-host +
          run-in-windows-container). It pulls the ~54 GB winamd64 image, so it
          costs roughly an hour and is off by default.
        type: boolean
        default: false
      ftp-dry-run:
        description: >-
          Also run deploy-over-ftp in the library's dry-run mode against the
          docs server (connects and diffs a one-directory tree, uploads
          nothing). Off by default; the contract is checked statically either way.
        type: boolean
        default: false
  push:
    branches: [main, develop]
    paths:
      - '.github/actions/**'
      - '.github/workflows/actions-selftest.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/actions/**'
      - '.github/workflows/actions-selftest.yml'
  # Weekly, because these actions rot where they call the outside world; the deep lane still needs a dispatch.
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC, after consumer-inventory at 07:00

concurrency:
  group: actions-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # install-deps
  linux-toolchain:
    name: install-deps
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      # An impossible vulkan-version proves the input, not the default, reached PATH; run-setup-script hits the script-absent branch.
      - name: install-deps (uv, no Rust)
        uses: ./.github/actions/install-deps
        with:
          vulkan-version: '9.9.999.0'
          require-rust: 'false'
          run-setup-script: 'true'
          install-uv: 'true'

      - name: The inputs above reached PATH and the Rust block was skipped
        run: |
          set -euo pipefail
          want='/opt/vulkan/9.9.999.0/x86_64/bin'
          case ":${PATH}:" in
            *":${want}:"*) echo "vulkan bin dir on PATH: ${want}" ;;
            *) echo "::error::install-deps did not put ${want} on PATH; the vulkan-version input is not reaching GITHUB_PATH"; exit 1 ;;
          esac
          # install-uv must leave uv on PATH for later steps.
          uv --version
          # A skipped Rust block is observable only as a missing Rust_COMPILER.
          if [ -n "${Rust_COMPILER:-}" ]; then
            echo "::error::require-rust=false still exported Rust_COMPILER=${Rust_COMPILER}; the skip branch is not skipping"
            exit 1
          fi

      - name: install-deps (Rust required)
        uses: ./.github/actions/install-deps
        with:
          require-rust: 'true'

      - name: The Rust branch exported a real compiler
        run: |
          set -euo pipefail
          if [ -z "${Rust_COMPILER:-}" ]; then
            echo "::error::require-rust=true did not export Rust_COMPILER"
            exit 1
          fi
          if [ ! -x "${Rust_COMPILER}" ]; then
            echo "::error::Rust_COMPILER=${Rust_COMPILER} is not an executable"
            exit 1
          fi
          "${Rust_COMPILER}" --version

  # clone-into-short-path (Linux half: the submodule-exclusion logic)
  linux-clone:
    name: clone-into-short-path (exclusion logic)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # A local action needs a checkout before it can run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Full clone first: exclusions go into the runner-wide global git config and would prune it too.
      - name: clone-into-short-path (full tree)
        id: full
        uses: ./.github/actions/clone-into-short-path
        with:
          target: ${{ runner.temp }}/clone-full
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          submodules: 'true'

      - name: The full clone carries the submodule tree
        run: |
          set -euo pipefail
          root='${{ runner.temp }}/clone-full'
          test -d "${root}/.git" || { echo "::error::no clone at ${root}"; exit 1; }
          test -f "${root}/.github/actions/README.md" || { echo "::error::${root} is not this repository"; exit 1; }
          # The ref input must have been honoured, not just "some commit".
          got="$(git -C "${root}" rev-parse HEAD)"
          if [ "${got}" != "${{ github.sha }}" ]; then
            echo "::error::clone is at ${got}, the ref input asked for ${{ github.sha }}"
            exit 1
          fi
          if [ -z "$(ls -A "${root}/third_party/DocumANTation")" ]; then
            echo "::error::submodules: 'true' left third_party/DocumANTation empty"
            exit 1
          fi

      # On a pull_request github.sha is the merge commit, which only refs/pull/<n>/merge carries: the fetch path must fire.
      - name: The fetch path fired exactly when the event needs it
        env:
          EVENT: ${{ github.event_name }}
          FETCHED: ${{ steps.full.outputs.fetched }}
        run: |
          set -euo pipefail
          want=false
          [ "${EVENT}" != pull_request ] || want=true
          if [ "${FETCHED}" != "${want}" ]; then
            echo "::error::clone-into-short-path reported fetched='${FETCHED}' on a ${EVENT} event (expected '${want}')"
            exit 1
          fi
          echo "event=${EVENT} fetched=${FETCHED}"

      # The merge ref by NAME, as a consumer passing refs/pull/<n>/merge would: it lands only in FETCH_HEAD.
      - name: clone-into-short-path (refs/pull/<n>/merge by name)
        id: mergeref
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/clone-into-short-path
        with:
          target: ${{ runner.temp }}/clone-mergeref
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          token: ${{ github.token }}
          submodules: 'false'

      - name: The named merge ref is the PR head merged onto its base
        if: github.event_name == 'pull_request'
        env:
          FETCHED: ${{ steps.mergeref.outputs.fetched }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          root='${{ runner.temp }}/clone-mergeref'
          [ "${FETCHED}" = true ] || { echo "::error::refs/pull/<n>/merge was not fetched (fetched='${FETCHED}')"; exit 1; }
          # The ref can move with its base after the event, so grade its shape, not github.sha.
          parents="$(git -C "${root}" rev-list --parents -n 1 HEAD)"
          read -r merge p1 p2 extra <<< "${parents}"
          if [ -z "${p2:-}" ] || [ -n "${extra:-}" ]; then
            echo "::error::HEAD ${merge} is not a two-parent merge commit: ${parents}"
            exit 1
          fi
          if [ "${p2}" != "${HEAD_SHA}" ]; then
            echo "::error::merge ${merge}'s second parent is ${p2}, the PR head is ${HEAD_SHA}"
            exit 1
          fi
          echo "merge ref checked out at ${merge} (base ${p1}, PR head ${p2})"

      - name: clone-into-short-path (submodule excluded)
        uses: ./.github/actions/clone-into-short-path
        with:
          target: ${{ runner.temp }}/clone-pruned
          token: ${{ github.token }}
          submodules: 'true'
          exclude-submodules: |
            third_party/DocumANTation

      - name: The excluded submodule stayed empty
        run: |
          set -euo pipefail
          root='${{ runner.temp }}/clone-pruned'
          test -d "${root}/.git" || { echo "::error::no clone at ${root}"; exit 1; }
          # repository/ref were omitted, so the defaults must resolve to this repo.
          test -f "${root}/.github/actions/README.md" || { echo "::error::the repository default did not resolve to this repo"; exit 1; }
          if [ -n "$(ls -A "${root}/third_party/DocumANTation")" ]; then
            echo "::error::exclude-submodules did not prune third_party/DocumANTation; it was populated anyway"
            exit 1
          fi

  # prepare-linux-ci-host + run-in-linux-container
  linux-container:
    name: prepare-linux-ci-host + run-in-linux-container
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      # compiler-cache-save and compiler-cache-prune list and delete cache entries.
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      # Loads the local action; its own checkout input then produces the tree asserted on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # image omitted per the README; an empty secret, as on a fork PR, must skip the login and still pull.
      - name: prepare-linux-ci-host
        uses: ./.github/actions/prepare-linux-ci-host
        with:
          registry: ghcr.io
          registry-username: Kataglyphis
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: 'recursive'
          checkout: 'true'
          free-disk-space: 'true'
          pull-attempts: '3'
          pull-timeout-seconds: '900'

      - name: The prologue checked out and the image is local
        run: |
          set -euo pipefail
          test -f .github/actions/README.md || { echo "::error::checkout: 'true' produced no repository"; exit 1; }
          # A missing submodule would surface in a consumer much later, as a missing header.
          if [ -z "$(ls -A third_party/DocumANTation)" ]; then
            echo "::error::submodules: 'recursive' left third_party/DocumANTation empty"
            exit 1
          fi
          docker image inspect ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest >/dev/null

      # ACTION_DIRS is compared with the host checkout's count, never a literal: that proves the mount carries the whole tree.
      - name: run-in-linux-container
        uses: ./.github/actions/run-in-linux-container
        with:
          workdir: /selftest-workspace
          log-file: selftest-container.log
          extra-args: -e SELFTEST_MARKER=ok
          script: >-
            bash -lc 'echo "MARKER=${SELFTEST_MARKER:-unset}"; echo "CWD=$(pwd)";
            echo "ACTION_DIRS=$(ls -1d .github/actions/*/ | wc -l)"'

      - name: The container saw the env, the mount and the workdir
        run: |
          set -euo pipefail
          log='selftest-container.log'
          test -f "${log}" || { echo "::error::log-file produced no ${log}; the tee branch is broken"; exit 1; }
          cat "${log}"
          grep -qx 'MARKER=ok' "${log}" || { echo "::error::extra-args did not deliver SELFTEST_MARKER into the container"; exit 1; }
          grep -qx 'CWD=/selftest-workspace' "${log}" || { echo "::error::the workdir input did not become the container working directory"; exit 1; }
          expected="$(find .github/actions -mindepth 1 -maxdepth 1 -type d | wc -l)"
          seen="$(sed -n 's/^ACTION_DIRS=//p' "${log}")"
          [ "${seen}" = "${expected}" ] || { echo "::error::the container saw ${seen:-no} action directories under the mounted workspace, and this checkout holds ${expected}"; exit 1; }

      # The container writes through the restored mount as its own uid, as a real lane's sccache does; save is forced on.
      - name: compiler-cache-restore
        id: cc
        uses: ./.github/actions/compiler-cache-restore
        with:
          key: selftest
          mounts: 'probe:/var/cache/selftest-probe'
          env: 'SELFTEST_CACHE=ok'

      - name: run-in-linux-container writes through the cache mount
        uses: ./.github/actions/run-in-linux-container
        with:
          extra-args: ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash -lc 'echo "${SELFTEST_CACHE:-unset}" > /var/cache/selftest-probe/marker'

      - name: The mount and the env reached the container
        env:
          CACHE_PATH: ${{ steps.cc.outputs.path }}
          RESTORED_KEY: ${{ steps.cc.outputs.restored-key }}
        run: |
          set -euo pipefail
          echo "restored from: ${RESTORED_KEY:-nothing (first run)}"
          marker="${CACHE_PATH}/probe/marker"
          test -f "${marker}" || { echo "::error::the container's write did not land in ${marker}; the mount is not the cache directory"; exit 1; }
          [ "$(cat "${marker}")" = ok ] || { echo "::error::the env input did not reach the container (marker: $(cat "${marker}"))"; exit 1; }

      - name: compiler-cache-save
        id: ccsave
        uses: ./.github/actions/compiler-cache-save
        with:
          key: selftest
          enabled: 'true'
          path: ${{ steps.cc.outputs.path }}
          token: ${{ github.token }}

      # Save prunes older entries first, so only this run's entry may remain and the prune below finds nothing.
      - name: The save step saved and left one entry
        env:
          SAVED: ${{ steps.ccsave.outputs.saved }}
          PRUNED: ${{ steps.ccsave.outputs.pruned }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "${SAVED}" = true ] || { echo "::error::compiler-cache-save with enabled 'true' reported saved=${SAVED}"; exit 1; }
          [[ "${PRUNED}" =~ ^[0-9]+$ ]] || { echo "::error::compiler-cache-save reported pruned='${PRUNED}', not a count"; exit 1; }
          echo "save deleted ${PRUNED} older entr(ies)"
          keys="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/caches" -f key=compiler-cache-selftest- -f ref="${GITHUB_REF}"             --paginate --jq '.actions_caches[].key')"
          echo "${keys}"
          stale="$(grep -v -- "-${GITHUB_RUN_ID}-" <<< "${keys}" | grep -c . || true)"
          [ "${stale}" = 0 ] || { echo "::error::${stale} selftest entr(ies) of older runs survived the save"; exit 1; }

      - name: compiler-cache-prune
        id: ccprune
        uses: ./.github/actions/compiler-cache-prune
        with:
          key: selftest
          token: ${{ github.token }}
          require-saved: 'true'

      - name: The prune step found nothing older
        env:
          PRUNED: ${{ steps.ccprune.outputs.pruned }}
        run: |
          [ "${PRUNED}" = 0 ] || { echo "::error::compiler-cache-prune deleted ${PRUNED} entr(ies) the save should already have deleted"; exit 1; }

  # run-pester-suite + clone-into-short-path (Windows) + upload-codeql-sarif
  windows-scripts:
    name: run-pester-suite + upload-codeql-sarif
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      # Only the workflow_dispatch-gated SARIF upload below needs this.
      security-events: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      # A trivially passing suite, so a failure can only mean the action broke.
      - name: Write a throwaway Pester 3.4 suite
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest-pester'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @'
          Describe 'ANTfrastructure composite actions self-test' {
              It 'runs a real assertion' {
                  (1 + 1) | Should Be 2
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $dir 'Selftest.Tests.ps1') -Encoding utf8

      - name: run-pester-suite
        uses: ./.github/actions/run-pester-suite
        with:
          path: ${{ runner.temp }}/selftest-pester/Selftest.Tests.ps1
          version: '3.4.0'

      # D:\ws is outside GITHUB_WORKSPACE, which is where the SARIF probe below must still look.
      - name: clone-into-short-path
        id: shortclone
        uses: ./.github/actions/clone-into-short-path
        with:
          target: /d/ws
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          submodules: 'true'
          exclude-submodules: ''

      - name: 'The short-path clone is a complete tree on D:'
        run: |
          if (-not (Test-Path 'D:\ws\.git')) { throw 'clone-into-short-path produced no clone at D:\ws' }
          $sha = (git -C 'D:\ws' rev-parse HEAD).Trim()
          if ($sha -ne '${{ github.sha }}') { throw "D:\ws is at $sha, the ref input asked for ${{ github.sha }}" }
          # A pull_request's merge commit is not in a plain clone: the fetch path must have fired (OmniAccelerANT #45).
          $want = if ('${{ github.event_name }}' -eq 'pull_request') { 'true' } else { 'false' }
          if ('${{ steps.shortclone.outputs.fetched }}' -ne $want) {
              throw "clone-into-short-path reported fetched='${{ steps.shortclone.outputs.fetched }}' on ${{ github.event_name }} (expected '$want')"
          }
          if (-not (Get-ChildItem 'D:\ws\third_party\DocumANTation' -Force)) {
              throw "submodules: 'true' left third_party\DocumANTation empty in the short-path clone"
          }

      # Negative branch: must report found=false; a BOM in GITHUB_OUTPUT would leave it empty.
      - name: upload-codeql-sarif (nothing to upload)
        id: sarif_absent
        uses: ./.github/actions/upload-codeql-sarif
        with:
          workspace: ${{ github.workspace }}
          results-dir: selftest-no-such-directory
          category: antfrastructure-actions-selftest-absent

      - name: The probe reported no SARIF
        run: |
          $found = '${{ steps.sarif_absent.outputs.found }}'
          if ($found -ne 'false') {
              throw "upload-codeql-sarif reported found='$found' for a directory with no .sarif (expected 'false'; an EMPTY value means the GITHUB_OUTPUT write is broken)"
          }

      # Positive branch, results outside GITHUB_WORKSPACE where hashFiles() sees nothing; dispatch-only since it really uploads.
      - name: Plant a zero-result SARIF outside the workspace
        if: github.event_name == 'workflow_dispatch'
        run: |
          $dir = 'D:\ws\codeql-results'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $sarif = [ordered]@{
              version = '2.1.0'
              '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
              runs = @(
                  @{
                      tool = @{ driver = @{ name = 'antfrastructure-actions-selftest'; informationUri = 'https://github.com/Kataglyphis/ANTfrastructure'; rules = @() } }
                      results = @()
                  }
              )
          }
          $sarif | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $dir 'selftest.sarif') -Encoding utf8NoBOM

      - name: upload-codeql-sarif (results outside GITHUB_WORKSPACE)
        id: sarif_present
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/upload-codeql-sarif
        with:
          workspace: 'D:\ws'
          results-dir: codeql-results
          category: antfrastructure-actions-selftest

      - name: The probe found the SARIF hashFiles() cannot see
        if: github.event_name == 'workflow_dispatch'
        run: |
          $found = '${{ steps.sarif_present.outputs.found }}'
          if ($found -ne 'true') {
              throw "upload-codeql-sarif reported found='$found' for D:\ws\codeql-results, which contains a .sarif - the probe is blind outside GITHUB_WORKSPACE again"
          }

  # set-docker-data-root + assert-docker-disk-space + cleanup-disk-space
  windows-docker-host:
    name: Windows docker host actions
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      # A local action needs a checkout before it can run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cleanup-disk-space runs last here, unlike in a consumer: it removes so much that later failures would be ambiguous.
      - name: set-docker-data-root
        id: datar
        uses: ./.github/actions/set-docker-data-root
        with:
          data-root: 'D:\docker'
          service-name: docker
          # Below the real default of 70, so a runner resize cannot fail the self-test.
          required-free-gb: '20'
          ready-timeout-seconds: '180'

      - name: The daemon reports the data-root it was moved to
        run: |
          $root = '${{ steps.datar.outputs.data-root }}'
          $free = '${{ steps.datar.outputs.free-gb }}'
          if ($root -ne 'D:\docker') { throw "set-docker-data-root output data-root='$root', expected 'D:\docker'" }
          if ($free -notmatch '^[0-9]+(\.[0-9]+)?$') { throw "set-docker-data-root output free-gb='$free' is not a number" }
          if ([double]$free -le 0) { throw "set-docker-data-root output free-gb='$free' claims no free space on the target drive" }
          # The output is the action's claim; this is the daemon's.
          $live = (docker info --format '{{.DockerRootDir}}').Trim()
          if ($live -notlike 'D:\docker*') { throw "the daemon reports data-root '$live'; the move did not take effect" }

      # 1 GB always passes (the shortfall exit would need continue-on-error); this exercises the probe, which has broken before.
      - name: assert-docker-disk-space
        id: assertdisk
        uses: ./.github/actions/assert-docker-disk-space
        with:
          required-free-gb: '1'
          fallback-data-root: 'D:\docker'
          probe-attempts: '6'
          probe-interval-seconds: '5'

      - name: The probe resolved a data-root and a free-space figure
        run: |
          $root = '${{ steps.assertdisk.outputs.data-root }}'
          $free = '${{ steps.assertdisk.outputs.free-gb }}'
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'assert-docker-disk-space resolved an EMPTY data-root; the probe fell through every branch' }
          if ($root -notlike 'D:\docker*') { throw "assert-docker-disk-space resolved '$root' but set-docker-data-root moved the daemon to D:\docker" }
          if ($free -notmatch '^[0-9]+(\.[0-9]+)?$') { throw "assert-docker-disk-space output free-gb='$free' is not a number" }

      - name: 'Free space on C: before cleanup'
        id: before
        run: |
          $free = [math]::Round((Get-Volume -DriveLetter C).SizeRemaining / 1GB, 2)
          Write-Host "C: free before cleanup: $free GB"
          "free-gb=$free" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: cleanup-disk-space
        uses: ./.github/actions/cleanup-disk-space

      # The action always exits 0, so only reclaimed space proves it still removes anything.
      - name: cleanup-disk-space actually reclaimed space
        run: |
          $before = [double]'${{ steps.before.outputs.free-gb }}'
          $after = [math]::Round((Get-Volume -DriveLetter C).SizeRemaining / 1GB, 2)
          Write-Host "C: free after cleanup: $after GB (before: $before GB)"
          if (($after - $before) -lt 1.0) {
              throw "cleanup-disk-space freed $([math]::Round($after - $before, 2)) GB on C: (before $before, after $after). It deletes Visual Studio and the whole hostedtoolcache, so anything under 1 GB means the removals are no longer removing anything."
          }

  # prepare-windows-container-host + run-in-windows-container
  windows-container:
    name: Windows container lane (deep)
    # The image pull takes most of an hour, so dispatch-only; the steps are still linted on every trigger.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep }}
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: prepare-windows-container-host
        id: prep
        uses: ./.github/actions/prepare-windows-container-host
        with:
          # Both images come from the action's defaults; none is named here.
          target-arch: amd64
          registry: ghcr.io
          registry-username: Kataglyphis
          registry-password: ${{ secrets.GHCR_PAT }}
          checkout: 'true'
          fetch-depth: '1'
          submodules: 'true'
          short-path-target: /d/ws
          exclude-submodules: ''
          token: ${{ github.token }}
          data-root: 'D:\docker'
          required-free-gb: '70'
          free-disk-space: 'true'
          # Otherwise dead code, and this is the one lane that can afford its minute.
          measure-data-root: 'true'

      - name: The prologue reports the tree and the drive it used
        id: tree
        run: |
          # Counted on the host and compared inside the container, never a literal.
          "action-dirs=$(@(Get-ChildItem 'D:\ws\.github\actions' -Directory).Count)" >> $env:GITHUB_OUTPUT
          $root = '${{ steps.prep.outputs.data-root }}'
          $ws = '${{ steps.prep.outputs.workspace }}'
          if ($root -ne 'D:\docker') { throw "prepare-windows-container-host output data-root='$root', expected 'D:\docker'" }
          if ($ws -ne 'D:\ws') { throw "prepare-windows-container-host output workspace='$ws'; with short-path-target it must be the short clone, not GITHUB_WORKSPACE" }
          if (-not (Test-Path 'D:\ws\.github\actions\README.md')) { throw 'the short-path clone at D:\ws is not this repository' }
          $image = '${{ steps.prep.outputs.image }}'
          if (-not $image) { throw 'prepare-windows-container-host output image is empty' }
          docker image inspect $image --format '{{.Os}}' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "output image '$image' is not the image that was pulled" }

      # Unlike the Linux sibling, extra-args here is one literal argv element per line.
      - name: run-in-windows-container (-Command)
        uses: ./.github/actions/run-in-windows-container
        with:
          target-arch: amd64
          command: |
            if ($env:SELFTEST_MARKER -ne 'ok') { throw "extra-args did not deliver SELFTEST_MARKER (got '$env:SELFTEST_MARKER')" }
            if ((Get-Location).Path -ne 'C:\ws') { throw "mount-target did not become the working directory (got '$((Get-Location).Path)')" }
            $n = @(Get-ChildItem 'C:\ws\.github\actions' -Directory).Count
            if ($n -ne [int]$env:SELFTEST_ACTION_DIRS) { throw "the bind mount shows $n action directories, the host checkout holds $env:SELFTEST_ACTION_DIRS" }
            Write-Host "container OK: marker, workdir and mount all check out"
          extra-args: |
            -e
            SELFTEST_MARKER=ok
            -e
            SELFTEST_ACTION_DIRS=${{ steps.tree.outputs.action-dirs }}
          cpus: '2'
          memory: 8g
          mount-source: 'D:\ws'
          mount-target: 'C:\ws'
          isolation: process

      # -File must keep argv literal, so the payload is what -Command would mangle: space, quote, $, backtick, empty element.
      - name: Plant the argv probe in the mounted tree
        run: |
          @'
          param()
          $expected = @("a b", '', "it's", '$notavar', 'back`tick')
          if ($args.Count -ne $expected.Count) {
              throw "argv count $($args.Count), expected $($expected.Count): [$($args -join '|')]"
          }
          for ($i = 0; $i -lt $expected.Count; $i++) {
              if ($args[$i] -cne $expected[$i]) {
                  throw "argv[$i] is '$($args[$i])', expected '$($expected[$i])'"
              }
          }
          Write-Host 'argv OK: every element arrived literally'
          '@ | Set-Content -LiteralPath 'D:\ws\selftest-argv.ps1' -Encoding utf8NoBOM

      - name: run-in-windows-container (-File with literal argv)
        uses: ./.github/actions/run-in-windows-container
        with:
          file: 'C:\ws\selftest-argv.ps1'
          file-args: |
            a b

            it's
            $notavar
            back`tick
          mount-source: 'D:\ws'
          mount-target: 'C:\ws'

  # deploy-over-ftp: every input named so actionlint checks the contract on every run; a dry run only on dispatch.
  linux-ftp-contract:
    name: deploy-over-ftp (contract; dry run on dispatch)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      - name: deploy-over-ftp (dry run; inputs checked statically on every run)
        if: ${{ inputs.ftp-dry-run }}
        uses: ./.github/actions/deploy-over-ftp
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: ./.github/actions/deploy-over-ftp/
          server-dir: /selftest/
          protocol: ftp
          port: '21'
          dry-run: 'true'
          log-level: minimal
          timeout: '30000'
