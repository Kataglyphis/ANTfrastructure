# Scanner half of the SBOM, reading the published image with no daemon. See docs/sbom.md § Why there are two halves
name: SBOM

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, an hour before the stale-docs check
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Image reference to scan. Leave EMPTY for the family image - the scan
          driver then composes it from IMAGE_REGISTRY_PREFIX +
          CI_IMAGE_LINUX_TAG in linux/scripts/01-core/versions.env, the single
          place that tag is written. A default spelled out here would be a
          second copy of it, and copies drift.
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: syft ${{ matrix.platform }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A scan without --platform silently picks one arch of the manifest list.
        platform: [linux/amd64, linux/arm64, linux/riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Log in to ghcr
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # syft caches streamed layers under TMPDIR, and the runner's /tmp is too small for them.
      - name: Give the scanner cache the large volume
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo mkdir -p /mnt/syft-tmp
          sudo chown "$(id -u):$(id -g)" /mnt/syft-tmp
          echo "TMPDIR=/mnt/syft-tmp" >> "${GITHUB_ENV}"

      # The same driver docs/sbom.md runs on a workstation; an empty image means the versions.env family image.
      - name: Scan the published image
        id: scan
        run: bash linux/scripts/scan-image-sbom.sh "${{ matrix.platform }}" "${{ inputs.image }}"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ strategy.job-index }}
          path: out/sbom/
          retention-days: 90
          if-no-files-found: error

  curated:
    name: curated SBOM is current
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The curated document is generated but committed, so it can drift.
      - name: Verify the curated SBOM matches deps.json
        run: python3 docs/scripts/generate_sbom.py --check

      - name: Upload curated SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-curated
          path: docs/deps/sbom-curated.spdx.json
          retention-days: 90
          if-no-files-found: error
