# Scanner half of the SBOM. See docs/scripts/generate_sbom.py for the other
# half and why there are two.
#
# syft catalogues components that carry package METADATA -- dpkg/apt, Python
# site-packages, npm, Go and Rust binaries. It cannot see the C/C++ stack this
# project builds from source into /opt (ONNX Runtime, OpenCV, FFmpeg,
# GStreamer, libcamera), because those leave no manifest behind. Those are also
# the components under copyleft licences, so a scan alone would produce an SBOM
# missing every entry that carries a corresponding-source obligation.
#
# Hence: this job covers the thousands of packaged components no human can
# maintain by hand, and docs/deps/sbom-curated.spdx.json covers the source-built
# ones. Publish both.
#
# It scans the PUBLISHED image straight from ghcr, so it needs no build host and
# no daemon -- which is what makes it runnable in CI at all, since the images
# are built on a workstation rather than in this repository's pipelines.
name: SBOM

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, an hour before the stale-docs check
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Image reference to scan. Leave EMPTY for the family image - the scan
          driver then composes it from IMAGE_REGISTRY_PREFIX +
          CI_IMAGE_LINUX_TAG in linux/scripts/01-core/versions.env, the single
          place that tag is written. A default spelled out here would be a
          second copy of it, and copies drift.
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: syft ${{ matrix.platform }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # :latest-cross is a manifest list; a scan without --platform silently
        # picks one arch, so each is scanned explicitly and published separately.
        platform: [linux/amd64, linux/arm64, linux/riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Log in to ghcr
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # One script, and the SAME one docs/sbom.md tells a reader to run on a
      # workstation: the syft bootstrap, the `registry:` scan (no pull into a
      # daemon, no disk for the rootfs, and it works for arches this runner
      # cannot execute), the >=50-package refusal, and docs/scripts/compare_sbom.py
      # over the result. All four were inline here - and the last one was not
      # here at all: this job wrote precisely the file compare_sbom.py exists to
      # read, uploaded it, and never ran the comparison.
      #
      # The image argument is passed through verbatim; EMPTY means "the family
      # image", which the driver composes from versions.env instead of from a
      # literal repeated in this file.
      - name: Scan the published image
        id: scan
        run: bash linux/scripts/scan-image-sbom.sh "${{ matrix.platform }}" "${{ inputs.image }}"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ strategy.job-index }}
          path: out/sbom/
          retention-days: 90
          if-no-files-found: error

  curated:
    name: curated SBOM is current
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The curated document is generated from deps.json + versions.env and is
      # committed, so it can drift. This is the same contract the other
      # generators in docs/scripts/ carry.
      - name: Verify the curated SBOM matches deps.json
        run: python3 docs/scripts/generate_sbom.py --check

      - name: Upload curated SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-curated
          path: docs/deps/sbom-curated.spdx.json
          retention-days: 90
          if-no-files-found: error
