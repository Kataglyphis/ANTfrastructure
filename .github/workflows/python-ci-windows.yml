# Two independent jobs with their own switches, so a repo without a Python package can take the lint alone.
name: Python CI · Windows (reusable)

# Least privilege: this lane never writes to the repository.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Windows container image to build inside. The default is the family
          Windows image; it must equal
          ${IMAGE_REGISTRY_PREFIX}:${CI_IMAGE_WINDOWS_TAG} from
          linux/scripts/01-core/versions.env, and
          linux/scripts/verify_ci_image_refs.py asserts that on every run
          (preflight slug `workflow-lint`). It is spelled out rather than left
          to prepare-windows-container-host's own default because this is an
          OPTIONAL input passed through unconditionally: an omitted input takes
          an action default, an input passed as the empty string does NOT.
        required: false
        type: string
        default: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
      runs-on:
        description: >-
          Runner label for the Windows job. windows-2025 is PINNED on purpose -
          windows-latest is a moving alias (it resolves to windows-2025 today)
          and repointing it would change the OS image under a green build with
          no commit to blame. Every Windows lane in the family is on this label.
        required: false
        type: string
        default: windows-2025
      build-script:
        description: >-
          Path to the build entry point AS SEEN INSIDE THE CONTAINER, i.e. under
          the mount target, not a host path. Empty (the default) runs the repo's
          own scripts\windows\Build-Windows.ps1 when the checkout has one, else
          the hub's windows/scripts/python/Invoke-PythonCiBuild.ps1 with
          -RepoRoot set to the mount target; that driver reads the repo's values
          from scripts\windows\python-ci.psd1 (docs/python-ci.md § The Windows
          build driver).
        required: false
        type: string
        default: ''
      mount-target:
        description: Where the workspace is mounted inside the container.
        required: false
        type: string
        default: C:\workspace
      fetch-depth:
        description: >-
          Checkout depth. 0 = full history (needed if the build derives a version
          from git), 1 = shallow.
        required: false
        type: number
        default: 1
      artifact-name:
        description: Name of the uploaded artifact.
        required: false
        type: string
        default: python-package-windows-source-and-binaries
      artifact-paths:
        description: Newline-separated paths to upload.
        required: false
        type: string
        default: |
          ./dist/
          ./logs/
      build-python-package:
        description: >-
          Run the container build job. DEFAULT TRUE, so every caller that
          predates this input is byte-for-byte unaffected.

          `false` takes the lint job below ALONE. Until 2026-09-15 the build job
          carried no `if:`, so `lint-powershell: true` also bought a winamd64
          image pull, a run of `build-script` as a Python package build, a
          `./dist/` upload and a GHCR_PAT - and OxidANT, which measured the lint
          job as byte-for-byte its own, still had to keep that job: it is a Rust
          crate with no Python package, and its Windows container build is its
          own windows-x64.yml. Trading a two-minute lint for a second container
          build was not the trade the input was offering.
        required: false
        type: boolean
        default: true
      lint-powershell:
        description: >-
          Run ANTfrastructure's PowerShell lint gate (mandatory parse pass, AST
          traps, PSScriptAnalyzer) over this repo's PowerShell tree, as a second
          job on the same Windows runner. Default false, so every existing caller
          is unchanged. Pair it with `build-python-package: false` to run the
          lint and nothing else.

          It is a SEPARATE JOB and not a step of the build above, for two
          reasons: it must run even when the build fails (a syntax error in the
          build scripts is exactly when the lint is worth having), and it needs
          no image pull, so it answers in a couple of minutes instead of waiting
          behind a container build.

          This input exists because two consumers hand-wrote the same job within
          a week - OrchestrANT's .github/workflows/powershell-lint.yml and the
          powershell-lint job in OxidANT's lint-gates.yml. They agreed on
          everything that matters (windows-2025, PSScriptAnalyzer pinned to
          1.25.0, submodules, -FailOnAnalyzer) and differed only in which
          directory they pointed the gate at, which is what lint-path is.
        required: false
        type: boolean
        default: false
      lint-path:
        description: >-
          What the lint gate walks, relative to the repo root: a directory
          (recursive) or a single .ps1/.psm1. The default is the family layout's
          `scripts`, which covers scripts\windows\ and everything under it.
          OrchestrANT's narrower `scripts/windows` is the other spelling in use.

          Passing a path that does not exist THROWS rather than reporting "0
          files parse clean" - a typo here must not read as a green gate over
          nothing.
        required: false
        type: string
        default: scripts
      arm64-tests:
        description: >-
          Also run the pytest suite on windows-11-arm, one leg per
          `arm64-python-versions`. A windows-2025 job stages every leg in
          :winarm64 through the caller's pinned
          windows/scripts/python/New-Arm64PythonTestStage.ps1: the image's
          target interpreters, the project's win_arm64 wheel cross-built with
          the image's VS and clang-cl, and the lock's set beside it. The
          windows-11-arm job then runs the staged legs and installs nothing.
          Default false, so existing callers are unchanged.
        required: false
        type: boolean
        default: false
      arm64-wheels:
        description: >-
          Also upload the legs' win_arm64 wheels as
          `packages-windows-arm64-wheels`, after windows-11-arm loaded each
          alone (GIL off on an X.Yt leg). The stage builds them either way: the
          legs test them. Needs `arm64-tests`. Default false; WebDavClient
          ships them since 2026-10-17.
        required: false
        type: boolean
        default: false
      arm64-python-versions:
        description: >-
          Space-separated Python legs for the arm64 job; a `t` suffix is a
          free-threaded leg. Empty (the default) runs the pinned X.Y of
          versions.env, plus X.Yt when pyproject.toml declares free-threading,
          as the x64 build and python-ci-linux.yml do; the word `pinned` stands
          for that X.Y (`pinnedt` its free-threaded twin), so a Python upgrade
          moves every leg.
        required: false
        type: string
        default: ''
      arm64-extras:
        description: Comma-separated extras each arm64 leg syncs. Empty syncs all extras, as the Linux lane does.
        required: false
        type: string
        default: ''
      free-threaded-extras:
        description: >-
          Extras a free-threaded arm64 leg (`pinnedt`, X.Yt) syncs instead of
          `arm64-extras`, as in python-ci-linux.yml.
        required: false
        type: string
        default: ''
      free-threaded-wheel:
        description: >-
          PYTHON_FREE_THREADED_WHEEL inside the build container, read by
          Invoke-CiPackaging.ps1 - auto, on or off, as in python-ci-linux.yml.
        required: false
        type: string
        default: auto
      test-paths:
        description: Paths the arm64 job hands pytest. Empty runs the project's own testpaths, as in python-ci-linux.yml.
        required: false
        type: string
        default: ''
      arm64-test-files:
        description: >-
          Space-separated paths the arm64 legs run in, staged without the
          package sources so the installed wheel is what the tests import.
          Empty takes tests and the pytest configuration files the root has.
        required: false
        type: string
        default: ''
      arm64-test-env:
        description: Space-separated NAME=value pairs each arm64 leg's pytest gets.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: >-
          Time limit of the container build job. OrchestrANT's ran 39-61 min over
          its last nine finished runs (2026-10-12/13), about half of it the prologue.
        required: false
        type: number
        default: 150
    secrets:
      GHCR_PAT:
        description: >-
          Token used to pull the build image from ghcr. `required: false` since
          2026-09-15: a caller that runs the lint alone
          (`build-python-package: false`) pulls no image, and a required secret
          is refused at call time - it would have made the lint unreachable for
          exactly the callers the gate was added for. The build job asserts it
          in its first step, so a caller that forgets it is told which input it
          wanted.
        required: false

defaults:
  run:
    shell: pwsh

jobs:
  # Gated per job, since either job may run without the other.
  build-test-python-package-on-windows:
    if: ${{ inputs.build-python-package }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # An empty secret would otherwise fail as a docker login error that never names the input.
      - name: Require GHCR_PAT for the container build
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if (-not $env:GHCR_PAT) {
            throw "GHCR_PAT is empty: this job pulls ${{ inputs.image }} from ghcr.io. Pass the secret, or call this lane with build-python-package: false to take the PowerShell lint alone."
          }

      # No short-path clone: the mount and the artifact globs below use github.workspace.
      - name: Prepare Windows container host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          image: ${{ inputs.image }}
          registry-username: Kataglyphis
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: ${{ inputs.fetch-depth }}
          submodules: recursive
          short-path-target: ''

      # Inputs reach the script through env, never interpolated into it.
      - name: Resolve the build script
        id: build-script
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          MOUNT_TARGET: ${{ inputs.mount-target }}
        run: |
          $file = $env:BUILD_SCRIPT
          $repoRoot = ''
          if (-not $file -and (Test-Path -LiteralPath 'scripts/windows/Build-Windows.ps1' -PathType Leaf)) {
            $file = Join-Path $env:MOUNT_TARGET 'scripts\windows\Build-Windows.ps1'
          } elseif (-not $file) {
            if (-not (Test-Path -LiteralPath 'third_party/ANTfrastructure/windows/scripts/python/Invoke-PythonCiBuild.ps1' -PathType Leaf)) {
              throw 'No scripts/windows/Build-Windows.ps1, and no ANTfrastructure pin at third_party/ANTfrastructure that ships Invoke-PythonCiBuild.ps1: pass build-script.'
            }
            $file = Join-Path $env:MOUNT_TARGET 'third_party\ANTfrastructure\windows\scripts\python\Invoke-PythonCiBuild.ps1'
            $repoRoot = $env:MOUNT_TARGET
          }
          Write-Host "build script: $file"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "file=$file"
          # One argv element per line, as run-in-windows-container's file-args takes them.
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value (@('args<<FILE_ARGS_EOF') + @(if ($repoRoot) { '-RepoRoot', $repoRoot }) + @('FILE_ARGS_EOF'))

      # The action runs the payload under pwsh; the hub's modules need 7.0 and fail opaquely under 5.1.
      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          image: ${{ inputs.image }}
          mount-source: ${{ github.workspace }}
          mount-target: ${{ inputs.mount-target }}
          file: ${{ steps.build-script.outputs.file }}
          file-args: ${{ steps.build-script.outputs.args }}
          # One argument per line: the action builds an argv array, so -e and its value are two lines.
          extra-args: |
            -e
            PYTHON_FREE_THREADED_WHEEL=${{ inputs.free-threaded-wheel }}

      # always(): a failed build is exactly when the logs are worth having.
      - name: Upload files, logs & Zip
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: warn
          path: ${{ inputs.artifact-paths }}

  # The device has no image, so :winarm64's interpreters and toolchain stage everything it runs (CON113).
  stage-python-for-windows-arm64:
    if: ${{ inputs.arm64-tests }}
    name: stage the arm64 legs in :winarm64
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    steps:
      - name: Prepare the Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          target-arch: arm64
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: ${{ inputs.fetch-depth }}

      # Inputs reach the container as --env data, never interpolated into a script.
      - name: Compose the container environment
        id: env
        env:
          PY_VERSIONS: ${{ inputs.arm64-python-versions }}
          PY_EXTRAS: ${{ inputs.arm64-extras }}
          FT_EXTRAS: ${{ inputs.free-threaded-extras }}
          TEST_PATHS: ${{ inputs.test-paths }}
          TEST_FILES: ${{ inputs.arm64-test-files }}
          TEST_ENV: ${{ inputs.arm64-test-env }}
        run: |
          $lines = foreach ($name in 'PY_VERSIONS', 'PY_EXTRAS', 'FT_EXTRAS', 'TEST_PATHS', 'TEST_FILES', 'TEST_ENV') { '--env'; "$name=$([Environment]::GetEnvironmentVariable($name))" }
          $delim = "EOF_$([guid]::NewGuid().ToString('N'))"
          "args<<$delim", @($lines), $delim | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT

      - name: Stage every leg
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          target-arch: arm64
          file: C:\ws\third_party\ANTfrastructure\windows\scripts\python\New-Arm64PythonTestStage.ps1
          file-args: |
            -RepoRoot
            C:\ws
          extra-args: ${{ steps.env.outputs.args }}

      # Standalone: the device has no image, so every import must resolve inside the stage or Windows.
      - name: Arch gate (the staged interpreters, sites and wheels)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          target-arch: arm64
          file: C:\ws\third_party\ANTfrastructure\windows\scripts\build\Test-TargetArch.ps1
          file-args: |
            -Path
            C:\ws\dist\windows-arm64-python
            -Arch
            arm64
            -MinInspected
            10
            -ImportWalk
            -Standalone

      # Hidden files too: a staged test tree may hold some.
      - name: Upload the stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-windows-arm64-stage
          path: ${{ steps.prep.outputs.workspace }}/dist/windows-arm64-python
          include-hidden-files: true
          if-no-files-found: error

  test-python-on-windows-arm64:
    if: ${{ inputs.arm64-tests }}
    needs: stage-python-for-windows-arm64
    name: pytest on windows-11-arm
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Download the stage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-windows-arm64-stage
          path: stage

      # One counts line over every leg and wheel proof; the summary shows it before any verdict.
      - name: Test each Python leg natively
        working-directory: stage
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "the arm64 test job must be on arm64, not $env:PROCESSOR_ARCHITECTURE" }
          $log = Join-Path $env:RUNNER_TEMP 'arm64-legs.log'
          ./Invoke-StagedTests.ps1 *>&1 | Tee-Object -FilePath $log
          $counts = @(Select-String -LiteralPath $log -Pattern '^TESTS: passed=(\d+) failed=(\d+) skipped=(\d+)\s*$')
          if ($counts.Count -ne 1) { throw "the staged legs printed $($counts.Count) counts lines, not one" }
          $passed, $failed, $skipped = $counts[0].Matches[0].Groups[1..3].Value | ForEach-Object { [int]$_ }
          "### arm64 Python legs on windows-11-arm`n`npassed $passed, failed $failed, skipped $skipped" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
          if ($failed -gt 0) { throw "$failed arm64 test(s) or wheel proof(s) failed" }
          if ($passed -lt 1) { throw 'no arm64 test passed; a run with nothing tested is not a test verdict' }

      - name: Upload the arm64 wheels
        if: ${{ inputs.arm64-wheels }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows-arm64-wheels
          path: stage/wheels/*.whl
          if-no-files-found: error

  # Independent of the build: a syntax error in the build scripts is exactly when this gate matters.
  lint-powershell:
    if: ${{ inputs.lint-powershell }}
    name: PowerShell lint (ANTfrastructure gate)
    runs-on: ${{ inputs.runs-on }}
    # Install-Module is the step that can hang.
    timeout-minutes: 20
    steps:
      # Top level only: the gate lives in third_party/ANTfrastructure, and nothing reads that submodule's own chain.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      # Pinned: a new analyzer release must not fail this lane with no commit to blame.
      - name: Install PSScriptAnalyzer
        run: |
          $versions = 'third_party/ANTfrastructure/linux/scripts/01-core/versions.env'
          $pins = @(Get-Content -LiteralPath $versions | Where-Object { $_ -match '^\s*PSSCRIPTANALYZER_VERSION\s*=' })
          if ($pins.Count -ne 1) { throw "PSSCRIPTANALYZER_VERSION must occur exactly once in $versions" }
          $pin = ($pins[0] -split '=', 2)[1].Trim().Trim('"', "'")
          Install-Module PSScriptAnalyzer -RequiredVersion $pin -Force -Scope CurrentUser

      # The ruleset resolves against the gate's own root (by reference); -FailOnAnalyzer is fixed, as without it the analyzer cannot fail.
      - name: Lint PowerShell (parse gate + AST traps + PSScriptAnalyzer)
        run: |
          $gate = 'third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1'
          if (-not (Test-Path -LiteralPath $gate)) {
            throw "Missing $gate - this lane expects ANTfrastructure at third_party/ANTfrastructure (the family layout) and checks it out with submodules: true."
          }
          pwsh -NoProfile -File $gate -Path '${{ inputs.lint-path }}' -FailOnAnalyzer
