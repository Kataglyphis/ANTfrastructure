# .github/workflows/python-ci-windows.yml
#
# Reusable Windows CI lane for the Python consumers (OrchestrANT,
# WebDavClient). Runs the repo's scripts/windows/Build-Windows.ps1
# inside the winamd64 image and uploads whatever it produced.
#
# TWO INDEPENDENT JOBS, each with its own switch: the container build
# (`build-python-package`, default true) and the PowerShell lint
# (`lint-powershell`, default false). Either runs without the other, which is
# what lets a repo with no Python package take the lint gate alone.
#
# Twin of python-ci-linux.yml. Before this existed the two callers each carried a
# ~70-line copy differing on 20 lines, and none of those differences were a
# deliberate policy choice - they were drift. Where the copies disagreed this
# takes the SAFER of the two, which in every case was WebDavClient's:
#
#   * upload on always()      - OrchestrANT uploaded only on success, so a
#                               failing build discarded the logs that explain it
#   * if-no-files-found: warn - instead of failing the job a second time on an
#                               empty dist/ when the real failure is upstream
#   * logs/ + docs/test_results/ in the artifact, not just dist/
#   * upload-artifact v7      - OrchestrANT was a major version behind
#
# fetch-depth is the one difference that is a real choice, so it is an input:
# WebDavClient fetches full history (0), OrchestrANT shallow (1).
name: Python CI · Windows (reusable)

# Least privilege: this lane reads the repo, pulls an image and pushes artifacts.
# It never writes to the repository.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Windows container image to build inside. The default is the family
          Windows image; it must equal
          ${IMAGE_REGISTRY_PREFIX}:${CI_IMAGE_WINDOWS_TAG} from
          linux/scripts/01-core/versions.env, and
          linux/scripts/verify_ci_image_refs.py asserts that on every run
          (preflight slug `workflow-lint`). It is spelled out rather than left
          to prepare-windows-container-host's own default because this is an
          OPTIONAL input passed through unconditionally: an omitted input takes
          an action default, an input passed as the empty string does NOT.
        required: false
        type: string
        default: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
      runs-on:
        description: >-
          Runner label for the Windows job. windows-2025 is PINNED on purpose -
          windows-latest is a moving alias (it resolves to windows-2025 today)
          and repointing it would change the OS image under a green build with
          no commit to blame. Every Windows lane in the family is on this label.
        required: false
        type: string
        default: windows-2025
      build-script:
        description: >-
          Path to the build entry point AS SEEN INSIDE THE CONTAINER, i.e. under
          the mount target, not a host path.
        required: false
        type: string
        default: C:\workspace\scripts\windows\Build-Windows.ps1
      mount-target:
        description: Where the workspace is mounted inside the container.
        required: false
        type: string
        default: C:\workspace
      fetch-depth:
        description: >-
          Checkout depth. 0 = full history (needed if the build derives a version
          from git), 1 = shallow.
        required: false
        type: number
        default: 1
      artifact-name:
        description: Name of the uploaded artifact.
        required: false
        type: string
        default: python-package-windows-source-and-binaries
      artifact-paths:
        description: Newline-separated paths to upload.
        required: false
        type: string
        default: |
          ./dist/
          ./logs/
          ./docs/test_results/
      build-python-package:
        description: >-
          Run the container build job. DEFAULT TRUE, so every caller that
          predates this input is byte-for-byte unaffected.

          `false` takes the lint job below ALONE. Until 2026-09-15 the build job
          carried no `if:`, so `lint-powershell: true` also bought a winamd64
          image pull, a run of `build-script` as a Python package build, a
          `./dist/` upload and a GHCR_PAT - and OxidANT, which measured the lint
          job as byte-for-byte its own, still had to keep that job: it is a Rust
          crate with no Python package, and its Windows container build is its
          own windows-x64.yml. Trading a two-minute lint for a second container
          build was not the trade the input was offering.
        required: false
        type: boolean
        default: true
      lint-powershell:
        description: >-
          Run ANTfrastructure's PowerShell lint gate (mandatory parse pass, AST
          traps, PSScriptAnalyzer) over this repo's PowerShell tree, as a second
          job on the same Windows runner. Default false, so every existing caller
          is unchanged. Pair it with `build-python-package: false` to run the
          lint and nothing else.

          It is a SEPARATE JOB and not a step of the build above, for two
          reasons: it must run even when the build fails (a syntax error in the
          build scripts is exactly when the lint is worth having), and it needs
          no image pull, so it answers in a couple of minutes instead of waiting
          behind a container build.

          This input exists because two consumers hand-wrote the same job within
          a week - OrchestrANT's .github/workflows/powershell-lint.yml and the
          powershell-lint job in OxidANT's lint-gates.yml. They agreed on
          everything that matters (windows-2025, PSScriptAnalyzer pinned to
          1.25.0, submodules, -FailOnAnalyzer) and differed only in which
          directory they pointed the gate at, which is what lint-path is.
        required: false
        type: boolean
        default: false
      lint-path:
        description: >-
          What the lint gate walks, relative to the repo root: a directory
          (recursive) or a single .ps1/.psm1. The default is the family layout's
          `scripts`, which covers scripts\windows\ and everything under it.
          OrchestrANT's narrower `scripts/windows` is the other spelling in use.

          Passing a path that does not exist THROWS rather than reporting "0
          files parse clean" - a typo here must not read as a green gate over
          nothing.
        required: false
        type: string
        default: scripts
    secrets:
      GHCR_PAT:
        description: >-
          Token used to pull the build image from ghcr. `required: false` since
          2026-09-15: a caller that runs the lint alone
          (`build-python-package: false`) pulls no image, and a required secret
          is refused at call time - it would have made the lint unreachable for
          exactly the callers the gate was added for. The build job asserts it
          in its first step, so a caller that forgets it is told which input it
          wanted.
        required: false

defaults:
  run:
    shell: pwsh

jobs:
  # ON unless the caller passes `build-python-package: false`, which is how the
  # lint job below is taken alone. The gate is here and not on the lint job
  # because the two are independent: either may run without the other.
  build-test-python-package-on-windows:
    if: ${{ inputs.build-python-package }}
    runs-on: ${{ inputs.runs-on }}

    steps:
      # GHCR_PAT is `required: false` so a lint-only caller need not own a
      # registry token. THIS job does need one, and an empty secret otherwise
      # surfaces inside the prologue action as a `docker login` failure that
      # names the registry rather than the missing input.
      - name: Require GHCR_PAT for the container build
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if (-not $env:GHCR_PAT) {
            throw "GHCR_PAT is empty: this job pulls ${{ inputs.image }} from ghcr.io. Pass the secret, or call this lane with build-python-package: false to take the PowerShell lint alone."
          }

      # ANTfrastructure's shared Windows prologue: long paths, checkout, the
      # data-root move onto D:, disk cleanup, ghcr login, pull, disk report.
      # What stood here was a step-for-step copy of that action - same seven
      # steps in the same order, down to the same pinned checkout SHA - while
      # the Linux twin has called prepare-linux-ci-host since it was written.
      #
      # short-path-target is EMPTY on purpose, not by preference: this lane
      # mounts github.workspace into the container and uploads ./dist/, ./logs/
      # and ./docs/test_results/ relative to it, so the action's default /d/ws
      # clone would leave the mount below and every artifact glob pointing at a
      # tree the build never touched. The checkout therefore takes the
      # submodules itself, recursively - the input the action was missing.
      - name: Prepare Windows container host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          image: ${{ inputs.image }}
          registry-username: Kataglyphis
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: ${{ inputs.fetch-depth }}
          submodules: recursive
          short-path-target: ''
          # Keeps this lane's third disk signal: free space alone cannot say
          # WHERE the image landed, because cleanup-disk-space frees C: in the
          # same job. Measured 2026-08-11: C: 29.9 GB free of 149.4, D: 219.5/220.
          measure-data-root: 'true'

      # ANTfrastructure's action instead of a hand-rolled `docker run`: it gives the
      # container every logical processor the runner has, delivers the payload
      # through env vars so nothing is re-parsed by the host shell, and runs it
      # under `pwsh`. That last part is a requirement, not a preference - every
      # ANTfrastructure module declares `#requires -Version 7.0`, and Windows
      # PowerShell 5.1 cannot load them, which is how one caller's lane used to
      # fail with an opaque Import-Module error.
      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          image: ${{ inputs.image }}
          mount-source: ${{ github.workspace }}
          mount-target: ${{ inputs.mount-target }}
          file: ${{ inputs.build-script }}

      # always(): a failed build is exactly when the logs are worth having.
      - name: Upload files, logs & Zip
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: warn
          path: ${{ inputs.artifact-paths }}

  # OFF by default; `lint-powershell: true` turns it on. Independent of the build
  # job above on purpose: a syntax error in the build scripts is exactly when
  # this gate is worth having, and it needs no image pull.
  lint-powershell:
    if: ${{ inputs.lint-powershell }}
    name: PowerShell lint (ANTfrastructure gate)
    runs-on: ${{ inputs.runs-on }}
    # Install-Module is the step that can hang.
    timeout-minutes: 20
    steps:
      # submodules: true, TOP LEVEL ONLY. The gate script and its ruleset both
      # live in third_party/ANTfrastructure; its own chain is minutes of clone
      # that nothing here reads. fetch-depth 1: nothing here reads history.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      # PINNED, the way the hub pins it for its own windows-x64.yml lane: an
      # unpinned install lets a new analyzer release add a rule that fails this
      # lane with no commit to blame - the argument the ruff pin makes.
      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      # -Path points the gate at the CALLER's tree; the PSScriptAnalyzerSettings
      # file stays resolved against the gate script's own $PSScriptRoot, so the
      # hub's ruleset is consumed BY REFERENCE and no consumer copies a ruleset.
      #
      # -FailOnAnalyzer is not optional and is not an input. Without it the
      # analyzer pass prints its findings and exits 0, which is a check that
      # cannot fail; both consumers that hand-wrote this job reached the same
      # conclusion, one of them after triaging its findings to zero first. A
      # repo with an untriaged backlog fixes it or narrows the hub's ruleset -
      # it does not get a green lane over ungraded scripts.
      - name: Lint PowerShell (parse gate + AST traps + PSScriptAnalyzer)
        run: |
          $gate = 'third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1'
          if (-not (Test-Path -LiteralPath $gate)) {
            throw "Missing $gate - this lane expects ANTfrastructure at third_party/ANTfrastructure (the family layout) and checks it out with submodules: true."
          }
          pwsh -NoProfile -File $gate -Path '${{ inputs.lint-path }}' -FailOnAnalyzer
