# Consumer mutation recipes belong to the caller; this lane does not invent assertions for it.
name: Mutation gates (reusable)

on:
  workflow_call:
    inputs:
      manifest:
        description: Tracked caller-relative JSON recipe list; at least one selected recipe is required
        required: true
        type: string
      setup-script:
        description: Optional tracked caller-relative Bash script that installs test dependencies
        type: string
        default: ''
      hub-checkout:
        description: Check out ANTfrastructure separately when the caller has no submodule
        type: boolean
        default: false
      submodules:
        description: Value for actions/checkout submodules
        type: string
        default: 'recursive'
      shard:
        description: Optional K/N recipe shard; each nonempty shard needs its own caller job
        type: string
        default: ''
      runner:
        description: Pinned Linux runner label
        type: string
        default: 'ubuntu-26.04'

permissions:
  contents: read

jobs:
  mutations:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      MUTATION_MANIFEST: ${{ inputs.manifest }}
      MUTATION_SETUP_SCRIPT: ${{ inputs.setup-script }}
      MUTATION_HUB_CHECKOUT: ${{ inputs.hub-checkout }}
      MUTATION_SHARD: ${{ inputs.shard }}
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      - name: Get ANTfrastructure tooling without a submodule
        if: ${{ inputs.hub-checkout }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools
          persist-credentials: false

      - name: Read pinned Python version
        id: python
        shell: bash
        run: |
          set -euo pipefail
          hub='third_party/ANTfrastructure'
          if [ "${MUTATION_HUB_CHECKOUT}" = 'true' ]; then hub='antfrastructure-tools'; fi
          version="$(sed -n 's/^PYTHON_VERSION=\([0-9]*\.[0-9]*\)\..*/\1/p' "${hub}/linux/scripts/01-core/versions.env")"
          [ -n "${version}" ] || { echo 'missing pinned Python version' >&2; exit 2; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install uv for caller setup
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.0

      - name: Validate caller recipes and log location
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/code-quality/mutations
          git check-ignore -q --no-index -- logs/code-quality/mutations/report.txt \
            || { echo 'logs/code-quality/ must be ignored by the caller' >&2; exit 2; }
          hub='third_party/ANTfrastructure'
          if [ "${MUTATION_HUB_CHECKOUT}" = 'true' ]; then hub='antfrastructure-tools'; fi
          python3 "${hub}/docs/scripts/validate_consumer_mutations.py" \
            --root "${GITHUB_WORKSPACE}" --manifest "${MUTATION_MANIFEST}" \
            --setup-script "${MUTATION_SETUP_SCRIPT}" --shard "${MUTATION_SHARD}"

      - name: Prove caller quality gates can fail
        shell: bash
        run: |
          set -euo pipefail
          hub='third_party/ANTfrastructure'
          if [ "${MUTATION_HUB_CHECKOUT}" = 'true' ]; then hub='antfrastructure-tools'; fi
          args=(--root "${GITHUB_WORKSPACE}" --manifest "${GITHUB_WORKSPACE}/${MUTATION_MANIFEST}")
          if [ -n "${MUTATION_SHARD}" ]; then args+=(--shard "${MUTATION_SHARD}"); fi
          if [ -n "${MUTATION_SETUP_SCRIPT}" ]; then args+=(--setup-script "${MUTATION_SETUP_SCRIPT}"); fi
          python3 "${hub}/docs/scripts/verify_mutations.py" "${args[@]}" 2>&1 \
            | tee logs/code-quality/mutations/report.txt

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-gates-${{ github.run_id }}
          path: logs/code-quality/mutations/
          if-no-files-found: error
