# With prove on, off develop, the first job is refused on attempt 1 and passes on 2, and the second fails and must keep attempt 1's runner; develop stays green because the develop-red watch reads a dispatch there as red.
name: CI · disk refusal self-test

on:
  workflow_dispatch:
    inputs:
      prove:
        description: Refuse once and fail once, so the retry can be read; ignored on develop
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refused-once:
    name: Refused on the first attempt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Prepare CI host
        uses: ./.github/actions/prepare-linux-ci-host
        with:
          image: hello-world:latest
          checkout: 'false'
          free-disk-space: 'false'
          min-free-gb: ${{ inputs.prove && github.ref != 'refs/heads/develop' && github.run_attempt == 1 && '99999' || '0' }}

  genuine-failure:
    name: A genuine failure, never re-run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail only when proving
        env:
          PROVE: ${{ inputs.prove && github.ref != 'refs/heads/develop' }}
        run: test "${PROVE}" != true
