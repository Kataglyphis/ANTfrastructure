# Proves retry-disk-refusal on a real run: the first job is refused on attempt 1 and passes on 2, the second fails every time and must keep attempt 1.
name: CI · disk refusal self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refused-once:
    name: Refused on the first attempt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Prepare CI host
        uses: ./.github/actions/prepare-linux-ci-host
        with:
          image: hello-world:latest
          checkout: 'false'
          free-disk-space: 'false'
          min-free-gb: ${{ github.run_attempt == 1 && '99999' || '0' }}

  genuine-failure:
    name: A genuine failure, never re-run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail
        run: exit 1
