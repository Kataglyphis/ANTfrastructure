# No image on purpose: the gates bootstrap SHA-pinned binaries from versions.env. See docs/shared-script-libraries.md § run-lint-gates.sh
name: Lint gates (reusable)

on:
  workflow_call:
    inputs:
      submodules:
        description: >-
          Value for actions/checkout `submodules`. `recursive` is the safe
          default: the secret scan reads the whole tree, and a half-checked-out
          submodule would change what it sees between runs.
        type: string
        default: 'recursive'
      exclude:
        description: >-
          Top-level directory dropped from every scope (the aggregator's
          --exclude; default third_party). One name only - repeat the lane for
          more, or keep the extra exclusions in your wrapper.
        type: string
        default: 'third_party'
      hub-checkout:
        description: >-
          Check the hub out into antfrastructure-tools and run its aggregator
          from there. For consumers with NO third_party/ANTfrastructure
          submodule.
        type: boolean
        default: false
      ratchets:
        description: >-
          Pass --ratchets: the eight root-aware measurement gates over the
          consumer tree. Freeze files live at the root; seed and commit them
          before enabling this input.
        type: boolean
        default: false
      code-dupes:
        description: >-
          Enforce the consumer's duplication budget using code-dupes.allow at
          its root. Enable after refactoring existing findings.
        type: boolean
        default: false
      code-dupes-report:
        description: >-
          Measure duplication and upload a report even while findings remain.
          Scanner and allow-file errors still fail the job. Default true so
          consumers see their remaining duplication without changing ratchets.
        type: boolean
        default: true
      allow-empty-shell:
        description: >-
          Permit a consumer with no tracked shell scripts. The shell gate then
          reports the empty scope without invoking ShellCheck on the hub.
        type: boolean
        default: false
      runner:
        description: Runner label; pinned to an OS version, never a moving alias.
        type: string
        default: 'ubuntu-26.04'

permissions:
  contents: read

jobs:
  lint-gates:
    name: shell + workflow + secret + config gates
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      LINT_EXCLUDE: ${{ inputs.exclude }}
      LINT_HUB_CHECKOUT: ${{ inputs.hub-checkout }}
      LINT_RATCHETS: ${{ inputs.ratchets }}
      LINT_CODE_DUPES: ${{ inputs.code-dupes }}
      LINT_CODE_DUPES_REPORT: ${{ inputs.code-dupes-report }}
      LINT_ALLOW_EMPTY_SHELL: ${{ inputs.allow-empty-shell }}
    steps:
      # Every scope comes from `git ls-files`, not history.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: ${{ inputs.submodules }}

      - name: Get ANTfrastructure tooling (consumers without a submodule)
        if: ${{ inputs.hub-checkout }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools

      # uvx is how the aggregator runs ruff; the runner carries no uv.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.0

      # Explicit root: a self-derived one would grade ANTfrastructure instead of the consumer.
      - name: Lint gates
        shell: bash
        run: |
          set -euo pipefail
          hub='third_party/ANTfrastructure'
          if [ "${LINT_HUB_CHECKOUT}" = 'true' ]; then hub='antfrastructure-tools'; fi
          args=(--exclude "${LINT_EXCLUDE}")
          if [ "${LINT_RATCHETS}" = 'true' ]; then args+=(--ratchets); fi
          if [ "${LINT_CODE_DUPES}" = 'true' ]; then args+=(--code-dupes); fi
          if [ "${LINT_CODE_DUPES_REPORT}" = 'true' ]; then args+=(--code-dupes-report); fi
          if [ "${LINT_ALLOW_EMPTY_SHELL}" = 'true' ]; then args+=(--allow-empty-shell); fi
          bash "${hub}/linux/scripts/run-lint-gates.sh" "${GITHUB_WORKSPACE}" "${args[@]}"

      - name: Save duplication report
        if: ${{ always() && inputs.code-dupes-report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-duplication-${{ github.run_id }}
          path: logs/code-quality/code-dupes.txt
          if-no-files-found: error
