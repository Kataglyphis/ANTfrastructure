# Weekly: file an issue when docs, ARGs or license files drift from versions.env.
name: Docs · stale check

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch:       # manual trigger

# The default token may be configured read-only, which would 403 the issue creation.
permissions:
  contents: read
  issues: write

jobs:
  stale-docs:
    name: Check for stale docs
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # continue-on-error only lets the issue step run first; the last step re-raises the failure.
      - name: Check version/docs consistency
        id: check
        continue-on-error: true
        run: PREFLIGHT_ONLY=version-snapshot,arg-consistency,mirror-consistency,doc-links,doc-dupes,sbom bash linux/scripts/preflight.sh

      - name: Create issue if stale
        if: steps.check.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '📋 Stale docs detected — run sync_versions.py --write';
            const body = [
              'Weekly stale-doc check found out-of-date documentation.',
              '',
              'Run locally to fix:',
              '```bash',
              'python3 docs/scripts/sync_versions.py --write',
              'python3 docs/scripts/generate-website-licenses.py --write',
              '```',
              '',
              'Then commit and push the changes.',
              '',
              '---',
              '_Generated automatically by the Docs · stale check workflow (stale-docs-check.yml)._',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'documentation',
            });
            const alreadyOpen = issues.find(i =>
              i.title.includes('Stale docs detected')
            );
            if (alreadyOpen) {
              console.log('Issue already exists, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['documentation'],
            });

      # Without this re-raise the weekly gate could never fail.
      - name: Fail the run when the docs are stale
        if: steps.check.outcome != 'success'
        run: |
          echo "::error::version/docs consistency check failed - see the 'Check version/docs consistency' step"
          exit 1
