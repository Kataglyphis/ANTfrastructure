name: Renovate entrypoint

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out shared validator
        if: github.repository != 'Kataglyphis/ANTfrastructure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools
      - name: Verify Renovate entrypoint
        run: |
          if [ "$GITHUB_REPOSITORY" = 'Kataglyphis/ANTfrastructure' ]; then
            python3 linux/scripts/verify_renovate_entrypoint.py "$GITHUB_WORKSPACE"
          else
            python3 antfrastructure-tools/linux/scripts/verify_renovate_entrypoint.py "$GITHUB_WORKSPACE"
          fi
