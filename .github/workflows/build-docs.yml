# .github/workflows/build-docs.yml
name: Build Docs

# Least privilege: docs build + FTP deploy need no repo write access.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
jobs:
  build-docs:
    name: Build Documentation
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Serialize production deploys: two overlapping runs must not FTP-sync into
    # the same server directory at once. Job-level on purpose — a reusable
    # (workflow_call) workflow does not get its own workflow run, so a
    # top-level `concurrency:` here would never take effect; the job-level
    # group is evaluated per caller run and actually queues.
    # cancel-in-progress stays false so a mid-flight deploy is never killed
    # halfway (a cancelled FTP sync leaves a half-updated site).
    concurrency:
      group: docs-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Non-recursive: we only need the flat docs tooling from the
          # DocumANTation submodule, not its own nested submodules.
          # (DocumANTation also references ContainerHub, so recursing would
          # re-clone this repo in a cycle.)
          submodules: true

      - name: Install uv (Astral)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: 3.14
          enable-cache: true

      - name: Install project dependencies with uv
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

      # The verification list lives in preflight.sh (single source of the gate
      # list — the same one ubuntu24.04.yml runs in full and the commit hook
      # subsets). Deliberately narrowed to the docs-relevant slugs: this
      # reusable workflow must stay self-sufficient for callers that have no
      # preflight job of their own, but ubuntu24.04.yml's dedicated preflight
      # job already carries the FULL gate, so re-running everything here just
      # doubled the work on every PR/push.
      - name: Run preflight verification (docs-relevant subset)
        run: PREFLIGHT_ONLY=version-snapshot,mirror-consistency,doc-links,doc-dupes bash linux/scripts/preflight.sh

      - name: Check shell script syntax
        run: find linux/scripts -name '*.sh' -exec bash -n {} +

      - name: Build web page
        run: |
          source .venv/bin/activate
          cd docs
          make html

      # Deploy gate: a reusable workflow sees the CALLER's event, and
      # ubuntu24.04.yml calls this on pull_request too — without the
      # event_name guard, PR content would deploy straight to production.
      - name: 📂 Sync files to domain
        if: success() && github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/_build/html/"
