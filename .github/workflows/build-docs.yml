# .github/workflows/build-docs.yml
name: Build Docs

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
jobs:
  build-docs:
    name: Build Documentation
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          # Non-recursive: we only need the flat docs tooling from the
          # Kataglyphis-DocumANTation submodule, not its own nested submodules.
          # (DocumANTation also references ContainerHub, so recursing would
          # re-clone this repo in a cycle.)
          submodules: true

      - name: Install uv (Astral)
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: 3.14
          enable-cache: true

      # Optional: install Python pinned by project if you want: `uv python install`
      - name: Install project dependencies with uv (use lock if present)
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

      - name: Check generated version snapshot
        run: |
          python external/Kataglyphis-DocumANTation/docs-tooling/scripts/sync_versions.py \
            --check --repo-root . \
            --versions-env linux/scripts/01-core/versions.env \
            --deps-json docs/deps/deps.json

      - name: Check website license files are current
        run: |
          python external/Kataglyphis-DocumANTation/docs-tooling/scripts/generate-website-licenses.py \
            --check --repo-root . \
            --deps-json docs/deps/deps.json \
            --versions-env linux/scripts/01-core/versions.env \
            --assets-dir linux/webserver/dist/assets/assets/documents/footer

      - name: Verify version ARG consistency
        run: bash linux/scripts/01-core/verify-arg-consistency.sh

      - name: Verify Five Critical Fixes (source integrity)
        run: bash linux/scripts/verify-critical-fixes.sh

      - name: Check shell script syntax
        run: find linux/scripts -name '*.sh' -exec bash -n {} +

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --exclude=SC1090,SC1091,SC2034,SC2154 \
            $(find linux/scripts -name '*.sh' | sort) || true
        continue-on-error: true

      - name: Copy docs
        run: |
          cp README.md docs/source/README.md
          cp CHANGELOG.md docs/source/CHANGELOG.md

      - name: Build web page
        run: |
          source .venv/bin/activate
          cd docs
          make html

      - name: 📂 Sync files to domain
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/_build/html/"
