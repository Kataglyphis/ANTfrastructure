# .github/workflows/build-docs.yml
name: Build Docs

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
jobs:
  build-docs:
    name: Build Documentation
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          # Non-recursive: we only need the flat docs tooling from the
          # Kataglyphis-DocumANTation submodule, not its own nested submodules.
          # (DocumANTation also references ContainerHub, so recursing would
          # re-clone this repo in a cycle.)
          submodules: true

      - name: Install uv (Astral)
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: 3.14
          enable-cache: true

      - name: Install project dependencies with uv
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

      # These scripts read this repo's Dockerfiles and versions.env, so they
      # live here rather than in the DocumANTation submodule -- only the shared
      # theme and templates do. sync_versions.py --check also checks the website
      # licence files.
      - name: Check generated version snapshot (also checks website licenses)
        run: python docs/scripts/sync_versions.py --check


      - name: Verify version ARG consistency
        run: bash linux/scripts/01-core/verify-arg-consistency.sh

      - name: Verify Ubuntu mirror consistency
        run: bash linux/scripts/01-core/verify-ubuntu-mirror-consistency.sh

      - name: Verify Five Critical Fixes (source integrity)
        run: bash linux/scripts/verify-critical-fixes.sh

      - name: Check shell script syntax
        run: find linux/scripts -name '*.sh' -exec bash -n {} +

      - name: Build web page
        run: |
          source .venv/bin/activate
          cd docs
          make html

      - name: 📂 Sync files to domain
        if: success()
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/_build/html/"
