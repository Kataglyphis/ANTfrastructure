# .github/workflows/build-docs.yml
name: Docs · build (reusable)

# Least privilege: docs build + FTP deploy need no repo write access.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
jobs:
  build-docs:
    name: Build Documentation
    runs-on: ${{ inputs.runner }}
    # Raised from 30: the lane now pulls the family image before it builds.
    timeout-minutes: 45
    # Job-level because a workflow_call workflow has no run of its own; never cancel a half-done FTP sync.
    concurrency:
      group: docs-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # image omitted so the action's versions.env-composed default applies; no login, the package is public.
      - name: Prepare CI host (checkout + pull the family Linux image)
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          fetch-depth: '0'
          # Non-recursive: DocumANTation references this repo, so recursing would clone it in a cycle.
          submodules: 'true'

      # Docs-relevant subset only: linux-x64.yml already runs the full gate, and callers without one still get these.
      - name: Run preflight verification (docs-relevant subset)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: >-
            bash -lc "PREFLIGHT_ONLY=version-snapshot,mirror-consistency,doc-links,doc-dupes,shellcheck
            bash linux/scripts/preflight.sh"

      # The same script as on a workstation; it fails without index.html, so an empty tree is never deployed.
      - name: Build web page
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash linux/scripts/build-docs.sh

      # Callers also run this on pull_request, so guard the event; @develop, since ./ is the caller's checkout.
      - name: 📂 Sync files to domain
        if: success() && github.event_name == 'push'
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: ./docs/_build/html/
