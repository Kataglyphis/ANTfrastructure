# .github/workflows/build-docs.yml
name: Build Docs

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
jobs:
  build-docs:
    name: Build Documentation
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Non-recursive: we only need the flat docs tooling from the
          # Kataglyphis-DocumANTation submodule, not its own nested submodules.
          # (DocumANTation also references ContainerHub, so recursing would
          # re-clone this repo in a cycle.)
          submodules: true

      - name: Install uv (Astral)
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: 3.14
          enable-cache: true

      - name: Install project dependencies with uv
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

      # The verification list lives in preflight.sh (single source of the gate
      # list — the same one ubuntu24.04.yml runs in full and .githooks/pre-commit
      # subsets). shellcheck is skipped here: it is not installed on this runner
      # and the full gate already runs it in the preflight job.
      - name: Run preflight verification (minus shellcheck)
        run: PREFLIGHT_SKIP=shellcheck bash linux/scripts/preflight.sh

      - name: Check shell script syntax
        run: find linux/scripts -name '*.sh' -exec bash -n {} +

      - name: Build web page
        run: |
          source .venv/bin/activate
          cd docs
          make html

      - name: 📂 Sync files to domain
        if: success()
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/_build/html/"
