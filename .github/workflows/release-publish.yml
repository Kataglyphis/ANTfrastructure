# The version check and the tag-and-publish job of every family release.yml. See docs/branch-and-release-strategy.md#the-reusable-release-workflow
name: Release · version check + publish (reusable)

on:
  workflow_call:
    inputs:
      stage:
        description: >-
          check, before the lanes: the version has a CHANGELOG section and no release yet.
          publish, in a job that needs every lane: collect the uploads, tag v<version> and publish.
        type: string
        required: true
      name:
        description: The release title is "<name> <version>".
        type: string
        required: true
      version-file:
        description: pubspec.yaml, Cargo.toml, CMakeLists.txt or VERSION.txt, relative to the repository root.
        type: string
        required: true
      changelog:
        description: The file whose "## <version>" section becomes the release notes.
        type: string
        default: CHANGELOG.md
      artifacts:
        description: download-artifact pattern for the uploads to collect; empty takes every upload of the run.
        type: string
        default: ''
      collect:
        description: >-
          collect-release-assets.sh options, one per line, globs unquoted
          (docs/branch-and-release-strategy.md#collecting-the-release-files).
        type: string
        default: ''
      dry-run:
        description: Check and collect, list the release's files in the run summary, tag and publish nothing.
        type: boolean
        default: false
      runner:
        description: Runner label; pinned to an OS version, never a moving alias.
        type: string
        default: ubuntu-26.04

jobs:
  check:
    name: Version not released yet
    # Any stage but publish, so a misspelt one fails here instead of skipping the release.
    if: inputs.stage != 'publish'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The release scripts travel with this workflow, so they come from the same develop.
      - name: Get ANTfrastructure tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools
          fetch-depth: 1
          sparse-checkout: linux/scripts
          persist-credentials: false

      # A dry run goes on past a failed check, which then only says where a release would stop.
      - name: The version has a CHANGELOG section and no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE: ${{ inputs.stage }}
          DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_NAME: ${{ inputs.name }}
          VERSION_FILE: ${{ inputs.version-file }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          [ "${STAGE}" = check ] || { echo "::error::stage is check or publish, not '${STAGE}'"; exit 1; }
          if ! bash antfrastructure-tools/linux/scripts/06-packaging/publish-github-release.sh \
              --version-file "${VERSION_FILE}" --changelog "${CHANGELOG}" --name "${RELEASE_NAME}" --check; then
            [ "${DRY_RUN}" = true ] || exit 1
            echo "::warning::a release from this commit would stop at the version check"
          fi

  publish:
    name: Tag and publish the release
    if: inputs.stage == 'publish'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Get ANTfrastructure tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools
          fetch-depth: 1
          sparse-checkout: linux/scripts
          persist-credentials: false

      - name: Download every lane's uploads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: ${{ inputs.artifacts }}

      # The options reach the script as a file, so no glob in them is expanded on the way.
      - name: Collect the release files
        env:
          COLLECT: ${{ inputs.collect }}
          VERSION_FILE: ${{ inputs.version-file }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          set -euo pipefail
          hub=antfrastructure-tools/linux/scripts
          printf '%s\n' "${COLLECT}" > "${RUNNER_TEMP}/collect.options"
          version="$(bash "${hub}/02-toolchain/rust/version_util.sh" --file-version "${VERSION_FILE}")"
          # A literal name downloads one upload, which download-artifact extracts without its folder.
          lone=()
          if [ -n "${ARTIFACTS}" ] && [[ "${ARTIFACTS}" != *[*?[]* ]]; then lone=(--lone-upload "${ARTIFACTS}"); fi
          bash "${hub}/06-packaging/collect-release-assets.sh" --options "${RUNNER_TEMP}/collect.options" \
            "${lone[@]}" --version "${version}" artifacts release

      - name: Dry run, what the release would carry
        if: inputs.dry-run
        run: |
          {
            echo "### Dry run: the release would carry these files"
            echo '```'
            (cd release && sha256sum -- * && du -ch -- * | tail -n 1)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la release

      # Every push to main is a release; anywhere else only a dry run is.
      - name: Tag v<version> and publish
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ inputs.name }}
          VERSION_FILE: ${{ inputs.version-file }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          [ "${GITHUB_REF}" = refs/heads/main ] || { echo "::error::a release is published from main only; dispatch a dry run elsewhere"; exit 1; }
          bash antfrastructure-tools/linux/scripts/06-packaging/publish-github-release.sh \
            --version-file "${VERSION_FILE}" --changelog "${CHANGELOG}" --name "${RELEASE_NAME}" --assets release
