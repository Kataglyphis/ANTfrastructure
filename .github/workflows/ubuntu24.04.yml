# .github/workflows/ubuntu24.04.yml
# Entry-point workflow: runs docs validation/build and the shell preflight gates.
name: Ubuntu 24.04 Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # Fast, no-build gate: shellcheck + the verify-* suite (script-COPY coverage,
  # critical-fixes, ARG consistency, version snapshot, mirror + runtime-path
  # consistency). Catches the failure classes that otherwise only surface hours
  # into a multi-arch build. Mirrors the local .githooks/pre-commit gate, which
  # is opt-in and silently skipped by contributors who don't enable it.
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run preflight checks
        run: bash linux/scripts/preflight.sh

  build-docs:
    uses: ./.github/workflows/build-docs.yml
    with:
      runner: ubuntu-24.04
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}

