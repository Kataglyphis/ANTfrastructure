# .github/workflows/ubuntu24.04.yml
# Entry-point workflow: runs docs validation/build and the shell preflight gates.
name: Ubuntu 24.04 Workflow

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: a force-push/new push supersedes the in-flight run instead
# of burning runner minutes next to it. The called build-docs job additionally
# carries its own job-level docs-deploy concurrency group
# (cancel-in-progress: false) so two runs can never FTP-sync concurrently.
concurrency:
  group: ubuntu24-04-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Fast, no-build gate: shellcheck + the verify-* suite (script-COPY coverage,
  # critical-fixes, ARG consistency, version snapshot, mirror consistency;
  # the runtime-path check also runs but is advisory-only — it prints WARNs
  # and never fails). Catches the failure classes that otherwise only surface
  # hours into a multi-arch build. Mirrors the local commit gate
  # (linux/host-config/git-hooks/pre-commit),
  # which is opt-in and silently skipped by contributors who don't enable it.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # preflight.sh ends with a python-lint gate (lint-python.sh) that needs
      # ruff. It prefers a ruff on PATH and otherwise falls back to
      # `uvx ruff@<pin>` - but this runner had neither, so the gate died with
      #   ERROR: neither ruff nor uvx found - install uv (repo standard) or ruff
      # AFTER every other check had already passed. uv is the repo standard, so
      # install that rather than a second, unpinned ruff: lint-python.sh pins the
      # version itself (RUFF_PIN) and uvx honours it.
      - name: Install uv (provides uvx for the python-lint gate)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Run preflight checks
        run: bash linux/scripts/preflight.sh

  build-docs:
    uses: ./.github/workflows/build-docs.yml
    with:
      runner: ubuntu-24.04
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}

