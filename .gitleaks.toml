# gitleaks config for linux/scripts/lint-secrets.sh (preflight + CI + hook).
#
# Extends the built-in rule set — this file only ADDS allowlist entries, it
# never disables a rule.
#
# Why this exists instead of .gitleaksignore: .gitleaksignore entries are
# `file:rule:line` fingerprints, so they silently stop matching the moment an
# unrelated edit shifts the line. That is what turned main red — both triaged
# false positives below drifted (build-gcc.sh 332 -> 339, versions.env
# 408 -> 420) and the gate started reporting them as fresh leaks.
#
# Allowlisting the exact secret VALUE instead is stable across refactors and
# stays narrow: each regex below pins one specific literal, so a genuinely new
# high-entropy string in the same file is still reported.
#
# RULE, unchanged: every entry needs a justification comment saying why the
# matched value is not a credential.

[extend]
useDefault = true

[[allowlists]]
description = """
GCC release-signer GPG key FINGERPRINTS — the accepted-signer allowlist used to
verify downloaded gcc tarball signatures (linux/scripts/02-toolchain/build-gcc.sh).
A public trust anchor: knowing a signing key's fingerprint grants nothing.
"""
regexTarget = "secret"
regexes = [
  '''D3A93CAD751C2AF4F8C7AD516C35B99309B5FA62''',
  '''7F74F97C103468EE5D750B583AB00996FC26A641''',
  '''33C235A34C46AA3FFB293709A328C3A2C3C45C06''',
  '''13975A70E63C361C73AE69EF6EEB81F8981C74C7''',
]

[[allowlists]]
description = """
SHA256 pin OF the public AMD ROCm apt signing key (TheRock distribution,
stable.repo.amd.com/rocm/gpg/packages.gpg), used as the supply-chain
download gate in linux/scripts/01-core/versions.env.
A checksum of a public file, not a credential.
"""
regexTarget = "secret"
regexes = [
  '''090a4bf906822c5eb450ae8024b728b9281f2fccb0304641eb75018e4ec6a6dd''',
]

[[allowlists]]
description = """
out/ — build logs and artefacts, which this gate should never have been reading.
.gitignore:4 excludes out/**/*, so nothing under it can reach a commit, while
lint-secrets.sh's own header states the scope as "what the NEXT commit would
ship". Measured 2026-08-27: scanning it cost 5m39s over 5.32 GB and produced
the gate's ONLY failures — nine hits on ROCM_GPG_KEY_SHA256, i.e. the very
checksum already allowlisted by value above. The value-pinned entry misses
there because gitleaks extracts a different span from a log line than from the
versions.env assignment, which is exactly why chasing regenerable output with
per-value allowlists is the wrong repair.
"""
paths = ['''^out/''']
