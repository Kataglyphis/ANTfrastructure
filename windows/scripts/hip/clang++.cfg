# Loaded by default by TheRock's clang and clang++ (and amdclang*): a config file beside the driver.
# MSVC 14.51's <cmath> owns isgreater & co. as constexpr, so HIP's math headers must yield them;
# the overlay does that (ANTfrastructure docs/windows-rocm.md, windows/scripts/hip/).
-isystem C:/runtime/opt/hip-msvc-cmath
