# buildkitd worker GC policy for the Windows BK lane host.
# Deployed to C:\ProgramData\buildkitd\buildkitd.toml by
# windows\scripts\apply-buildkitd-gcpolicy.ps1 (admin; restarts buildkitd —
# NEVER while a build is running).
#
# Why this exists (2026-08-04 incident): with no config file buildkitd runs on
# computed defaults — maxUsedSpace 100GB, minFreeSpace 187GB. The warm chain's
# cache is ~237GB on a 999GB disk with ~92GB free, so BOTH triggers fired on
# every GC pass: the moment a build finished and its references dropped, GC
# evicted everything reclaimable, INCLUDING the multi-hour VS Build Tools
# layer — every following run re-paid the full base rebuild.
#
# The load-bearing knob is reservedSpace: GC never prunes the cache below it,
# which is what actually protects the ~35GB VS-class layers. minFreeSpace
# drops to 25-30GB so GC stops fighting the mostly-full disk (free real space
# by pruning the classic docker lane instead). Warm-solve scratch (the
# never-finalized snapshots of the ExportLayer-0x3 workaround) needs no
# special rule — the keepDuration tier ages it out.
#
# v0.32 key names: reservedSpace / maxUsedSpace / minFreeSpace
# (docs/windows-builds.md's older gckeepstorage snippet was the legacy form).
#
# SIZING FOR OTHER MACHINES (values below assume this host's ~930 GB C:):
# the invariants, not the literals, are what to reproduce —
#   reservedSpace: must exceed the fresh chain spine (~120-150 GB: base incl.
#     VS + sdk + toolchain + branch images) or GC evicts mid-chain layers;
#     rule of thumb ~20-25% of the disk, floor 150 GB.
#   maxUsedSpace: ~reservedSpace * 1.5, so scratch can churn above the spine.
#   minFreeSpace: this is a TRIGGER, not a floor - GC starts evicting when free
#     space reaches it, and a heavy media stage keeps consuming while GC works.
#     Set it well ABOVE the danger band, not at it. Measured 2026-08-07 with
#     minFreeSpace = 30GB: a full chain dipped to 25.1 GB and later 22.7 GB and
#     needed MANUAL `buildctl prune --free-storage` twice mid-build, because a
#     single media layer eats 6-10 GB faster than GC frees it. Below ~25 GB
#     hcsshim finalize/export turns flaky long before a clean disk-full error
#     (2026-08-06: a chain died with "ninja is not recognized" at 4.8 GB and
#     left two poisoned snapshots). 60 GB gives GC roughly one heavy layer of
#     runway. Cost: more cache eviction, so cold rebuilds are likelier - that
#     is the right trade against an unattended run dying at 3 a.m.
#   history tier: keep as-is on every machine (time/count-based, size-free).
# A disk under ~400 GB cannot hold the full warm chain comfortably - expect
# to prune between runs and keep reservedSpace >= 150 GB regardless.

# Build-history retention: WITHOUT this, every build record (including failed
# attempts) pins its cache refs INDEFINITELY — on 2026-08-05 the store sat at
# 414 GB with "Reclaimable: 0B" because ~10 grind runs' histories held
# everything; `buildctl prune-histories` released 289 GB in one stroke while
# a build was running. This cap keeps the store self-cleaning.
[history]
  maxAge = 172800   # seconds (48h)
  maxEntries = 10

[worker.containerd]
  gc = true

  # Tier 0: local sources, git checkouts and cache mounts (C:\bkhandoff etc).
  # The default caps these at 512MB/48h — far too small for a week of chain
  # iterations over multi-GB handoffs.
  [[worker.containerd.gcpolicy]]
    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
    keepDuration = "168h"
    maxUsedSpace = "20GB"

  # Tier 1: anything unused for >30 days goes first.
  [[worker.containerd.gcpolicy]]
    keepDuration  = "720h"
    reservedSpace = "200GB"
    maxUsedSpace  = "300GB"
    # 30GB -> 60GB (2026-08-07): 30 GB left GC no runway and forced two manual
    # prunes mid-chain. Still far below reservedSpace, so the VS-class spine
    # this tier protects is untouched by the change.
    minFreeSpace  = "60GB"

  # Tier 2: hard ceiling.
  [[worker.containerd.gcpolicy]]
    all = true
    reservedSpace = "200GB"
    maxUsedSpace  = "320GB"
    minFreeSpace  = "25GB"
