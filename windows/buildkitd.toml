# Windows buildkitd GC policy (Set-BuildkitdGcpolicy.ps1 deploys it); sizing: docs/windows-host-setup.md § C3. Deploy the GC policy + build-history cap (REQUIRED — not optional tuning).

# Without this cap every build record pins its cache refs indefinitely.
[history]
  maxAge = 172800   # seconds (48h)
  maxEntries = 10

[worker.containerd]
  gc = true

  # Only the default windows snapshotter loads here: native fails to load and windows-uvm silently falls back.

  # Tier 0 inventory: sccache L0 (15G, dormant), uv wheels (~10G), sccache logs (<1G); cache sizes and this reserve are one decision.
  [[worker.containerd.gcpolicy]]
    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
    keepDuration = "168h"
    reservedSpace = "30GB"
    maxUsedSpace = "60GB"

  # Tier 1: anything unused for >30 days goes first.
  [[worker.containerd.gcpolicy]]
    keepDuration  = "720h"
    # Above the fresh chain spine, sized against free space; a reserve below the VS layer evicts it between runs.
    reservedSpace = "150GB"
    # Above the store's working set, or GC evicts the oldest spine layers on every run.
    maxUsedSpace  = "650GB"
    # A trigger, not a floor: it leaves GC about one heavy layer of runway.
    minFreeSpace  = "60GB"

  # Tier 2: hard ceiling.
  [[worker.containerd.gcpolicy]]
    all = true
    reservedSpace = "150GB"  # keep in step with tier 1 (see its note)
    # Stays above tier 1's ceiling.
    maxUsedSpace  = "700GB"
    minFreeSpace  = "25GB"
