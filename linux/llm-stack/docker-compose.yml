services:
  ollama:
    # Run scripts/download-ollama.sh once before the first `compose build`.
    build: .
    image: kataglyphis-ollama:local
    ports:
      # Loopback only: the Ollama API is unauthenticated (LAN: docker-compose.lan.yml).
      - "127.0.0.1:11434:8080"
    environment:
      OLLAMA_HOST: "0.0.0.0:8080"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_NUM_THREADS: "6"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Same default as run_benchmarks.sh; override both via BENCH_MODEL.
      OLLAMA_PULL_MODELS: "${BENCH_MODEL:-gemma4:26b}"
    volumes:
      - ollama-models:/root/.ollama
    # Keep identical to the Dockerfile HEALTHCHECK, which this one replaces.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    # The host runs cross-build chains too; the cap keeps a 26B model from OOMing a build.
    mem_limit: 40g
    restart: unless-stopped

  open-webui:
    # Pinned: a moving tag breaks benchmark comparability, and a volume written by a newer image may not migrate back.
    image: ghcr.io/open-webui/open-webui:v0.11.4
    ports:
      # Loopback-only by default; see docker-compose.lan.yml for LAN exposure.
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: "http://ollama:8080"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set (e.g. in .env)}"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  glances:
    image: nicolargo/glances:4.5.7-full
    ports:
      # Loopback only: Glances exposes full host telemetry unauthenticated.
      - "127.0.0.1:61208:61208"
    command: glances -w
    restart: unless-stopped

volumes:
  ollama-models:
  open-webui-data:
