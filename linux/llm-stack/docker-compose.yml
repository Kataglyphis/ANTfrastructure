services:
  ollama:
    build: .
    image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:llm-stack
    ports:
      - "8080:8080"
    environment:
      OLLAMA_PULL_MODELS: "gemma4:12b"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:
  open-webui-data:
