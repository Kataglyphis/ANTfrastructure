# LAN exposure on 0.0.0.0, trusted networks only: Ollama and Glances are unauthenticated. `!override` avoids double-binding.
services:
  ollama:
    ports: !override
      - "0.0.0.0:11434:8080"

  open-webui:
    ports: !override
      - "0.0.0.0:3000:8080"

  glances:
    ports: !override
      - "0.0.0.0:61208:61208"
