services:
  webserver:
    build:
      context: .
      dockerfile: webserver/Dockerfile
      # The built site, from wherever it was built. It is NOT in this repository
      # (see linux/webserver/README.md): override the path for your checkout, or
      # point it at a downloaded CI artifact.
      additional_contexts:
        site: ../../jotrockenmitlocken/build/web
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  beschleuniger:
    image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross
    ports:
      - "8443:8443"
    volumes:
      - ../../../OmniAccelerANT/third_party/AccelerANTgine:/AccelerANTgine:ro
      - ./scripts/04-runtime/start-webrtc-signalling.sh:/usr/local/bin/start-webrtc-signalling.sh:ro
    command: ["/usr/local/bin/start-webrtc-signalling.sh"]
    restart: unless-stopped