---
# pi-1 runs the ansible venv itself, so it uses the local connection —
# every OTHER node is managed over SSH (ssh_config / .ssh/).
#
# ORDER IS LOAD-BEARING: update.yml runs with serial:1 in inventory order and
# pi-1 must go LAST — it is the control node, and only a trailing
# shutdown -r +2 lets the playbook finish before the machine goes down.
#
# Address and login live in inventory/host_vars/<host>.yml — GITIGNORED, so
# no LAN topology reaches the remote. The .example file is the template.
all:
  children:
    pis:
      hosts:
        pi-2:
          # values in host_vars/pi-2.yml (gitignored) + .ssh/known_hosts
        pi-1:
          ansible_connection: local
