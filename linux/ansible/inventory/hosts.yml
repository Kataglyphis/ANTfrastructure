---
# Order is load-bearing: serial:1, control node pi-1 LAST and reboot-delayed.
all:
  children:
    fleet:
      children:
        pis:
          hosts:
            pi-2: {}                  # host_vars/pi-2.yml (gitignored)
            sbc-1: {}                 # host_vars/sbc-1.yml (gitignored)
            catcam-2: {}              # host_vars/catcam-2.yml (gitignored; the cat cam Pi)
            pi-3: {}                  # host_vars/pi-3.yml (gitignored)
        servers:
          hosts:
            srv-1: {}                 # host_vars/srv-1.yml (gitignored)
        control:
          hosts:
            pi-1:
              ansible_connection: local
    windows:
      hosts:
        win-1: {}                     # host_vars/win-1.yml (gitignored)
