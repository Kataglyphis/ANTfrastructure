---
# One host's secrets as one age file: tar runs on the host, age on the hub, and no plaintext copy is written anywhere.
- name: "Secrets of {{ backup_source }}"
  vars:
    sec_vars: "{{ hostvars[backup_source] }}"
    sec_local: "{{ sec_vars.ansible_connection | default('ssh') == 'local' }}"
    sec_user: "{{ sec_vars.ansible_user | default(lookup('env', 'USER')) }}"
    sec_dir: "{{ backup_target }}/secrets/{{ backup_source }}"
    sec_file: "{{ sec_dir }}/{{ backup_source }}-{{ backup_stamp }}.tar.gz.age"
  block:
    - name: "Secrets of {{ backup_source }}: create the NAS directory"
      ansible.builtin.file:
        path: "{{ sec_dir }}"
        state: directory
        mode: "0700"

    - name: "Secrets of {{ backup_source }}: bundle and encrypt them"
      ansible.builtin.command:
        argv: "{{ [backup_ansible_dir + '/scripts/backup-secrets.sh', '--out', sec_file]
          + ((['-r'] * backup_age_recipients | length) | zip(backup_age_recipients) | flatten(levels=1))
          + ([] if sec_local else ['--remote', sec_user + '@' + (sec_vars.ansible_host | default(backup_source)),
                                   '--ssh-config', 'ssh_config'] + (['--sudo'] if sec_user != 'root' else []))
          + ['--'] + sec_vars.backup_secret_paths }}"
        chdir: "{{ backup_ansible_dir }}"
      register: sec_bundle

    - name: "Secrets of {{ backup_source }}: keep the newest bundles on the NAS"
      ansible.builtin.include_tasks: backup-keep-newest.yml
      vars:
        keep_dir: "{{ sec_dir }}"
        keep_pattern: "*.tar.gz.age"
        keep_count: "{{ backup_secrets_keep | default(12) }}"

    - name: "Secrets of {{ backup_source }}: report the bundle"
      ansible.builtin.debug:
        msg: "BACKUP: secrets {{ backup_source }}: {{ sec_bundle.stdout | regex_search('entries=[0-9]+') | regex_replace('[^0-9]', '') }}
          item(s) in {{ sec_file | basename }}, encrypted for {{ backup_age_recipients | length }} key(s)"

  rescue:
    - name: "Secrets of {{ backup_source }}: record the failure, then go on with the next source"
      ansible.builtin.set_fact:
        backup_failures: "{{ backup_failures + ['secrets ' + backup_source] }}"

    - name: "Secrets of {{ backup_source }}: name the step that failed"
      ansible.builtin.debug:
        msg: "BACKUP: FAILED secrets {{ backup_source }} at: {{ ansible_failed_task.name }}"
