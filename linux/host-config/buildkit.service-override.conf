# CANONICAL systemd user drop-in for rootless BuildKit (backlog HC1).
# Live copy: ~/.config/systemd/user/buildkit.service.d/override.conf
# Apply via linux/host-config/apply-host-config.sh (never while a chain runs).
#
# Speedup: use host networking for rootless BuildKit OCI worker so build-time
# downloads (git fetch/curl/wget inside RUN steps, e.g. the LLVM source) do
# not go through the slow rootless bridge/slirp path.
# Clearing ExecStart first is required before redefining it in a drop-in.
#
# @NERDCTL_PREFIX@ is substituted at apply time by apply-host-config.sh (and by
# verify-host-config.sh before it diffs) with the prefix the live systemd --user
# units already name. It is NOT a literal: a drop-in ExecStart OVERRIDES the
# unit file's, so a hardcoded /usr/local here silently reverted a rootless
# $HOME/.local install the moment host config was applied (2026-09-08).
#
[Service]
# Raise the 2 MiB per-step log clip that swallows causal WARNs (backlog
# Batch 0, applied 2026-08-12 with the post-:latest-cross restart window).
Environment=BUILDKIT_STEP_LOG_MAX_SIZE=52428800
ExecStart=
ExecStart="@NERDCTL_PREFIX@/bin/containerd-rootless-setuptool.sh" nsenter -- buildkitd --oci-worker=true --oci-worker-rootless=true --containerd-worker=false --oci-worker-net=host --allow-insecure-entitlement network.host
