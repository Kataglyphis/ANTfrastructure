# Canonical rootless-BuildKit config; install with apply-host-config.sh, check drift with verify-host-config.sh.

# Registry: mirrors image pulls only; RUN-step downloads are sped up by the override.conf host networking.
[registry."docker.io"]
  mirrors = ["mirror.gcr.io"]

# Worker
[worker.oci]
  # The default GC evicts the multi-hour layers between runs.
  gc = true
  gckeepstorage = 500000000000

  # Layer cache goes first, cachemounts only in the backstop; the gcpolicy overrides gckeepstorage. Reclaim with prune-safe.sh.
  [[worker.oci.gcpolicy]]
    # Layer cache down to 450 GB, oldest first.
    filters = ["type==regular"]
    keepBytes = 450000000000
  [[worker.oci.gcpolicy]]
    # Total backstop, the only pass that may touch cachemounts.
    all = true
    keepBytes = 500000000000

  # Each ninja sizes its jobs as if alone, so unbounded parallel stages overcommit RAM.
  max-parallelism = 4
