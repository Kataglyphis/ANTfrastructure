- id: '1723790105072'
  alias: Automatisches Proteinefalten
  description: ''
  triggers:
  - type: power
    device_id: 21b7a24751e24219971550406bbc70f0
    entity_id: e921d4f2a64dd07795908df990f7d8c6
    domain: sensor
    below: -169
    for:
      hours: 0
      minutes: 2
      seconds: 0
    trigger: device
  conditions: []
  actions:
  - sequence:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.rechenkiste
    - action: shell_command.sleep_for_90sec
      metadata: {}
      data: {}
      enabled: false
    - action: shell_command.turn_off_both_gpus
      metadata: {}
      data: {}
      enabled: false
    - action: input_select.select_option
      metadata: {}
      data:
        option: No GPU
      target:
        entity_id: input_select.proteinfaltungszustand
      enabled: false
  mode: single
