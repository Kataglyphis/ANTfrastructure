- id: '1725436842778'
  alias: Proteinfaltung ausschalten
  description: ''
  trigger:
  - platform: time_pattern
    minutes: '5'
  - platform: time_pattern
    minutes: '10'
  - platform: time_pattern
    minutes: '15'
  - platform: time_pattern
    minutes: '20'
  - platform: time_pattern
    minutes: '25'
  - platform: time_pattern
    minutes: '30'
  - platform: time_pattern
    minutes: '35'
  - platform: time_pattern
    minutes: '40'
  - platform: time_pattern
    minutes: '45'
  - platform: time_pattern
    minutes: '50'
  - platform: time_pattern
    minutes: '55'
  - platform: time_pattern
    minutes: '0'
  condition:
  - condition: and
    conditions:
    - condition: state

automation:
  - alias: "Shell Command via Input Button"
    trigger:
      platform: state
      entity_id: input_button.shell_command_button
      to: "pressed"
    action:
      service: shell_command.befehl_ausfuehren

      entity_id: input_select.proteinfaltungszustand
      state: No GPU
      for:
        hours: 0
        minutes: 5
        seconds: 0
      enabled: true
    - type: is_power
      condition: device
      device_id: 21b7a24751e24219971550406bbc70f0
      entity_id: e921d4f2a64dd07795908df990f7d8c6
      domain: sensor
      above: 0
    - condition: sun
      before: sunset
      after: sunrise
  action:
  - sequence:
    - action: shell_command.turn_off_both_gpus
      metadata: {}
      data: {}
    - action: input_select.select_option
      metadata: {}
      data:
        option: No GPU
      target:
        entity_id: input_select.proteinfaltungszustand
    - action: switch.turn_off
      target:
        entity_id: switch.rechenkiste
      data: {}
  mode: parallel
  max: 10
