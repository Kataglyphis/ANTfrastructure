<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2933; --link: #0e7490; }
@media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #e5e7eb; --link: #22d3ee; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
       font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 36rem; padding: 0 16px; }
a { color: var(--link); }
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>This page does not exist on this documentation site, or it moved when the site was rebuilt.</p>
<p><a href="/">Go to the start page</a></p>
</main>
</body>
</html>
