user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Add missing MIME types for modern web applications
    types {
        text/javascript mjs;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log notice;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 45s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ===== HTTP SERVER - REDIRECT TO HTTPS =====
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # ===== HTTPS SERVER =====
    server {
        # `listen ... http2` is deprecated since nginx 1.25.1; use the
        # standalone `http2` directive instead.
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;

        server_name _;
        root /var/www/html;
        index index.html index.htm;

        # ===== SSL CONFIGURATION =====
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL session cache
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # OCSP stapling removed: this server runs a SELF-SIGNED cert (see
        # entrypoint.sh), which has no OCSP responder — ssl_stapling was a
        # no-op and only forced a hardcoded public resolver (8.8.8.8) into the
        # config. The resolver below serves the proxy_pass variable pattern
        # instead: 127.0.0.11 is Docker's embedded DNS.
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;

        # ===== GLOBAL SECURITY HEADERS =====
        # NOTE the add_header inheritance trap: any location that sets its own
        # add_header loses ALL of these and must re-include the snippet.
        include /etc/nginx/security-headers.conf;

        # ===== RATE LIMITING =====
        limit_req zone=req_zone burst=20 nodelay;
        limit_conn addr 20;

        # ========== DENY HIDDEN FILES ==========
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ========== HEALTH CHECK ==========
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            include /etc/nginx/security-headers.conf;
        }

        # ========== CRITICAL: /pkg/ DIRECTORY ==========
        location ^~ /pkg/ {
            # Re-add all security headers (inheritance trap)
            include /etc/nginx/security-headers.conf;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            gzip off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, immutable" always;
        }

        # ========== SERVICE WORKER ==========
        location = /flutter_service_worker.js {
            types { }
            default_type application/javascript;

            # Re-add all security headers (inheritance trap)
            include /etc/nginx/security-headers.conf;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        # ========== MJS FILES (ES6 Modules) - MUST BE BEFORE SPA FALLBACK ==========
        location ~ \.mjs$ {
            root /var/www/html;

            # Set MIME type
            types { }
            default_type text/javascript;

            # Test header to verify this location is being used
            add_header X-Debug-Location "mjs-block" always;

            # Security and CORS headers (CRITICAL for SharedArrayBuffer)
            include /etc/nginx/security-headers.conf;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        # ========== WASM FILES ==========
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;

            # Re-add all security headers (inheritance trap)
            include /etc/nginx/security-headers.conf;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            gzip off;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ========== JS FILES (but NOT .mjs files - those are handled above) ==========
        location ~* (?<!m)\.js$ {
            types { }
            default_type application/javascript;

            # Re-add all security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        # ========== HTML FILES ==========
        location ~* \.(?:html|htm)$ {
            types { }
            default_type text/html;

            # Full security-header set (previously only COOP/COEP/HSTS were
            # re-added here — the HTML pages shipped WITHOUT X-Frame-Options/
            # X-Content-Type-Options due to the inheritance trap).
            include /etc/nginx/security-headers.conf;

            expires 0;
            add_header Cache-Control "no-cache, must-revalidate, public" always;
        }

        # ========== MANIFEST & JSON ==========
        location ~* \.(?:manifest|json)$ {
            types { }
            default_type application/json;

            # Re-add all security headers (inheritance trap)
            include /etc/nginx/security-headers.conf;

            expires 0;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # ========== ASSETS ==========
        location ~* \.(?:css|svg|png|jpg|jpeg|gif|ico|webp|avif|ttf|otf|woff|woff2|eot)$ {
            # Re-add all security headers (inheritance trap)
            include /etc/nginx/security-headers.conf;

            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ========== WEBRTC SIGNALLING WEBSOCKET PROXY ==========
        # Targets the `beschleuniger` compose service (see linux/docker-compose.yml),
        # which runs the signalling server on 8443. 127.0.0.1 would be nginx's own
        # container, not the signalling container, so it must be the service name.
        # Variable + resolver (server-level, 127.0.0.11) defers DNS to request
        # time: a literal proxy_pass hostname resolves at config LOAD, so the
        # image crash-looped ("host not found") whenever it started standalone
        # or before the beschleuniger service.
        location /webrtc-ws {
            set $upstream_beschleuniger beschleuniger:8443;
            proxy_pass http://$upstream_beschleuniger;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ========== SPA FALLBACK ROUTING ==========
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ========== ERROR PAGES ==========
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
