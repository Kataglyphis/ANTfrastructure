user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Add missing MIME types for modern web applications
    types {
        text/javascript mjs;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log notice;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 45s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ===== HTTP SERVER - REDIRECT TO HTTPS =====
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # ===== HTTPS SERVER =====
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;

        server_name _;
        root /var/www/html;
        index index.html index.htm;

        # ===== SSL CONFIGURATION =====
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL session cache
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ===== GLOBAL SECURITY HEADERS =====
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ===== REQUIRED FOR FLUTTER WASM MULTI-THREADING =====
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # ===== RATE LIMITING =====
        limit_req zone=req_zone burst=20 nodelay;
        limit_conn addr 20;

        # ========== DENY HIDDEN FILES ==========
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ========== HEALTH CHECK ==========
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            # Re-add COOP/COEP
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        # ========== CRITICAL: /pkg/ DIRECTORY ==========
        location ^~ /pkg/ {
            # Re-add all security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            gzip off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, immutable" always;
        }

        # ========== SERVICE WORKER ==========
        location = /flutter_service_worker.js {
            types { }
            default_type application/javascript;

            # Re-add all security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        # ========== MJS FILES (ES6 Modules) - MUST BE BEFORE SPA FALLBACK ==========
        location ~ \.mjs$ {
            root /var/www/html;

            # Set MIME type
            types { }
            default_type text/javascript;

            # Test header to verify this location is being used
            add_header X-Debug-Location "mjs-block" always;

            # Security and CORS headers (CRITICAL for SharedArrayBuffer)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        # ========== WASM FILES ==========
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;

            # Re-add all security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            gzip off;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ========== JS FILES (but NOT .mjs files - those are handled above) ==========
        location ~* (?<!m)\.js$ {
            types { }
            default_type application/javascript;

            # Re-add all security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        # ========== HTML FILES ==========
        location ~* \.(?:html|htm)$ {
            types { }
            default_type text/html;

            # Re-add COOP/COEP (critical for main page)
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            expires 0;
            add_header Cache-Control "no-cache, must-revalidate, public" always;
        }

        # ========== MANIFEST & JSON ==========
        location ~* \.(?:manifest|json)$ {
            types { }
            default_type application/json;

            # Re-add COOP/COEP
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            expires 0;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # ========== ASSETS ==========
        location ~* \.(?:css|svg|png|jpg|jpeg|gif|ico|webp|avif|ttf|otf|woff|woff2|eot)$ {
            # Re-add COOP/COEP
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ========== SPA FALLBACK ROUTING ==========
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ========== ERROR PAGES ==========
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
