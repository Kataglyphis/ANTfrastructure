# Shared security-header set. nginx add_header inheritance is all-or-nothing:
# ANY add_header inside a location drops EVERY server-level header, so every
# location that adds its own headers (Cache-Control etc.) must re-include this
# snippet. Included at server level for locations that add nothing.
# X-XSS-Protection is deliberately absent (obsolete; the auditor it targeted
# was removed from all major browsers).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Required for Flutter WASM multi-threading (SharedArrayBuffer)
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
