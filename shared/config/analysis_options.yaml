# Shared Dart analyzer config, included by reference rather than copied; see shared/config/README.md

# Resolved against the consumer's package config, so every consumer needs flutter_lints in dev_dependencies.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated or platform-owned code no app lint has anything to say about.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # Only rules the whole family agrees on; project-specific ones belong in the consumer's file.
  rules:

# See https://dart.dev/guides/language/analysis-options
